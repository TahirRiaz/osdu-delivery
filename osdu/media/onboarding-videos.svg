<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 776" width="1280" height="776" role="img" aria-labelledby="title desc">
  <title id="title">OSDU Delivery onboarding: twelve videos in five parts</title>
  <desc id="desc">Twelve videos in the order to watch them, in five parts, each tagged for data engineers, for extending the framework, or both. Start here: why it exists, how it works. Into the tables: load only what changed, one new column. Row to record: write a mapping, ask once and render many, will it send. Into OSDU: five doors and ten routes, eight ledger states, 5,000 records on one worker. Build and extend: the code doesn't change, inside the codebase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1624"/>
      <stop offset="1" stop-color="#15243b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b56b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#f2b56b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9db0c6" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="776" rx="28"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .kick { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #9cc8ff; }
    .title { font-size: 56px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .sub { font-size: 21px; fill: #a9bbd0; }
    .cta { font-size: 18px; font-weight: 700; fill: #0d1624; }
    .legend { font-size: 15px; fill: #a9bbd0; }
    .part { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #d5e0ee; }
    .partnum { fill: #7f93ab; }
    .rail { stroke: #3a4d66; stroke-width: 2; }
    .tile { fill: #172840; fill-opacity: 0.82; stroke: #2a3b52; stroke-width: 1.5; }
    .num { font-size: 15px; font-weight: 800; letter-spacing: 2px; fill: #7f93ab; }
    .name { font-size: 22px; font-weight: 700; fill: #ffffff; }
    .meta { font-size: 16px; fill: #a9bbd0; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: 0.55; } to { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="776" fill="url(#bg)"/>
    <rect width="1280" height="776" fill="url(#dots)"/>
    <ellipse cx="460" cy="481" rx="620" ry="260" fill="url(#warmth)"/>
    <ellipse cx="1060" cy="512" rx="360" ry="260" fill="url(#cool)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="774.5" rx="27.5" fill="none" stroke="#2a3b52" stroke-width="1.5"/>

  <text class="kick" x="64" y="72">OSDU DELIVERY · ONBOARDING</text>
  <text class="title" x="62" y="130">Learn it in twelve videos.</text>
  <text class="sub" x="64" y="168">Five parts, in the order to watch them, each tagged for whom it serves.</text>

  <rect x="1004" y="50" width="212" height="50" rx="25" fill="#f2b56b"/>
  <text class="cta" x="1110" y="81" text-anchor="middle">Watch them →</text>
