    <path d="M878 285 L892 291 V301 C892 310 886 316 878 319 C870 316 864 310 864 301 V291 Z" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M871 302 L876 307 L885 297" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="desc" x="860" y="352">What OSDU really</text>
    <text class="desc" x="860" y="374">holds, and proof</text>
    <text class="desc" x="860" y="396">that it is right.</text>
