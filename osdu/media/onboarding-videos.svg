    <path d="M684 285 V305 M676 297 L684 305 L692 297" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M668 305 V317 H700 V305" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="desc" x="666" y="352">How records reach</text>
