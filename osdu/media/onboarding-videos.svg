<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 474" width="1280" height="474" role="img" aria-labelledby="title desc">
  <title id="title">OSDU Delivery onboarding: the videos in five parts</title>
  <desc id="desc">The onboarding videos in the order to watch them, in five parts, each video tagged for data engineers, for extending the framework, or both. Start here: why it exists, and how its parts fit together. Into the tables: how source files land, and only what changed is written. Row to record: how a row becomes an OSDU record, and when it sends again. Into OSDU: how records reach OSDU, and how each is accounted for. Build and extend: configure it with an assistant, or change the framework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1624"/>
      <stop offset="1" stop-color="#15243b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b56b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#f2b56b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9db0c6" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="474" rx="28"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .kick { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #9cc8ff; }
    .title { font-size: 56px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .sub { font-size: 21px; fill: #a9bbd0; }
    .cta { font-size: 18px; font-weight: 700; fill: #0d1624; }
    .part { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #d5e0ee; }
    .partnum { fill: #7f93ab; }
    .rail { stroke: #3a4d66; stroke-width: 2; }
    .tile { fill: #172840; fill-opacity: 0.82; stroke: #2a3b52; stroke-width: 1.5; }
    .desc { font-size: 18px; fill: #d5e0ee; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: 0.55; } to { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="474" fill="url(#bg)"/>
    <rect width="1280" height="474" fill="url(#dots)"/>
    <ellipse cx="460" cy="313" rx="620" ry="220" fill="url(#warmth)"/>
    <ellipse cx="1060" cy="332" rx="360" ry="220" fill="url(#cool)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="472.5" rx="27.5" fill="none" stroke="#2a3b52" stroke-width="1.5"/>

  <text class="kick" x="64" y="72">OSDU DELIVERY · ONBOARDING</text>
  <text class="title" x="62" y="130">Learn it from the videos.</text>
  <text class="sub" x="64" y="168">In the order to watch them, each tagged for data engineers, for extending, or both.</text>

  <rect x="1004" y="50" width="212" height="50" rx="25" fill="#f2b56b"/>
  <text class="cta" x="1110" y="81" text-anchor="middle">Watch them →</text>

  <line class="rail" x1="70" y1="242" x2="1208" y2="242"/>
  <path d="M1206 236 L1216 242 L1206 248 Z" fill="#3a4d66"/>
  <text class="part" x="64" y="226"><tspan class="partnum">1</tspan>  START HERE</text>
  <circle cx="70" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="298" y="226"><tspan class="partnum">2</tspan>  INTO THE TABLES</text>
  <circle cx="304" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="532" y="226"><tspan class="partnum">3</tspan>  ROW TO RECORD</text>
  <circle cx="538" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="766" y="226"><tspan class="partnum">4</tspan>  INTO OSDU</text>
  <circle cx="772" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="1000" y="226"><tspan class="partnum">5</tspan>  BUILD AND EXTEND</text>
  <circle cx="1006" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <g>
    <rect class="tile" x="64" y="262" width="216" height="164" rx="18" style="stroke: #ffffff; stroke-opacity: 0.55"/>
    <circle cx="106" cy="304" r="34" fill="url(#glow)"/>
    <circle class="pulse" cx="106" cy="304" r="17" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="106" cy="304" r="17" fill="#ffffff"/>
    <path d="M101.5 296.5 L114.5 304 L101.5 311.5 Z" fill="#0d1624"/>
    <text class="desc" x="88" y="358">Why it exists, and</text>
    <text class="desc" x="88" y="382">how its parts fit</text>
    <text class="desc" x="88" y="406">together.</text>
  </g>
  <g>
    <rect class="tile" x="298" y="262" width="216" height="164" rx="18"/>
    <rect x="323" y="290" width="34" height="28" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M323 299 H357 M323 308.5 H357 M335 299 V318" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="desc" x="322" y="358">How source files</text>
    <text class="desc" x="322" y="382">land, and only what</text>
    <text class="desc" x="322" y="406">changed is written.</text>
  </g>
  <g>
    <rect class="tile" x="532" y="262" width="216" height="164" rx="18"/>
    <path d="M563 287 H578 L586 295 V321 H563 Z M578 287 V295 H586" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M568 303 H581 M568 309 H581 M568 315 H576" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="desc" x="556" y="358">How a row becomes</text>
    <text class="desc" x="556" y="382">an OSDU record, and</text>
    <text class="desc" x="556" y="406">when it sends again.</text>
  </g>
  <g>
    <rect class="tile" x="766" y="262" width="216" height="164" rx="18"/>
    <path d="M808 287 V307 M800 299 L808 307 L816 299" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M792 307 V319 H824 V307" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="desc" x="790" y="358">How records reach</text>
    <text class="desc" x="790" y="382">OSDU, and how each</text>
    <text class="desc" x="790" y="406">is accounted for.</text>
  </g>
  <g>
    <rect class="tile" x="1000" y="262" width="216" height="164" rx="18"/>
    <path d="M1034 294 L1025 304 L1034 314 M1050 294 L1059 304 L1050 314 M1045 290 L1039 318" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="desc" x="1024" y="358">Configure it with an</text>
    <text class="desc" x="1024" y="382">assistant, or change</text>
    <text class="desc" x="1024" y="406">the framework.</text>
  </g>
</svg>
