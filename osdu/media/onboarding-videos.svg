    <circle class="pulse" cx="102" cy="302" r="17" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="102" cy="302" r="17" fill="#ffffff"/>
    <path d="M97.5 294.5 L110.5 302 L97.5 309.5 Z" fill="#0d1624"/>
