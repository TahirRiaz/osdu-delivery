<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">OSDU Delivery onboarding: ten videos</title>
  <desc id="desc">Ten videos in the order to watch them, each tagged for data engineers, for extending the framework, or both: why it exists, how it works, five doors and ten routes, write a mapping, one new column, will it send, eight ledger states, 5,000 records on one worker, the code doesn't change, and inside the codebase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1624"/>
      <stop offset="1" stop-color="#15243b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b56b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#f2b56b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9db0c6" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="640" rx="28"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .kick { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #9cc8ff; }
    .title { font-size: 56px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .sub { font-size: 21px; fill: #a9bbd0; }
    .cta { font-size: 18px; font-weight: 700; fill: #0d1624; }
    .legend { font-size: 15px; fill: #a9bbd0; }
    .tile { fill: #172840; fill-opacity: 0.82; stroke: #2a3b52; stroke-width: 1.5; }
    .num { font-size: 15px; font-weight: 800; letter-spacing: 2px; fill: #7f93ab; }
    .name { font-size: 22px; font-weight: 700; fill: #ffffff; }
    .meta { font-size: 16px; fill: #a9bbd0; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: 0.55; } to { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#dots)"/>
    <ellipse cx="460" cy="400" rx="620" ry="230" fill="url(#warmth)"/>
    <ellipse cx="1060" cy="420" rx="360" ry="230" fill="url(#cool)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="638.5" rx="27.5" fill="none" stroke="#2a3b52" stroke-width="1.5"/>

  <text class="kick" x="64" y="72">OSDU DELIVERY · ONBOARDING</text>
  <text class="title" x="62" y="130">Learn it in ten videos.</text>
  <text class="sub" x="64" y="168">In the order to watch them, each tagged for whom it serves.</text>

  <rect x="1004" y="50" width="212" height="50" rx="25" fill="#f2b56b"/>
  <text class="cta" x="1110" y="81" text-anchor="middle">Watch them →</text>
  <g transform="translate(944 142)">
    <circle r="7" fill="#f2b56b"/>
    <text class="legend" x="14" y="5">data engineer</text>
  </g>
  <g transform="translate(1092 142)">
    <circle r="7" fill="#9cc8ff"/>
    <text class="legend" x="14" y="5">extending</text>
  </g>

  <g>
    <rect class="tile" x="64" y="204" width="216" height="190" rx="18" style="stroke: #ffffff; stroke-opacity: 0.55"/>
    <text class="num" x="88" y="248">01</text>
    <circle cx="242" cy="242" r="34" fill="url(#glow)"/>
    <circle class="pulse" cx="242" cy="242" r="16" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="242" cy="242" r="16" fill="#ffffff"/>
    <path d="M237.5 235 L250 242 L237.5 249 Z" fill="#0d1624"/>
    <text class="name" x="88" y="306">Why it</text>
    <text class="name" x="88" y="332">exists</text>
    <text class="meta" x="88" y="372">3:42</text>
    <circle cx="254" cy="366" r="7" fill="#9cc8ff"/>
    <circle cx="232" cy="366" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="298" y="204" width="216" height="190" rx="18"/>
    <text class="num" x="322" y="248">02</text>
    <circle cx="476" cy="242" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M471.5 235 L484 242 L471.5 249 Z" fill="#ffffff"/>
    <text class="name" x="322" y="306">How it</text>
    <text class="name" x="322" y="332">works</text>
    <text class="meta" x="322" y="372">6:18</text>
    <circle cx="488" cy="366" r="7" fill="#9cc8ff"/>
    <circle cx="466" cy="366" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="532" y="204" width="216" height="190" rx="18"/>
    <text class="num" x="556" y="248">03</text>
    <circle cx="710" cy="242" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M705.5 235 L718 242 L705.5 249 Z" fill="#ffffff"/>
    <text class="name" x="556" y="306">Five doors,</text>
    <text class="name" x="556" y="332">ten routes</text>
    <text class="meta" x="556" y="372">16:15</text>
    <circle cx="722" cy="366" r="7" fill="#9cc8ff"/>
    <circle cx="700" cy="366" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="766" y="204" width="216" height="190" rx="18"/>
    <text class="num" x="790" y="248">04</text>
    <circle cx="944" cy="242" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M939.5 235 L952 242 L939.5 249 Z" fill="#ffffff"/>
    <text class="name" x="790" y="306">Write a</text>
    <text class="name" x="790" y="332">mapping</text>
    <text class="meta" x="790" y="372">17:30</text>
    <circle cx="956" cy="366" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="1000" y="204" width="216" height="190" rx="18"/>
    <text class="num" x="1024" y="248">05</text>
    <circle cx="1178" cy="242" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M1173.5 235 L1186 242 L1173.5 249 Z" fill="#ffffff"/>
    <text class="name" x="1024" y="306">One new</text>
    <text class="name" x="1024" y="332">column</text>
    <text class="meta" x="1024" y="372">9:52</text>
    <circle cx="1190" cy="366" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="64" y="412" width="216" height="190" rx="18"/>
    <text class="num" x="88" y="456">06</text>
    <circle cx="242" cy="450" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M237.5 443 L250 450 L237.5 457 Z" fill="#ffffff"/>
    <text class="name" x="88" y="514">Will it</text>
    <text class="name" x="88" y="540">send?</text>
    <text class="meta" x="88" y="580">9:52</text>
    <circle cx="254" cy="574" r="7" fill="#9cc8ff"/>
    <circle cx="232" cy="574" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="298" y="412" width="216" height="190" rx="18"/>
    <text class="num" x="322" y="456">07</text>
    <circle cx="476" cy="450" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M471.5 443 L484 450 L471.5 457 Z" fill="#ffffff"/>
    <text class="name" x="322" y="514">Eight ledger</text>
    <text class="name" x="322" y="540">states</text>
    <text class="meta" x="322" y="580">13:13</text>
    <circle cx="488" cy="574" r="7" fill="#9cc8ff"/>
    <circle cx="466" cy="574" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="532" y="412" width="216" height="190" rx="18"/>
    <text class="num" x="556" y="456">08</text>
    <circle cx="710" cy="450" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M705.5 443 L718 450 L705.5 457 Z" fill="#ffffff"/>
    <text class="name" x="556" y="514">5,000 records,</text>
    <text class="name" x="556" y="540">one worker</text>
    <text class="meta" x="556" y="580">9:52</text>
    <circle cx="722" cy="574" r="7" fill="#9cc8ff"/>
    <circle cx="700" cy="574" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="766" y="412" width="216" height="190" rx="18"/>
    <text class="num" x="790" y="456">09</text>
    <circle cx="944" cy="450" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M939.5 443 L952 450 L939.5 457 Z" fill="#ffffff"/>
    <text class="name" x="790" y="514">The code</text>
    <text class="name" x="790" y="540">doesn't change</text>
    <text class="meta" x="790" y="580">8:09</text>
    <circle cx="956" cy="574" r="7" fill="#f2b56b"/>
  </g>
  <g>
    <rect class="tile" x="1000" y="412" width="216" height="190" rx="18"/>
    <text class="num" x="1024" y="456">10</text>
    <circle cx="1178" cy="450" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M1173.5 443 L1186 450 L1173.5 457 Z" fill="#ffffff"/>
    <text class="name" x="1024" y="514">Inside the</text>
    <text class="name" x="1024" y="540">codebase</text>
    <text class="meta" x="1024" y="580">12:58</text>
    <circle cx="1190" cy="574" r="7" fill="#9cc8ff"/>
  </g>
</svg>
