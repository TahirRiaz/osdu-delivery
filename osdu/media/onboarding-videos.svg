<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 482" width="1280" height="482" role="img" aria-labelledby="title desc">
  <title id="title">OSDU Delivery onboarding: the videos in parts</title>
  <desc id="desc">The onboarding videos in parts, in the order to watch them, each video tagged for data engineers, for extending the framework, or both. Start here: why it exists, and how its parts fit together. Into the tables: which flow to use, how source files land, and only what changed is written. Row to record: how a row becomes an OSDU record, and when it sends again. Into OSDU: how records reach OSDU, and how each is accounted for. After delivery: what OSDU really holds, and proof that it is right. Build and extend: use the assistant, run from GitHub, or change the framework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1624"/>
      <stop offset="1" stop-color="#15243b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b56b" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#f2b56b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9cc8ff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9db0c6" fill-opacity="0.11"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="482" rx="28"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .kick { font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #9cc8ff; }
    .title { font-size: 56px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .sub { font-size: 21px; fill: #a9bbd0; }
    .cta { font-size: 18px; font-weight: 700; fill: #0d1624; }
    .part { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #d5e0ee; }
    .partnum { fill: #7f93ab; }
    .rail { stroke: #3a4d66; stroke-width: 2; }
    .tile { fill: #172840; fill-opacity: 0.82; stroke: #2a3b52; stroke-width: 1.5; }
    .desc { font-size: 16px; fill: #d5e0ee; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: 0.55; } to { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="482" fill="url(#bg)"/>
    <rect width="1280" height="482" fill="url(#dots)"/>
    <ellipse cx="460" cy="318" rx="620" ry="220" fill="url(#warmth)"/>
    <ellipse cx="1060" cy="337" rx="360" ry="220" fill="url(#cool)"/>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="480.5" rx="27.5" fill="none" stroke="#2a3b52" stroke-width="1.5"/>

  <text class="kick" x="64" y="72">OSDU DELIVERY · ONBOARDING</text>
  <text class="title" x="62" y="130">Learn it from the videos.</text>
  <text class="sub" x="64" y="168">In the order to watch them, each tagged for data engineers, for extending, or both.</text>

  <rect x="1004" y="50" width="212" height="50" rx="25" fill="#f2b56b"/>
  <text class="cta" x="1110" y="81" text-anchor="middle">Watch them →</text>

  <line class="rail" x1="70" y1="242" x2="1204" y2="242"/>
  <path d="M1202 236 L1212 242 L1202 248 Z" fill="#3a4d66"/>
  <text class="part" x="64" y="226"><tspan class="partnum">1</tspan>  START HERE</text>
  <circle cx="70" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="258" y="226"><tspan class="partnum">2</tspan>  INTO THE TABLES</text>
  <circle cx="264" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="452" y="226"><tspan class="partnum">3</tspan>  ROW TO RECORD</text>
  <circle cx="458" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="646" y="226"><tspan class="partnum">4</tspan>  INTO OSDU</text>
  <circle cx="652" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="840" y="226"><tspan class="partnum">5</tspan>  AFTER DELIVERY</text>
  <circle cx="846" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <text class="part" x="1034" y="226"><tspan class="partnum">6</tspan>  BUILD AND EXTEND</text>
  <circle cx="1040" cy="242" r="5" fill="#0d1624" stroke="#9cc8ff" stroke-width="2"/>
  <g>
