# EXAMPLE ONLY: create the real secret out of band (kubectl create secret / ExternalSecrets / CSI driver), never
# commit real values. Every deployment in this directory references these keys.
apiVersion: v1
kind: Secret
metadata:
  name: osdu-delivery-secrets
  namespace: osdu-delivery
type: Opaque
stringData:
  # The catalog database connection string (SQL auth or a managed-identity form your cluster supports). It also
  # holds the OSDU module's `osdu` schema, so the control plane needs no second connection.
  catalog-connection: "Server=your-sql-server;Database=OsduDeliveryCatalog;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  # HS256 signing key, at least 32 random bytes.
  jwt-signing-key: "CHANGE_ME_32+_RANDOM_BYTES________"
  # Break-glass bootstrap secret, at least 32 bytes; rotate after provisioning real users.
  bootstrap-secret: "CHANGE_ME_32+_RANDOM_BYTES________"
  # The initial admin's password (at least 12 characters); the username lives in the deployment env.
  admin-password: "CHANGE_ME_12+_CHARS"
  # Optional: token for private git remotes (SHA-pinned materialization on nodes).
  git-token: ""
  # The nodes' credential to the control plane: a personal access token minted with the `node` scope once the
  # control plane is up (an admin: POST /api/v1/me/tokens with scopes ["node"]). Apply the control plane first,
  # mint the token, then add it here and apply the worker pools.
  node-token: ""
  # The OSDU module database connection the nodes read and write the ledger through. A node opens no catalog
  # connection, so the module database needs a reference of its own on that tier; mount it under the variable
  # the worker host declares for it (osdu/docs/environment-variables.md).
  osdu-module-connection: "Server=your-sql-server;Database=OsduDeliveryCatalog;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  # The databases the delivery chain uses: pre-ingestion lands the source files in the first, the ingestion flow
  # loads the keyed ingestion tables into the second, and the OSDU flow reads those tables.
  pre-connection: "Server=your-sql-server;Database=OsduDeliveryPre;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  ingestion-connection: "Server=your-sql-server;Database=OsduDeliveryIng;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  # Every ${env:...} reference the estate's flows declare is mounted on the WORKER deployments, one entry per
  # reference. The sample estate names an OSDU client and an APIM subscription key.
  osdu-client-id: "CHANGE_ME"
  osdu-client-secret: "CHANGE_ME"
  apim-key: "CHANGE_ME"
