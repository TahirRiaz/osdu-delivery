# EXAMPLE ONLY: create the real secret out of band (kubectl create secret / ExternalSecrets / CSI driver), never
# commit real values. Every deployment in this directory references these keys.
apiVersion: v1
kind: Secret
metadata:
  name: osdu-delivery-secrets
  namespace: osdu-delivery
type: Opaque
stringData:
  # The metadata database (SQL auth or a managed-identity form your cluster supports): SQLFlow's catalog schema,
  # and the delivery module's `osdu` schema beside it.
  # The flows name it in three-part names, so keep the name OsduDelivery.
  catalog-connection: "Server=your-sql-server;Database=OsduDelivery;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  # HS256 signing key, at least 32 random bytes.
  jwt-signing-key: "CHANGE_ME_32+_RANDOM_BYTES________"
  # Break-glass bootstrap secret, at least 32 bytes; rotate after provisioning real users.
  bootstrap-secret: "CHANGE_ME_32+_RANDOM_BYTES________"
  # The initial admin's password (at least 12 characters); the username lives in the deployment env.
  admin-password: "CHANGE_ME_12+_CHARS"
  # Optional: token for private git remotes (SHA-pinned materialization on nodes).
  git-token: ""
  # The nodes' credential to the control plane: a personal access token minted with the `node` scope once the
  # control plane is up (an admin: POST /api/v1/me/tokens with scopes ["node"]). Apply the control plane first,
  # mint the token, then add it here and apply the worker pools.
  node-token: ""
  # How the NODES reach the `osdu` schema: the record ledger, the mappings, the templates and the partition
  # caches. A node opens no catalog connection at all, so it needs a connection of its own, and it is the same
  # database as catalog-connection above, ideally with a login that has rights on schema `osdu` alone. An estate
  # that must keep the module's schema in a database of its own names that database here and in the control
  # plane's Osdu__Database__Connection, before the first migrate. The nodes mount it as SQLFLOW_CATALOG_DB too, for
  # the flows that build and read the osdu schema's dimension tables and views.
  osdu-module-connection: "Server=your-sql-server;Database=OsduDelivery;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  # The data database the flows work in, ${env:OSDU_DATA_DB}: pre-ingestion lands the source files there, the
  # ingestion flows load the keyed tables, and the OSDU flows read them. The flows name it OsduData in three-part names.
  data-connection: "Server=your-sql-server;Database=OsduData;User ID=osdudelivery;Password=CHANGE_ME;TrustServerCertificate=True"
  # The OSDU partition's client secret, mounted as OSDU_CLIENT_SECRET on the control plane and the WORKER
  # deployments; the partition (controlplane.yaml's Osdu__Partitions__...) holds only the reference
  # ${env:OSDU_CLIENT_SECRET}. Its other values are no secret and live in the control plane's configuration.
  osdu-client-secret: "CHANGE_ME"
