# yaml-language-server: $schema=https://raw.githubusercontent.com/equinor/radix-operator/release/json-schema/radixapplication.json
#
# OSDU Delivery on Radix: the control plane, the GUI, the MCP server the assistant's model calls, and the workers,
# which the control plane starts and stops itself as jobs of the worker job component (managed workers). How to set
# up what this file names (identities, databases, Key Vault, Entra, AI Foundry, the registry) and how to deploy is in
# osdu/docs/reference/guides/radix.md; register the application in Radix with this file's path as its config file.
#
# Every value in angle brackets is the estate's own and must be replaced before the first deploy; Radix refuses a
# client id that is not a GUID, so a forgotten one stops the deploy rather than a running component.
#
#   controlplane  the API, the scheduler, the dispatcher and the chat assistant. ONE replica: dispatch has one owner,
#                 and a second replica refuses every node call while it does not own it. It starts the workers through
#                 the worker job component's scheduler at http://worker:8080, which only this application's own
#                 components can reach, and calls the model in AI Foundry with its workload identity.
#   gui           the SPA, calling the control plane's public address.
#   mcp           the MCP server. Public: the model's MCP tool calls it from AI Foundry with a token the control plane
#                 delegates per run, and it calls the control plane inside the application with that same token.
#   worker        a job component: nothing runs until the control plane starts a job, and each job is one worker. The
#                 control plane gives each job its name, pool, drain window and time limit; everything else is here.
#
# Images are built by the Radix workflow (radix-deploy.workflow.yml beside this file, a sample to copy into
# .github/workflows) from osdu/deploy/docker and deployed pinned to the commit they were built from. No secret is ever
# written here: the ones a component needs as raw values come from the environment's Key Vault through secretRefs, the
# others are ${keyvault:...} references the application resolves.
apiVersion: radix.equinor.com/v1
kind: RadixApplication
metadata:
  name: osdu-delivery
spec:
  environments:
    - name: dev
    - name: test
    - name: prod

  # The registry the images are pushed to (<registry>: the Azure Container Registry the deploy workflow pushes to). Its
  # pull password is set once in the Radix web console of this application.
  privateImageHubs:
    <registry>.azurecr.io:
      username: radix-pull

  components:
    # ----------------------------------------------------------------------------------------------- control plane ---
    - name: controlplane
      image: <registry>.azurecr.io/osdu-delivery-control-plane:{imageTagName}
      alwaysPullImageOnDeploy: true
      ports:
        - name: http
          port: 8080
      publicPort: http
      resources:
        requests:
          memory: "2048Mi"
          cpu: "1000m"
        limits:
          memory: "4096Mi"
          cpu: "2000m"
      healthChecks:
        # Live answers as soon as the host listens; ready only once the catalog and the osdu schema are migrated and
        # verified, so nothing reaches a control plane that cannot serve.
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      variables:
        # Compute is the worker jobs' job: this replica does the API, scheduling and dispatch only.
        ControlPlane__Worker__Enabled: "false"
        ControlPlane__Bootstrap__AdminUsername: admin
        # The catalog (and the osdu schema beside it) is SQLFLOW_CATALOG_DB, set per environment below; it is migrated
        # by the control plane itself at start. The database must exist; nothing here creates it.
        ControlPlane__Catalog__ConnectionReference: ${env:SQLFLOW_CATALOG_DB}
        # Sign-in with Entra ID (the organization's tenant); the app registration is per environment, below.
        ControlPlane__AzureAd__AllowedTenantIds__0: <tenant id>
        # Radix's gateway is the only way in from outside, and only this application's own components reach the pod
        # otherwise: trust the forwarded client address from the cluster's private ranges, so the per-address limit on
        # anonymous calls (sign-in) applies per person rather than to everyone behind the gateway at once.
        ControlPlane__Proxy__Enabled: "true"
        ControlPlane__Proxy__KnownNetworks__0: 10.0.0.0/8
        ControlPlane__Proxy__KnownNetworks__1: 172.16.0.0/12
        ControlPlane__Proxy__KnownNetworks__2: 192.168.0.0/16
        # Managed workers: every managed pool keeps at least MinWorkers running and starts more, up to MaxWorkers, for
        # queued runs no free slot covers; an idle extra worker leaves only once it holds nothing. Add a named pool with
        # ControlPlane__ManagedWorkers__Pools__<name>__MinWorkers and __MaxWorkers (and, for its jobs' size,
        # ControlPlane__ManagedWorkers__Radix__Pools__<name>__Resources__...).
        ControlPlane__ManagedWorkers__Enabled: "true"
        ControlPlane__ManagedWorkers__Launcher: radix
        ControlPlane__ManagedWorkers__MinWorkers: "1"
        ControlPlane__ManagedWorkers__MaxWorkers: "10"
        ControlPlane__ManagedWorkers__Radix__JobSchedulerUrl: http://worker:8080
        # At least MaxLifetimeHours (12) plus twice DrainMinutes (60): a worker that could not be replaced in time
        # still finishes its runs before Radix ends the job.
        ControlPlane__ManagedWorkers__Radix__TimeLimitHours: "24"
        ControlPlane__ManagedWorkers__Radix__Resources__Requests__Cpu: "1000m"
        ControlPlane__ManagedWorkers__Radix__Resources__Requests__Memory: "2048Mi"
        ControlPlane__ManagedWorkers__Radix__Resources__Limits__Cpu: "2000m"
        ControlPlane__ManagedWorkers__Radix__Resources__Limits__Memory: "4096Mi"
        # The chat assistant answers with a model in AI Foundry, keyless: the control plane's workload identity holds
        # Cognitive Services OpenAI User on the Foundry account. The model calls the MCP server for its tools.
        ControlPlane__Assistant__Enabled: "true"
        ControlPlane__Assistant__Provider: AzureFoundry
        # Questions starting with ! run read-only queries over the approved AI contexts, on the workers.
        ControlPlane__AiContext__Enabled: "true"
        # The private ranges a flow may reach (an OSDU, a storage account or a proxy behind a private endpoint), as
        # CIDRs; empty reaches public addresses only. The same on the worker.
        SQLFLOW_DELIVERY_PRIVATE_NETWORKS: ""
      environmentConfig:
        - environment: dev
          replicas: 1
          imageTagName: dev
          identity:
            azure:
              clientId: <dev control plane identity client id>
          variables:
            ControlPlane__Cors__AllowedOrigins__0: https://gui-osdu-delivery-dev.<radix cluster domain>
            ControlPlane__AzureAd__ClientId: <dev sign-in app registration client id>
            ControlPlane__Bootstrap__AdminPasswordReference: ${keyvault:<dev key vault>/admin-password}
            ControlPlane__Assistant__Foundry__ProjectEndpoint: https://<dev foundry account>.services.ai.azure.com/api/projects/<dev project>
            ControlPlane__Assistant__Foundry__ModelDeploymentName: <dev model deployment>
            ControlPlane__Assistant__Mcp__ServerUrl: https://mcp-osdu-delivery-dev.<radix cluster domain>/mcp
            # The workload identity signs in to Azure SQL; no password is in either connection.
            SQLFLOW_CATALOG_DB: Server=tcp:<dev sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            # The data database the estate's flows name (a person's reads of a flow resolve it here, as a run does on a
            # worker).
            OSDU_DATA_DB: Server=tcp:<dev sql server>.database.windows.net,1433;Database=OsduData;Authentication=Active Directory Default;Encrypt=True;
            # The OSDU partition this environment delivers to, named by its data-partition-id (rename dev to the
            # environment's own): the control plane registers it when it starts, and the runs bound to it resolve their
            # flows' ${env:...} references with these values (osdu/docs/reference/concepts/partitions.md, Configured
            # partitions). A second partition is another set of these under its own name, with exactly one Default. The
            # client secret is a reference the worker resolves from the environment's Key Vault with its workload
            # identity: the control plane refuses to start with a secret's value here.
            Osdu__Partitions__dev__Default: "true"
            Osdu__Partitions__dev__Description: The OSDU partition the dev environment delivers to
            Osdu__Partitions__dev__Properties__OSDU_URL: https://<dev osdu host>
            Osdu__Partitions__dev__Properties__OSDU_TOKEN_URL: https://login.microsoftonline.com/<osdu tenant id>/oauth2/v2.0/token
            Osdu__Partitions__dev__Properties__OSDU_SCOPE: <dev osdu app id uri>/.default
            Osdu__Partitions__dev__Properties__OSDU_CLIENT_ID: <dev osdu client id>
            Osdu__Partitions__dev__Properties__OSDU_CLIENT_SECRET: ${keyvault:<dev key vault>/osdu-client-secret}
            Osdu__Partitions__dev__Properties__OSDU_LEGAL_TAG: <dev legal tag>
            Osdu__Partitions__dev__Properties__OSDU_LOGTYPE_ACL_OWNER: <dev owners group>
            Osdu__Partitions__dev__Properties__OSDU_LOGTYPE_ACL_VIEWER: <dev viewers group>
          secretRefs:
            azureKeyVaults:
              - name: <dev key vault>
                useAzureIdentity: true
                items:
                  - name: jwt-signing-key
                    envVar: ControlPlane__Jwt__SigningKey
                  - name: git-token
                    envVar: SQLFLOW_GIT_TOKEN
        - environment: test
          replicas: 1
          imageTagName: test
          identity:
            azure:
              clientId: <test control plane identity client id>
          variables:
            ControlPlane__Cors__AllowedOrigins__0: https://gui-osdu-delivery-test.<radix cluster domain>
            ControlPlane__AzureAd__ClientId: <test sign-in app registration client id>
            ControlPlane__Bootstrap__AdminPasswordReference: ${keyvault:<test key vault>/admin-password}
            ControlPlane__Assistant__Foundry__ProjectEndpoint: https://<test foundry account>.services.ai.azure.com/api/projects/<test project>
            ControlPlane__Assistant__Foundry__ModelDeploymentName: <test model deployment>
            ControlPlane__Assistant__Mcp__ServerUrl: https://mcp-osdu-delivery-test.<radix cluster domain>/mcp
            SQLFLOW_CATALOG_DB: Server=tcp:<test sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            OSDU_DATA_DB: Server=tcp:<test sql server>.database.windows.net,1433;Database=OsduData;Authentication=Active Directory Default;Encrypt=True;
            Osdu__Partitions__test__Default: "true"
            Osdu__Partitions__test__Description: The OSDU partition the test environment delivers to
            Osdu__Partitions__test__Properties__OSDU_URL: https://<test osdu host>
            Osdu__Partitions__test__Properties__OSDU_TOKEN_URL: https://login.microsoftonline.com/<osdu tenant id>/oauth2/v2.0/token
            Osdu__Partitions__test__Properties__OSDU_SCOPE: <test osdu app id uri>/.default
            Osdu__Partitions__test__Properties__OSDU_CLIENT_ID: <test osdu client id>
            Osdu__Partitions__test__Properties__OSDU_CLIENT_SECRET: ${keyvault:<test key vault>/osdu-client-secret}
            Osdu__Partitions__test__Properties__OSDU_LEGAL_TAG: <test legal tag>
            Osdu__Partitions__test__Properties__OSDU_LOGTYPE_ACL_OWNER: <test owners group>
            Osdu__Partitions__test__Properties__OSDU_LOGTYPE_ACL_VIEWER: <test viewers group>
          secretRefs:
            azureKeyVaults:
              - name: <test key vault>
                useAzureIdentity: true
                items:
                  - name: jwt-signing-key
                    envVar: ControlPlane__Jwt__SigningKey
                  - name: git-token
                    envVar: SQLFLOW_GIT_TOKEN
        - environment: prod
          replicas: 1
          imageTagName: latest
          identity:
            azure:
              clientId: <prod control plane identity client id>
          variables:
            ControlPlane__Cors__AllowedOrigins__0: https://gui-osdu-delivery-prod.<radix cluster domain>
            ControlPlane__AzureAd__ClientId: <prod sign-in app registration client id>
            ControlPlane__Bootstrap__AdminPasswordReference: ${keyvault:<prod key vault>/admin-password}
            ControlPlane__Assistant__Foundry__ProjectEndpoint: https://<prod foundry account>.services.ai.azure.com/api/projects/<prod project>
            ControlPlane__Assistant__Foundry__ModelDeploymentName: <prod model deployment>
            ControlPlane__Assistant__Mcp__ServerUrl: https://mcp-osdu-delivery-prod.<radix cluster domain>/mcp
            SQLFLOW_CATALOG_DB: Server=tcp:<prod sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            OSDU_DATA_DB: Server=tcp:<prod sql server>.database.windows.net,1433;Database=OsduData;Authentication=Active Directory Default;Encrypt=True;
            Osdu__Partitions__prod__Default: "true"
            Osdu__Partitions__prod__Description: The OSDU partition the prod environment delivers to
            Osdu__Partitions__prod__Properties__OSDU_URL: https://<prod osdu host>
            Osdu__Partitions__prod__Properties__OSDU_TOKEN_URL: https://login.microsoftonline.com/<osdu tenant id>/oauth2/v2.0/token
            Osdu__Partitions__prod__Properties__OSDU_SCOPE: <prod osdu app id uri>/.default
            Osdu__Partitions__prod__Properties__OSDU_CLIENT_ID: <prod osdu client id>
            Osdu__Partitions__prod__Properties__OSDU_CLIENT_SECRET: ${keyvault:<prod key vault>/osdu-client-secret}
            Osdu__Partitions__prod__Properties__OSDU_LEGAL_TAG: <prod legal tag>
            Osdu__Partitions__prod__Properties__OSDU_LOGTYPE_ACL_OWNER: <prod owners group>
            Osdu__Partitions__prod__Properties__OSDU_LOGTYPE_ACL_VIEWER: <prod viewers group>
          secretRefs:
            azureKeyVaults:
              - name: <prod key vault>
                useAzureIdentity: true
                items:
                  - name: jwt-signing-key
                    envVar: ControlPlane__Jwt__SigningKey
                  - name: git-token
                    envVar: SQLFLOW_GIT_TOKEN

    # --------------------------------------------------------------------------------------------------------- GUI ---
    - name: gui
      image: <registry>.azurecr.io/osdu-delivery-gui:{imageTagName}
      alwaysPullImageOnDeploy: true
      ports:
        - name: http
          port: 8080
      publicPort: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
      healthChecks:
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
      environmentConfig:
        # The SPA reads the control plane's address from config.json, written from this variable when the container
        # starts, so one image serves every environment.
        - environment: dev
          imageTagName: dev
          variables:
            SQLFLOW_API_BASE_URL: https://controlplane-osdu-delivery-dev.<radix cluster domain>
        - environment: test
          imageTagName: test
          variables:
            SQLFLOW_API_BASE_URL: https://controlplane-osdu-delivery-test.<radix cluster domain>
        - environment: prod
          imageTagName: latest
          variables:
            SQLFLOW_API_BASE_URL: https://controlplane-osdu-delivery-prod.<radix cluster domain>

    # -------------------------------------------------------------------------------------------------- MCP server ---
    - name: mcp
      image: <registry>.azurecr.io/osdu-delivery-mcp:{imageTagName}
      alwaysPullImageOnDeploy: true
      ports:
        - name: http
          port: 8080
      publicPort: http
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      healthChecks:
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
          failureThreshold: 3
      variables:
        # Every call runs as the bearer token on the request (a person's, or the one the control plane delegates to the
        # model for a run), checked against the control plane and forwarded to it inside the application. The server
        # holds no credential of its own.
        SQLFLOW_CONTROL_PLANE_URL: http://controlplane:8080
      environmentConfig:
        - environment: dev
          imageTagName: dev
          variables:
            SQLFLOW_GUI_URL: https://gui-osdu-delivery-dev.<radix cluster domain>
            SQLFLOW_MCP_HTTP_ALLOWED_HOSTS: mcp-osdu-delivery-dev.<radix cluster domain>
        - environment: test
          imageTagName: test
          variables:
            SQLFLOW_GUI_URL: https://gui-osdu-delivery-test.<radix cluster domain>
            SQLFLOW_MCP_HTTP_ALLOWED_HOSTS: mcp-osdu-delivery-test.<radix cluster domain>
        - environment: prod
          imageTagName: latest
          variables:
            SQLFLOW_GUI_URL: https://gui-osdu-delivery-prod.<radix cluster domain>
            SQLFLOW_MCP_HTTP_ALLOWED_HOSTS: mcp-osdu-delivery-prod.<radix cluster domain>

  jobs:
    # ------------------------------------------------------------------------------------------------- the workers ---
    - name: worker
      image: <registry>.azurecr.io/osdu-delivery-worker:{imageTagName}
      # The scheduler the control plane starts and lists jobs through (ControlPlane__ManagedWorkers__Radix__JobSchedulerUrl).
      schedulerPort: 8080
      # The control plane sets each job's own limit when it starts it; these are what a job falls back to. A worker
      # never restarts in place (the control plane replaces one that ends), and the cluster autoscaler never moves it.
      timeLimitSeconds: 86400
      backoffLimit: 0
      safeToRestart: false
      resources:
        requests:
          memory: "2048Mi"
          cpu: "1000m"
        limits:
          memory: "4096Mi"
          cpu: "2000m"
      variables:
        # The control plane, reached inside the application by its component name.
        SQLFLOW_URL: http://controlplane:8080
        SQLFLOW_DELIVERY_PRIVATE_NETWORKS: ""
      environmentConfig:
        - environment: dev
          imageTagName: dev
          identity:
            azure:
              clientId: <dev worker identity client id>
          variables:
            # The worker's node credential: a personal access token with the 'node' scope, minted once the control plane
            # runs and stored as node-token. Resolved by the worker when it starts, so the vault can get it after the
            # first deploy; until then each worker exits at once and the control plane backs the pool off.
            SQLFLOW_TOKEN: ${keyvault:<dev key vault>/node-token}
            # The osdu schema the worker verifies before it polls, in the catalog database; and the catalog itself, which
            # the estate's dimension and curve flows name.
            SQLFLOW_OSDU_DB: Server=tcp:<dev sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            SQLFLOW_CATALOG_DB: Server=tcp:<dev sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            OSDU_DATA_DB: Server=tcp:<dev sql server>.database.windows.net,1433;Database=OsduData;Authentication=Active Directory Default;Encrypt=True;
            # The OSDU values a run needs come with the run, from the partition it is bound to (the control plane's
            # Osdu__Partitions__...), so a worker holds none of its own.
          secretRefs:
            azureKeyVaults:
              - name: <dev key vault>
                useAzureIdentity: true
                items:
                  - name: git-token
                    envVar: SQLFLOW_GIT_TOKEN
        - environment: test
          imageTagName: test
          identity:
            azure:
              clientId: <test worker identity client id>
          variables:
            SQLFLOW_TOKEN: ${keyvault:<test key vault>/node-token}
            SQLFLOW_OSDU_DB: Server=tcp:<test sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            SQLFLOW_CATALOG_DB: Server=tcp:<test sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            OSDU_DATA_DB: Server=tcp:<test sql server>.database.windows.net,1433;Database=OsduData;Authentication=Active Directory Default;Encrypt=True;
          secretRefs:
            azureKeyVaults:
              - name: <test key vault>
                useAzureIdentity: true
                items:
                  - name: git-token
                    envVar: SQLFLOW_GIT_TOKEN
        - environment: prod
          imageTagName: latest
          identity:
            azure:
              clientId: <prod worker identity client id>
          variables:
            SQLFLOW_TOKEN: ${keyvault:<prod key vault>/node-token}
            SQLFLOW_OSDU_DB: Server=tcp:<prod sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            SQLFLOW_CATALOG_DB: Server=tcp:<prod sql server>.database.windows.net,1433;Database=OsduDelivery;Authentication=Active Directory Default;Encrypt=True;
            OSDU_DATA_DB: Server=tcp:<prod sql server>.database.windows.net,1433;Database=OsduData;Authentication=Active Directory Default;Encrypt=True;
          secretRefs:
            azureKeyVaults:
              - name: <prod key vault>
                useAzureIdentity: true
                items:
                  - name: git-token
                    envVar: SQLFLOW_GIT_TOKEN
