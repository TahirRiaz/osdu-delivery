# Flow: osdu-cache-sync
#
# The metadata sync (docs/delivery/design.md section 15). It pages OSDU's search index into files on the lake: the
# reference and master data the WellLog mapping matches units, curve business values, vertical measurement types and
# wellbores by, landed as the records the index holds. What the mappings resolve against is not these files but the
# cache, which ../caches/osdu-reference-cache.yaml defines and its own runs capture into the catalog.
flowType: retrieval
name: osdu-cache-sync
batch: recall

source:
  endpoint: ${env:PETRODB_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}
  headers:
    Ocp-Apim-Subscription-Key: ${env:APIM_KEY}
    data-partition-id: opendes
  kinds:
    - "osdu:wks:reference-data--UnitOfMeasure:*"
    - "osdu:wks:reference-data--LogCurveBusinessValue:*"
    - "osdu:wks:reference-data--VerticalMeasurementType:*"
    - "osdu:wks:master-data--Wellbore:*"

target:
  # The records as the index holds them.
  location: samples/recall-welllog/out/metadata

reliability:
  concurrency: 4
  retry: { attempts: 4, backoff: exponential, baseDelayMs: 500, maxDelayMs: 30000 }
  timeoutSeconds: 100

# Nightly, beside the refresh of the cache it lands the records of.
schedule:
  cron: "0 2 * * *"
