# Ingestion: the typed survey view into the keyed ingestion table the OSDU flow reads.
flowType: ing
name: recall-trajectory-ing
batch: recall

connections:
  sample: ${env:OSDU_SAMPLE_DB}

source:
  server: sample
  object: OsduSample.pre.v_WellboreTrajectory

target:
  server: sample
  object: OsduSample.ing.WellboreTrajectory
  # The identity primary key every ingestion table carries: the clustered key the other indexes point at, and the
  # column the OSDU flow pages and fans out by (source.record.primaryKey).
  identityColumn: RecId

load:
  keyColumns: [source_project, survey_id]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]
