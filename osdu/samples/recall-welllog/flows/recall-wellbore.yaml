# Flow: recall-wellbore
#
# The wellbore master data the well logs reference (docs/stage4-design.md section 1.5). It reads the ingestion tables
# the wellbore chain loads, renders each row with the Wellbore mapping and delivers the records through the plain
# storage protocol: no payload files, so nothing is streamed beside the document.
flowType: delivery
name: recall-wellbore
batch: recall

source:
  connection: ${env:OSDU_SAMPLE_DB}
  record:
    object: OsduSample.ing.Wellbore
    key: [facility_name]
    primaryKey: RecId
  datasets:
    aliases:
      object: OsduSample.ing.WellboreAlias
      join:
        facility_name: facility_name
      orderBy: [alias_name]
  lastModified: update_date
  work: ../.work/wellbore

render:
  mapping: Wellbore@1.0.0
  parameters:
    dataPartition: opendes

change:
  detect: renderedHash
  onUnchanged: skip

target:
  endpoint: ${env:PETRODB_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}
  headers:
    Ocp-Apim-Subscription-Key: ${env:APIM_KEY}
    data-partition-id: opendes
  protocol: osduRecord

reliability:
  concurrency: 8
  retry: { attempts: 4, backoff: exponential, baseDelayMs: 500, maxDelayMs: 30000 }
  skipStatusCodes: [409]
  timeoutSeconds: 100
  leaseSeconds: 300
  batchSize: 50

schedule:
  cron: "30 * * * *"

verify:
  reconcile: false
