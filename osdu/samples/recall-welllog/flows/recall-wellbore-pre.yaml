# Pre-ingestion: the wellbore master data files into the pre layer.
#
# The master data the well logs hang off (docs/stage4-design.md section 1.5). A wellbore file placed in ../data/wellbore
# by hand lands exactly as any other.
name: recall-wellbore-pre
batch: recall

source:
  type: csv
  location: ../data/wellbore
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_SAMPLE_DB}
  schema: pre
  table: Wellbore

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: update_date, type: datetime2 }
    - { name: facility_description, expr: "NULLIF(@ColName, '')", type: varchar(400) }
    - { name: facility_id, expr: "NULLIF(@ColName, '')", type: varchar(200) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append
