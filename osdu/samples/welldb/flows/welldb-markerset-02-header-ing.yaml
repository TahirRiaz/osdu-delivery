# Ingestion: the typed marker set view into the keyed ingestion table the markersets interface of
# welldb-survey-03-delivery reads.
#
# One row per marker set of the well database (source_project, marker_set_id), with SQLFlow's own system columns saying
# when the row last changed and which file it came from.
flowType: ing
name: welldb-markerset-02-header-ing
batch: welldb

connections:
  osduData: ${env:OSDU_DATA_DB}

source:
  server: osduData
  object: OsduData.pre.v_WellboreMarkerSet

target:
  server: osduData
  object: OsduData.silver.WellboreMarkerSet
  identityColumn: RecId

load:
  keyColumns: [source_project, marker_set_id]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]

schedule: welldb-master
