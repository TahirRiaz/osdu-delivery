# Ingestion: the typed pre view into the keyed ingestion table welldb-well-03-delivery reads.
#
# One row per well of the well database, keyed by its name, with SQLFlow's system columns saying when the row last
# changed and which file it came from, so every delivered record traces back to FileName_DW and RowNumber_DW.
flowType: ing
name: welldb-well-02-ing
batch: welldb

connections:
  osduData: ${env:OSDU_DATA_DB}

source:
  server: osduData
  object: OsduData.pre.v_Well

target:
  server: osduData
  object: OsduData.silver.Well
  identityColumn: RecId

load:
  keyColumns: [well_name]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]

schedule: welldb-master
