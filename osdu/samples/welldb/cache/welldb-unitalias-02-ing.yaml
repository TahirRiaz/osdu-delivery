# Ingestion: the typed curve unit spelling view into the keyed table the lookups cache flow reads.
#
# One row per spelling. A newer file replaces a spelling's row, so the table always holds the map as its latest file has
# it, and welldb-lookups-00-cache captures it whole into the partition's cache as UnitAlias.
flowType: ing
name: welldb-unitalias-02-ing
batch: welldb

connections:
  osduData: ${env:OSDU_DATA_DB}

source:
  server: osduData
  object: OsduData.pre.v_UnitAlias

target:
  server: osduData
  object: OsduData.silver.UnitAlias
  identityColumn: RecId

load:
  keyColumns: [source_unit]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]

schedule: welldb-cache
