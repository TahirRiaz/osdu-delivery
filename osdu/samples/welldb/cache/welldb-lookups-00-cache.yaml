# Cache flow: welldb-lookups-00-cache
#
# The lookup tables the WellLog mapping translates the well database's values through before it builds a reference:
# tables kept by this estate rather than by the OSDU platform. Each type here is a lookup table in the cache of the
# partition the flow names, beside the reference data osdu-reference-00-cache captures from the platform into the same
# cache, and the mapping reads it the same way it reads any cached type: it translates a value through a table here and
# finds the record the result names among that reference data. A lookup table is declared by one cache flow of a
# partition, and a refresh replaces it whole.
#
# The tables are the translations from the well database's own vocabulary to OSDU's, held as data instead of code: its
# unit spellings and its curve dictionary. Their files sit in data/, and beside this flow the pre and ing flows land and
# key each file into an ingestion table (welldb-unitalias-01/02, welldb-depthunitalias-01/02,
# welldb-curvedictionary-01/02). This flow captures those tables, so lineage runs it after them in the welldb-cache
# schedule. Nothing here reaches the platform, so the flow needs no endpoint or credentials; the partitions are still
# named, because they say whose caches the tables belong to.
flowType: cache
name: welldb-lookups-00-cache
batch: welldb

# The OSDU partitions whose caches this flow builds the tables into. A refresh names one of them (the partition run
# value: a dropdown in the GUI, --set partition=<name> on the CLI, values in a schedule), or builds each in turn when it
# names none. A partition added here gets a cache of its own, which the delivery flows delivering there read.
partitions: [dev]

source:
  # The ingestion database the table types are read from, resolved on the node that runs the flow.
  connection: ${env:OSDU_DATA_DB}

types:
  # The spellings a curve's unit is written in, as the partition's UnitOfMeasure codes.
  - table: OsduData.silver.UnitAlias
    name: UnitAlias
    key: source_unit
    fields: [osdu_unit]
  # The spellings a depth's or an elevation's unit is written in.
  - table: OsduData.silver.DepthUnitAlias
    name: DepthUnitAlias
    key: source_unit
    fields: [osdu_unit]
  # What each curve mnemonic is: the codes of the LogCurveType, LogCurveMainFamily and LogCurveFamily records it is filed
  # under, and its unit quantity and unit.
  - table: OsduData.silver.CurveDictionary
    name: CurveDictionary
    key: mnemonic
    fields: [log_curve_type_id, log_curve_main_family_id, log_curve_family_id, unit_quantity_id, unit]

schedule: welldb-cache
