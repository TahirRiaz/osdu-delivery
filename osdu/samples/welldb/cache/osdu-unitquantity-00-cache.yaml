# Cache flow: osdu-unitquantity-00-cache
#
# The partition's unit quantities, captured from the partition itself: what welldb-ref-03-delivery checks the unit
# quantity of every unit, curve family and curve type it delivers against, so each refers to a record the partition
# holds. It captures the unit quantities welldb-ref-unitquantity-03-delivery delivers, so lineage runs it after that
# flow and before welldb-ref-03-delivery: the second step of the sample's two tiers of reference data.
#
# The unit quantities are a cache of their own rather than a type of osdu-reference-00-cache, because that flow captures
# what welldb-ref-03-delivery delivers, so lineage runs it after that delivery; the delivery checks its unit quantities
# against the cache when it renders, so they must be captured before it runs.
flowType: cache
name: osdu-unitquantity-00-cache
batch: welldb

# The OSDU partitions whose unit quantities this flow captures, each into that partition's own cache.
partitions: [dev]

source:
  endpoint: ${env:OSDU_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}

types:
  # UnitQuantityID of a unit, a curve family and a curve type, found by its id.
  - kind: "osdu:wks:reference-data--UnitQuantity:*"
    name: UnitQuantity
    fields: [data.Code, data.Name, data.ID]

schedule: welldb-reference
