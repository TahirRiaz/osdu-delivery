# Pre-ingestion: the curve unit spellings into the pre layer.
#
# Each row maps one spelling the well database writes a curve's unit in to the code of the partition's UnitOfMeasure
# record (GAPI is gAPI, OHMM is ohm.m). A spelling is matched ignoring case, so spellings that differ only by case are one
# row here, as the table's key holds them. This flow lands data/unit-alias, welldb-unitalias-02-ing keys it, and
# welldb-lookups-00-cache holds that table.
name: welldb-unitalias-01-pre
batch: welldb

source:
  type: csv
  location: data/unit-alias
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_DATA_DB}
  schema: pre
  table: UnitAlias

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: source_unit, type: nvarchar(50) }
    - { name: osdu_unit, type: nvarchar(50) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: welldb-cache
