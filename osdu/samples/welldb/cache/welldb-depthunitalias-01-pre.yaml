# Pre-ingestion: the depth unit spellings into the pre layer.
#
# Each row maps one spelling the well database writes a depth or an elevation unit in to the code of the partition's
# UnitOfMeasure record (M is m, FEET is ft). This flow lands data/depth-unit-alias, welldb-depthunitalias-02-ing keys it,
# and welldb-lookups-00-cache holds that table.
name: welldb-depthunitalias-01-pre
batch: welldb

source:
  type: csv
  location: data/depth-unit-alias
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_DATA_DB}
  schema: pre
  table: DepthUnitAlias

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: source_unit, type: nvarchar(50) }
    - { name: osdu_unit, type: nvarchar(50) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: welldb-cache
