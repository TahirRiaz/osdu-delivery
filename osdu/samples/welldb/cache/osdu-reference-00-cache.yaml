# Cache flow: osdu-reference-00-cache
#
# The OSDU reference data the WellLog mapping resolves its references against, captured from the partition itself: the
# records of every reference type a well log of the well database points to. The mapping finds each reference in this
# cache by its code and writes the id of the record it found, so a log goes out only with references to records the
# partition holds, and a value the partition has no record for holds the log with the reason, instead of reaching OSDU as
# a reference to nothing.
#
# Units are matched on ID, Code and Name, the fields a unit is known by. The translations the platform does not hold
# (the well database's unit spellings and its curve dictionary) stay lookup tables, in welldb-lookups-00-cache: the
# mapping translates a value through them first and then finds the record here. Both flows fill the cache of the same
# partition.
#
# The platform and the credentials are the ones the delivery flow delivers with, and the partitions the ones it delivers
# to, so each partition's cache holds what the delivering identity can see in that partition.
flowType: cache
name: osdu-reference-00-cache
batch: welldb

# The OSDU partitions whose reference data this flow captures, each into that partition's own cache and with that
# partition's data-partition-id on every request. A refresh names one of them (the partition run value: a dropdown in the
# GUI, --set partition=<name> on the CLI, values in a schedule), or captures each in turn when it names none.
partitions: [dev]

source:
  endpoint: ${env:OSDU_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}

types:
  # CurveUnit, DepthUnit and VerticalMeasurementUnitOfMeasureID, after the unit tables translate the well database's
  # spelling. Found by Code, then Name, then ID.
  - kind: "osdu:wks:reference-data--UnitOfMeasure:*"
    name: UnitOfMeasure
    fields: [data.Code, data.Name, data.ID]
  # VerticalMeasurementTypeID: KB, filed under KellyBushing.
  - kind: "osdu:wks:reference-data--VerticalMeasurementType:*"
    name: VerticalMeasurementType
    fields: [data.Code, data.Name]
  # SamplingDomainTypeID: DEPTH.
  - kind: "osdu:wks:reference-data--WellLogSamplingDomainType:*"
    name: WellLogSamplingDomainType
    fields: [data.Code, data.Name]
  # WellLogTypeID: INTERPRETED.
  - kind: "osdu:wks:reference-data--LogType:*"
    name: LogType
    fields: [data.Code, data.Name]
  # A curve's LogCurveBusinessValueID: HIGH.
  - kind: "osdu:wks:reference-data--LogCurveBusinessValue:*"
    name: LogCurveBusinessValue
    fields: [data.Code, data.Name]
  # TechnicalAssuranceTypeID: every log is Unevaluated.
  - kind: "osdu:wks:reference-data--TechnicalAssuranceType:*"
    name: TechnicalAssuranceType
    fields: [data.Code, data.Name]
  # A curve's LogCurveTypeID, LogCurveMainFamilyID and LogCurveFamilyID, by the codes the curve dictionary gives its
  # mnemonic. A partition holds tens of thousands of curve types, every vendor's, and all of them are kept: an id is
  # looked up by the record it names, and a record's own code need not match the prefix of its id, so no query on its
  # values could narrow the capture without losing a record the dictionary names.
  - kind: "osdu:wks:reference-data--LogCurveType:*"
    name: LogCurveType
    fields: [data.Code, data.Name]
  - kind: "osdu:wks:reference-data--LogCurveMainFamily:*"
    name: LogCurveMainFamily
    fields: [data.Code, data.Name]
  - kind: "osdu:wks:reference-data--LogCurveFamily:*"
    name: LogCurveFamily
    fields: [data.Code, data.Name]

schedule: welldb-cache
