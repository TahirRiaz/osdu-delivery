# Pre-ingestion: UnitOfMeasure reference values into the pre layer.
#
# The first flow of the chain welldb-ref-03-delivery reads for UnitOfMeasure: the units the sample's curves, depths and
# elevations are written in. It lands the CSV files under data/unit-of-measure into [pre].[UnitOfMeasure] as raw text
# and refreshes the typed view [pre].[v_UnitOfMeasure] that welldb-ref-unitofmeasure-02-ing reads. The file holds OSDU's
# own values, as the OSDU data definitions publish them, written by osdu/tools/SampleData (--reference) from the
# reference value manifests. Every column is declared: a reference value is text the record carries as it stands,
# whatever a value looks like.
name: welldb-ref-unitofmeasure-01-pre
batch: welldb

source:
  type: csv
  location: data/unit-of-measure
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_DATA_DB}
  schema: pre
  table: UnitOfMeasure

schema:
  evolve: widen

transform:
  inferTypes: false
  onConvertError: fail
  columns:
    - { name: code, type: "nvarchar(200)" }
    - { name: name, type: "nvarchar(400)" }
    - { name: description, type: "nvarchar(4000)" }
    - { name: attribution_authority, type: "nvarchar(200)" }
    - { name: attribution_publication, type: "nvarchar(400)" }
    - { name: attribution_revision, type: "nvarchar(100)" }
    - { name: source, type: "nvarchar(1000)" }
    - { name: commit_date, type: "varchar(40)" }
    - { name: id_value, type: "nvarchar(200)" }
    - { name: unit_quantity, type: "nvarchar(200)" }
    - { name: is_base_unit, type: "varchar(5)" }
    - { name: coefficient_a, type: float }
    - { name: coefficient_b, type: float }
    - { name: coefficient_c, type: float }
    - { name: coefficient_d, type: float }
    - { name: unit_dimension_code, type: "nvarchar(100)" }
    - { name: unit_dimension_name, type: "nvarchar(200)" }
    - { name: persistable_reference, type: "nvarchar(1000)" }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: welldb-reference
