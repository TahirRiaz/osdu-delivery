# Pre-ingestion: LogCurveBusinessValue reference values into the pre layer.
#
# The first flow of the chain welldb-ref-03-delivery reads for LogCurveBusinessValue: the business value the sample's
# curves carry. It lands the CSV files under data/log-curve-business-value into [pre].[LogCurveBusinessValue] as raw
# text and refreshes the typed view [pre].[v_LogCurveBusinessValue] that welldb-ref-logcurvebusinessvalue-02-ing reads.
# The file holds OSDU's own values, as the OSDU data definitions publish them, written by osdu/tools/SampleData
# (--reference) from the reference value manifests. Every column is declared: a reference value is text the record
# carries as it stands, whatever a value looks like.
name: welldb-ref-logcurvebusinessvalue-01-pre
batch: welldb

source:
  type: csv
  location: data/log-curve-business-value
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_DATA_DB}
  schema: pre
  table: LogCurveBusinessValue

schema:
  evolve: widen

transform:
  inferTypes: false
  onConvertError: fail
  columns:
    - { name: code, type: "nvarchar(200)" }
    - { name: name, type: "nvarchar(400)" }
    - { name: description, type: "nvarchar(4000)" }
    - { name: attribution_authority, type: "nvarchar(200)" }
    - { name: attribution_publication, type: "nvarchar(400)" }
    - { name: attribution_revision, type: "nvarchar(100)" }
    - { name: source, type: "nvarchar(1000)" }
    - { name: commit_date, type: "varchar(40)" }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: welldb-reference
