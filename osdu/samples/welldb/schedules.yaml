# The schedules of the welldb estate. Every flow of the estate joins one of them with `schedule: <name>` (but the
# retrieval, which runs on demand until its lake is yours), so a schedule fires its flows as one group in lineage order
# (pre-ingestion, then ingestion, then what reads the ingestion tables), and "Run now" on the Schedules page
# (POST /api/v1/schedules/{id}/run) runs the whole chain on demand. A single flow still runs on its own from the Pipelines
# page or with `sqlflow run <flow>`.
#
# The nightly chain fills an empty partition in the order its records refer to each other: the reference data first,
# which puts what it delivers into the partition's cache as it runs (its cache.after), then the wells and wellbores, which
# refer to it and bring what they read up to date before they render (cache.before). Each link fires when the one before
# it has run (`after:`), and lineage orders the flows inside each link: the wells are tested once they are delivered. The
# cache refresh is a schedule of its own, which nothing waits for: the pipelines' cache steps keep the cache current
# between refreshes. The logs come hourly, the dimensions over them after each hour's logs, and the inventory of what
# OSDU holds weekly; the wellbores the well database no longer holds are taken out after the master data.
schedules:
  # Nightly: the reference values the estate's records refer to land, are keyed and are delivered.
  welldb-reference:
    cron: "0 1 * * *"
    timezone: UTC

  # Nightly, on its own: the lookup tables land and are keyed (unit spellings, curve dictionary), the lookups cache
  # captures them, and the reference cache refreshes the partition's reference data in full, which also brings in values
  # someone else loaded and takes out what OSDU no longer holds.
  welldb-cache:
    cron: "30 0 * * *"
    timezone: UTC

  # After the reference data: the wells, then the wellbores, which search for their wells by name; then the wells are
  # tested as OSDU holds them, and each wellbore's survey and formation tops are delivered, found by its name.
  welldb-master:
    after: welldb-reference

  # Hourly: the well log header and curve files land and are keyed, then the delivery sends what changed to the
  # wellbore DDMS. The delivery flow's one required parameter is the log source it delivers.
  welldb-welllog:
    cron: "0 * * * *"
    timezone: UTC
    values:
      logSource: COMPOSITE

  # After the logs: the dimensions over what OSDU holds of them are built again, so a search panel offers the logs,
  # wellbores and curve mnemonics delivered that hour.
  welldb-dimensions:
    after: welldb-welllog

  # Weekly, on its own: the inventory reads what OSDU holds of the kinds the estate delivers and sets it against every
  # ledger of the partition. It only reads; an operator removes what it finds.
  welldb-inventory:
    cron: "0 4 * * 0"
    timezone: UTC

  # After the master data: the removal reads the well database's current wellbore cut whole and takes out of OSDU the
  # wellbores it no longer holds, the ones a run has not taken out before; a run that finds too many gone waits for an
  # operator's approval instead.
  welldb-removal:
    after: welldb-master
