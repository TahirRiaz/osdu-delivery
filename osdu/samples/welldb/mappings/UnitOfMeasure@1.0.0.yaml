# Mapping: UnitOfMeasure reference values into the reference-data--UnitOfMeasure 1.0.0 template.
#
# One record per value: the units the sample's curves, depths and elevations are written in. The values are OSDU's own
# values (OPEN governance), as the OSDU data definitions publish them, without their name aliases, which would bring in
# the alias types and standards organisations they name. The record's id is made from its code (dataset.idFrom: key), as
# OSDU names its reference values, so dev:reference-data--UnitOfMeasure:<code> is the same record wherever the value
# comes from.
documentType: mapping
name: UnitOfMeasure
version: 1.0.0
template:
  kind: osdu:wks:reference-data--UnitOfMeasure:1.0.0
  version: bb4bd8e91683061d
description: The UnitOfMeasure values the sample's records refer to.

dataset:
  system: welldb
  key: [code]
  idFrom: key
  label: "{name} ({code})"
  identity: [code]

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids and references are minted in.
  aclOwner:
    required: true
    description: The entitlements group that owns every record this mapping renders (acl.owners).
  aclViewer:
    required: true
    description: The entitlements group that may read every record this mapping renders (acl.viewers).
  legalTag:
    required: true
    description: The legal tag every record this mapping renders carries (legal.legaltags).

record:
  acl:
    owners: ["{$param.aclOwner}"]
    viewers: ["{$param.aclViewer}"]
  legal:
    legaltags: ["{$param.legalTag}"]
    otherRelevantDataCountries: [US]
  tags:
    DeliveredBy: osdu-delivery

  data:
    Code: { $from: code }
    Name: { $from: name }
    Description:
      $from: description
      $required: false
    AttributionAuthority:
      $from: attribution_authority
      $required: false
    AttributionPublication:
      $from: attribution_publication
      $required: false
    AttributionRevision:
      $from: attribution_revision
      $required: false
    Source:
      $from: source
      $required: false
    CommitDate:
      $from: commit_date
      $modifiers: [date]
      $required: false
    ID: { $from: id_value }
    # The unit quantity the value is measured in, which the unitquantity interface of welldb-ref-03-delivery delivers
    # first: checked against the partition's unit quantities, which that interface puts into the cache as it ends.
    UnitQuantityID:
      $from: unit_quantity
      $modifiers:
        - ref: reference-data--UnitQuantity
    IsBaseUnit:
      $from: is_base_unit
      $modifiers:
        - equals: "true"
    CoefficientA: { $from: coefficient_a }
    CoefficientB: { $from: coefficient_b }
    CoefficientC: { $from: coefficient_c }
    CoefficientD: { $from: coefficient_d }
    UnitDimensionCode:
      $from: unit_dimension_code
      $required: false
    UnitDimensionName:
      $from: unit_dimension_name
      $required: false
    PersistableReference:
      $from: persistable_reference
      $required: false
