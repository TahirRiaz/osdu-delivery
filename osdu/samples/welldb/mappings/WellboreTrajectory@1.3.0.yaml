# Mapping: the well database's directional surveys into the WellboreTrajectory 1.3.0 template.
#
# One record per survey, its id the delivery key (a UUIDv5 over the system, the project and the survey id), so a survey
# is always the same record. The dataset is the survey's header row, and its child dataset "stations" one row per
# property the survey's stations carry (MD, INC, AZI), in station_ordinal order; the station values themselves are
# streamed to the wellbore DDMS as bulk data, one column per property, named as the property is here. The DDMS refuses a
# bulk column the record does not list under AvailableTrajectoryStationProperties, and reads the property whose type is
# MD as the reference its first and last values must agree with TopDepthMeasuredDepth and BaseDepthMeasuredDepth on
# (osdu/specs/wellbore-ddms/INTEGRATION.md section 4.3), which the well database's survey file states.
#
# Every reference is a generated id checked against the partition's reference data, as the well's and the log's are: a
# property's type is the TrajectoryStationPropertyType code the survey names (MD, Inclination, AzimuthTN), and its unit
# the well database's spelling translated through the unit table (DEG becomes dega, M becomes m), both delivered by
# welldb-ref-03-delivery. The wellbore is found by name, as a log's is.
documentType: mapping
name: WellboreTrajectory
version: 1.3.0
template:
  kind: osdu:wks:work-product-component--WellboreTrajectory:1.3.0
  version: bfbc5973bbdeb7ec
description: The well database's directional surveys (one record per survey); the stations are streamed as bulk data.

dataset:
  system: welldb
  # The delivery key is UUIDv5 over (source system, project, survey id): the grain the well database models.
  key: [source_project, survey_id]
  label: "{wellbore_uwi} / {survey_name} ({survey_id})"
  # The wellbore and survey an operator holds this trajectory by, indexed by the ledger for the Records page.
  identity: [wellbore_uwi, survey_id]

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids and references are minted in.
  aclOwner:
    required: true
    description: The entitlements group that owns every record this mapping renders (acl.owners).
  aclViewer:
    required: true
    description: The entitlements group that may read every record this mapping renders (acl.viewers).
  legalTag:
    required: true
    description: The legal tag every record this mapping renders carries (legal.legaltags).

# The wellbore a survey was run in is looked up on the platform as each record needs one, never captured into the cache:
# the well database names it by the wellbore's FacilityName (wellbore_uwi), as it names a log's.
searches:
  Wellbore:
    kind: "osdu:wks:master-data--Wellbore:*"
    schema:
      kind: osdu:wks:master-data--Wellbore:1.3.0
      version: 58d6bdbd9d066a06
    description: The partition's wellbores, found by name or by one of their aliases.

record:
  acl:
    owners: ["{$param.aclOwner}"]
    viewers: ["{$param.aclViewer}"]
  legal:
    legaltags: ["{$param.legalTag}"]
    otherRelevantDataCountries: [US]
  tags:
    DeliveredBy: osdu-delivery
    SourceProject: { $from: source_project }

  # The survey.
  data:
    Name:
      $from: survey_name
      $modifiers: [trim]
    SurveyReferenceIdentifier: { $from: survey_id }
    SurveyType: { $from: survey_type }
    SurveyVersion: { $from: survey_version }
    WellboreID:
      $search: Wellbore
      $findBy:
        - data.FacilityName = wellbore_uwi
        - data.NameAliases.AliasName = wellbore_uwi
    TopDepthMeasuredDepth: { $from: top_md }
    BaseDepthMeasuredDepth: { $from: base_md }

    # The point the depths are measured from, as the well's KB elevation: a value and a unit in one column ("42.8 M").
    VerticalMeasurement:
      VerticalMeasurement:
        $from: elev_meas_ref
        $modifiers:
          - split: { separator: " ", part: 1 }
      VerticalMeasurementUnitOfMeasureID:
        $from: elev_meas_ref
        $modifiers:
          - split: { separator: " ", part: 2 }
          - replace: $cache.DepthUnitAlias
          - ref: reference-data--UnitOfMeasure
      VerticalMeasurementTypeID: "{$param.dataPartition}:reference-data--VerticalMeasurementType:KellyBushing:"

    # The station properties: one item per row of the stations child dataset. Name is the bulk column's label.
    AvailableTrajectoryStationProperties:
      $forEach: stations
      $item:
        Name: { $from: station_property }
        TrajectoryStationPropertyTypeID:
          $from: property_type
          $modifiers:
            - ref: reference-data--TrajectoryStationPropertyType
        StationPropertyUnitID:
          $from: property_unit
          $modifiers:
            - replace: $cache.UnitAlias
            - ref: reference-data--UnitOfMeasure
