# Mapping: the well database's wells into the master-data--Well 1.2.0 template.
#
# One record per well, its id the delivery key (a UUIDv5 over the system and the well's name), so a well is always the
# same record. The well carries the elevation its logs are measured from as its one vertical measurement, KB, which is
# also the well's default: the value and its unit as the well database writes them ("42.8", "M"), the unit translated
# through the depth unit table to the partition's UnitOfMeasure code and the reference point filed under KellyBushing,
# as the well logs file it. Both references are checked against the partition's reference cache, which holds the values
# welldb-ref-03-delivery delivers. A well whose kelly bushing lies outside sea level to 250 m is held at the check
# before sending (reference-elevation), and ../flows/welldb-well-04-assertion.yaml holds what OSDU has to the same rule.
documentType: mapping
name: Well
version: 1.2.0
template:
  kind: osdu:wks:master-data--Well:1.2.0
  version: d61b5c4745d024fc
description: The well database's wells (one record per well) with the elevation their logs are measured from.

dataset:
  system: welldb
  key: [well_name]
  label: "{well_name}"
  identity: [well_name]

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids and references are minted in.
  aclOwner:
    required: true
    description: The entitlements group that owns every record this mapping renders (acl.owners).
  aclViewer:
    required: true
    description: The entitlements group that may read every record this mapping renders (acl.viewers).
  legalTag:
    required: true
    description: The legal tag every record this mapping renders carries (legal.legaltags).

record:
  acl:
    owners: ["{$param.aclOwner}"]
    viewers: ["{$param.aclViewer}"]
  legal:
    legaltags: ["{$param.legalTag}"]
    otherRelevantDataCountries: [US]
  tags:
    DeliveredBy: osdu-delivery

  data:
    FacilityName:
      $from: well_name
      $modifiers: [trim]
    DefaultVerticalMeasurementID: KB
    VerticalMeasurements:
      - VerticalMeasurementID: KB
        VerticalMeasurement:
          $from: elevation
          $assert:
            - name: reference-elevation
              description: The well database's kelly bushings lie between sea level and 250 m above it.
              between: [0, 250]
        VerticalMeasurementTypeID:
          $from: elevation_reference
          $modifiers:
            - replace: { KB: KellyBushing }
            - ref: reference-data--VerticalMeasurementType
        VerticalMeasurementUnitOfMeasureID:
          $from: elevation_unit
          $modifiers:
            - replace: $cache.DepthUnitAlias
            - ref: reference-data--UnitOfMeasure
