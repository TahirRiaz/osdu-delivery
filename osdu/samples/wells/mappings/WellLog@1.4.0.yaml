# Mapping: Well logs into the WellLog 1.4.0 template (docs/delivery/mapping-templates.md).
#
# One record per logging run. The dataset is the drop's metadata rows, and its child dataset "curves" holds one row per
# curve; the curve values themselves are streamed to the wellbore DDMS as bulk data. Every entry names the template
# variable it fills and where the value comes from: dataset.<column>, cache.<type>.<field>, or a static value. A
# variable without an entry is left out of the record. Editing this file re-renders every record that uses it, so
# changes go through `plan` and a canary before promotion (design.md section 10.5).
documentType: mapping
name: WellLog
version: 1.4.0
template:
  kind: osdu:wks:work-product-component--WellLog:1.4.0
  version: 26a3c3441882db4f
description: Well logs (one record per logging run) with curve metadata; the curve grid is streamed as bulk data.

dataset:
  system: wells
  # The delivery key is UUIDv5 over (source system, source project, log id): the grain the source models
  # (design.md section 5.1). See docs/delivery/decisions/0001-delivery-grain.md.
  key: [dataset.source_project, dataset.log_id]
  # Display and search only, never in the record: find a wellbore's logs by name in the GUI and the ledger.
  label: "{dataset.wellbore_uwi} / {dataset.log_source} / run {dataset.log_run} ({dataset.log_id})"
  # What an operator holds when they come looking for this record: the ledger indexes each value, so the record is
  # found by a wellbore id or a log id from the Records page without knowing which flow delivered it.
  identity: [dataset.wellbore_uwi, dataset.log_id]

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids and references are minted in.
  aclOwner:
    required: true
    description: The entitlements group that owns every record this mapping renders (acl.owners).
  aclViewer:
    required: true
    description: The entitlements group that may read every record this mapping renders (acl.viewers).
  legalTag:
    required: true
    description: The legal tag every record this mapping renders carries (legal.legaltags).

mappings:
  # Access and legal: every record carries them.
  - target: osdu.acl.owners
    static: ["{param.aclOwner}"]
  - target: osdu.acl.viewers
    static: ["{param.aclViewer}"]
  - target: osdu.legal.legaltags
    static: ["{param.legalTag}"]
  - target: osdu.legal.otherRelevantDataCountries
    static: [NO]
  - target: osdu.tags.DeliveredBy
    static: osdu-delivery
  - target: osdu.tags.WellLogNativeUID
    source: dataset.native_uid
    modifiers:
      - split: { separator: ",", part: 1 }

  # The log.
  - target: osdu.data.LogSource
    source: dataset.source_project
  - target: osdu.data.LogRun
    source: dataset.log_id
  - target: osdu.data.Name
    source: dataset.log_source
    modifiers: [trim]
  - target: osdu.data.WellboreID
    source: cache.Wellbore.id
    findBy:
      - cache.Wellbore.FacilityName = dataset.wellbore_uwi
      - cache.Wellbore.Alias = dataset.wellbore_uwi
  - target: osdu.data.LogVersion
    source: dataset.log_version
  - target: osdu.data.LogActivity
    source: dataset.log_pass
    modifiers:
      - split: { separator: ",", part: 1 }
  - target: osdu.data.ActivityType
    source: dataset.creator
  - target: osdu.data.SamplingStart
    source: dataset.index_min
  - target: osdu.data.SamplingStop
    source: dataset.index_max
  - target: osdu.data.SamplingInterval
    source: dataset.index_increment
  - target: osdu.data.TopMeasuredDepth
    source: dataset.index_min
  - target: osdu.data.BottomMeasuredDepth
    source: dataset.index_max
  - target: osdu.data.ReferenceCurveID
    static: MD
  - target: osdu.data.IsRegular
    source: dataset.depth_coding
    modifiers:
      - equals: REGULAR

  # The vertical reference, carried in one column as a value and a unit ("23.5 M").
  - target: osdu.data.VerticalMeasurement.VerticalMeasurement
    source: dataset.elev_meas_ref
    modifiers:
      - split: { separator: " ", part: 1 }
  - target: osdu.data.VerticalMeasurement.VerticalMeasurementUnitOfMeasureID
    source: cache.UnitOfMeasure.id
    findBy:
      - cache.UnitOfMeasure.Code = dataset.elev_meas_ref
      - cache.UnitOfMeasure.Name = dataset.elev_meas_ref
      - cache.UnitOfMeasure.ID = dataset.elev_meas_ref
      - cache.UnitOfMeasure.id = dataset.elev_meas_ref
    modifiers:
      - split: { separator: " ", part: 2 }
      - replace: { M: m, FT: ft }
  - target: osdu.data.VerticalMeasurement.VerticalMeasurementTypeID
    static: "{param.dataPartition}:reference-data--VerticalMeasurementType:KellyBushing:"

  # The curves: one item per row of the curves child dataset.
  - target: osdu.data.Curves
    source: dataset.curves
  - target: osdu.data.Curves[].CurveID
    source: dataset.curves.curve_id
  - target: osdu.data.Curves[].CurveUnit
    source: cache.UnitOfMeasure.id
    findBy:
      - cache.UnitOfMeasure.Code = dataset.curves.curve_unit
      - cache.UnitOfMeasure.Name = dataset.curves.curve_unit
      - cache.UnitOfMeasure.ID = dataset.curves.curve_unit
      - cache.UnitOfMeasure.id = dataset.curves.curve_unit
    modifiers:
      # V/V is a volume fraction, which OSDU's reference data calls m3/m3. Replacing it with % would declare values that
      # are hundredths of what the curve actually carries (a 0.21 neutron porosity read as 0.21 percent).
      - replace: { M: m, METRE: m, METER: m, FT: ft, FEET: ft, GAPI: gAPI, G/CM3: g/cm3, V/V: m3/m3 }
  - target: osdu.data.Curves[].DepthUnit
    source: cache.UnitOfMeasure.id
    findBy:
      - cache.UnitOfMeasure.Code = dataset.curves.index_unit
      - cache.UnitOfMeasure.Name = dataset.curves.index_unit
      - cache.UnitOfMeasure.ID = dataset.curves.index_unit
      - cache.UnitOfMeasure.id = dataset.curves.index_unit
    modifiers:
      - replace: { M: m, FT: ft }
  - target: osdu.data.Curves[].TopDepth
    source: dataset.curves.index_min
  - target: osdu.data.Curves[].BaseDepth
    source: dataset.curves.index_max
  - target: osdu.data.Curves[].CurveDescription
    source: dataset.curves.curve_description
  - target: osdu.data.Curves[].CurveVersion
    source: dataset.curves.curve_version
  - target: osdu.data.Curves[].LogCurveBusinessValueID
    source: cache.LogCurveBusinessValue.id
    findBy:
      - cache.LogCurveBusinessValue.Code = dataset.curves.business_value
      - cache.LogCurveBusinessValue.Name = dataset.curves.business_value
      - cache.LogCurveBusinessValue.ID = dataset.curves.business_value
    # A depth curve has no business value, and that is not a reason to hold its log.
    required: false

