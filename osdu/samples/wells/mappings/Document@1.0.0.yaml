# Mapping: a source system's documents into the Document 1.0.0 template (../../docs/mapping-templates.md).
#
# A work product component whose content is a file: the record carries what the source system knows about the document,
# and the file itself travels beside it. The route registers each file as a dataset and writes the record with its
# dataset list, so nothing here fills osdu.data.Datasets.
documentType: mapping
name: Document
version: 1.0.0
template:
  kind: osdu:wks:work-product-component--Document:1.0.0
  version: 5c6898ebc6775f6e
description: Documents (one record per document) delivered with the file that is their content.

dataset:
  system: wells
  # The source system's own document number: what it is filed under there, and what the delivery key derives from.
  key: [dataset.doc_id]
  label: "{dataset.doc_title}"

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids are minted in.

mappings:
  - target: osdu.acl.owners
    static: [data.default.owners@opendes.dataservices.energy]
  - target: osdu.acl.viewers
    static: [data.default.viewers@opendes.dataservices.energy]
  - target: osdu.legal.legaltags
    static: [opendes-reference-data-default]
  - target: osdu.legal.otherRelevantDataCountries
    static: [NO]
  - target: osdu.tags.DeliveredBy
    static: osdu-delivery

  - target: osdu.data.Name
    source: dataset.doc_title
    modifiers: [trim]
    description: The document's title, as the source system files it.
  - target: osdu.data.Description
    source: dataset.doc_description
    modifiers: [trim]
    required: false
  - target: osdu.data.Source
    static: recall
    description: The system the document came from, carried as provenance.

fixtures:
  - name: a document with a title and a description
    parameters: { dataPartition: opendes }
    record:
      doc_id: D-0001
      doc_title: " Well report NO 15/9 A "
      doc_description: Geological observations over the logged interval.
    expected: |
      {
        "id": "opendes:work-product-component--Document:9534c481c62851e4a5cedc2268e0141a",
        "kind": "osdu:wks:work-product-component--Document:1.0.0",
        "acl": {
          "owners": ["data.default.owners@opendes.dataservices.energy"],
          "viewers": ["data.default.viewers@opendes.dataservices.energy"]
        },
        "legal": {
          "legaltags": ["opendes-reference-data-default"],
          "otherRelevantDataCountries": ["NO"]
        },
        "tags": { "DeliveredBy": "osdu-delivery" },
        "data": {
          "Name": "Well report NO 15/9 A",
          "Description": "Geological observations over the logged interval.",
          "Source": "wells"
        }
      }
