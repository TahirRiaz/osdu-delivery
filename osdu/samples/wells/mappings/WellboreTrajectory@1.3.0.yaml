# Mapping: Directional surveys into the WellboreTrajectory 1.3.0 template (docs/mapping-templates.md).
#
# One record per survey. The dataset is the survey's metadata rows, and its child dataset "stations" holds one row per
# station property the survey carries (measured depth, inclination, azimuth); the station values themselves are
# streamed to the wellbore DDMS as bulk data, one column per property, named as the property is here. The DDMS refuses
# bulk columns the record does not list under AvailableTrajectoryStationProperties, and reads the property whose type is
# MD as the reference its first and last values must agree with TopDepthMeasuredDepth and BaseDepthMeasuredDepth on
# (osdu/specs/wellbore-ddms/INTEGRATION.md section 4.3). Editing this file re-renders every record that uses it, so
# changes go through `plan` and a canary before promotion (design.md section 10.5).
documentType: mapping
name: WellboreTrajectory
version: 1.3.0
template:
  kind: osdu:wks:work-product-component--WellboreTrajectory:1.3.0
  version: bfbc5973bbdeb7ec
description: Directional surveys (one record per survey) with their station properties; the stations are streamed as bulk data.

dataset:
  system: wells
  # The delivery key is UUIDv5 over (source system, source project, survey id): one record per survey.
  key: [dataset.source_project, dataset.survey_id]
  label: "{dataset.wellbore_uwi} / {dataset.survey_name} ({dataset.survey_id})"

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids and references are minted in.

mappings:
  # Access and legal: every record carries them.
  - target: osdu.acl.owners
    static: [data.default.owners@opendes.dataservices.energy]
  - target: osdu.acl.viewers
    static: [data.default.viewers@opendes.dataservices.energy]
  - target: osdu.legal.legaltags
    static: [opendes-reference-data-default]
  - target: osdu.legal.otherRelevantDataCountries
    static: [NO]
  - target: osdu.tags.DeliveredBy
    static: osdu-delivery

  # The survey.
  - target: osdu.data.Name
    source: dataset.survey_name
    modifiers: [trim]
  - target: osdu.data.SurveyReferenceIdentifier
    source: dataset.survey_id
  - target: osdu.data.SurveyType
    source: dataset.survey_type
    required: false
  - target: osdu.data.SurveyVersion
    source: dataset.survey_version
    required: false
  - target: osdu.data.WellboreID
    source: cache.Wellbore.id
    findBy: cache.Wellbore.FacilityName = dataset.wellbore_uwi
  - target: osdu.data.TopDepthMeasuredDepth
    source: dataset.top_md
  - target: osdu.data.BaseDepthMeasuredDepth
    source: dataset.base_md

  # The vertical reference, carried in one column as a value and a unit ("23.5 M").
  - target: osdu.data.VerticalMeasurement.VerticalMeasurement
    source: dataset.elev_meas_ref
    modifiers:
      - split: { separator: " ", part: 1 }
  - target: osdu.data.VerticalMeasurement.VerticalMeasurementUnitOfMeasureID
    source: cache.UnitOfMeasure.id
    findBy:
      - cache.UnitOfMeasure.Code = dataset.elev_meas_ref
      - cache.UnitOfMeasure.Name = dataset.elev_meas_ref
      - cache.UnitOfMeasure.id = dataset.elev_meas_ref
    modifiers:
      - split: { separator: " ", part: 2 }
      - replace: { M: m, FT: ft }
  - target: osdu.data.VerticalMeasurement.VerticalMeasurementTypeID
    static: "{param.dataPartition}:reference-data--VerticalMeasurementType:KellyBushing:"

  # The station properties: one item per row of the stations child dataset. Name is the bulk column's label.
  - target: osdu.data.AvailableTrajectoryStationProperties
    source: dataset.stations
  - target: osdu.data.AvailableTrajectoryStationProperties[].Name
    source: dataset.stations.station_property
  - target: osdu.data.AvailableTrajectoryStationProperties[].TrajectoryStationPropertyTypeID
    source: cache.TrajectoryStationPropertyType.id
    findBy: cache.TrajectoryStationPropertyType.Code = dataset.stations.property_type
  - target: osdu.data.AvailableTrajectoryStationProperties[].StationPropertyUnitID
    source: cache.UnitOfMeasure.id
    findBy:
      - cache.UnitOfMeasure.Code = dataset.stations.property_unit
      - cache.UnitOfMeasure.Name = dataset.stations.property_unit
      - cache.UnitOfMeasure.id = dataset.stations.property_unit
    modifiers:
      # OSDU's unit for an angle in degrees is dega.
      - replace: { M: m, FT: ft, DEG: dega }

# Example rows and the exact record each must render to under the pinned template and cache. They are the mapping's
# regression suite, which the preflight gate runs before every render (design.md section 10.3).
fixtures:
  - name: T-1001, measured depth, inclination and azimuth in metres and degrees
    parameters: { dataPartition: opendes }
    record:
      source_project: NO_15_9
      survey_id: T-1001
      wellbore_uwi: OSDU-DEV-1-A
      survey_name: " GYRO_2026 "
      survey_type: Gyro
      survey_version: "1"
      top_md: "1000"
      base_md: "1004"
      elev_meas_ref: 23.5 M
    datasets:
      stations:
        - { station_property: MD, property_type: MD, property_unit: M }
        - { station_property: INC, property_type: Inclination, property_unit: DEG }
        - { station_property: AZI, property_type: AzimuthTN, property_unit: DEG }
    expected: |
      {
        "id": "opendes:work-product-component--WellboreTrajectory:419a57e3f3d05223b56d3fce8508b39a",
        "kind": "osdu:wks:work-product-component--WellboreTrajectory:1.3.0",
        "acl": {
          "owners": ["data.default.owners@opendes.dataservices.energy"],
          "viewers": ["data.default.viewers@opendes.dataservices.energy"]
        },
        "legal": { "legaltags": ["opendes-reference-data-default"], "otherRelevantDataCountries": ["NO"] },
        "tags": { "DeliveredBy": "osdu-delivery" },
        "data": {
          "Name": "GYRO_2026",
          "SurveyReferenceIdentifier": "T-1001",
          "SurveyType": "Gyro",
          "SurveyVersion": "1",
          "WellboreID": "opendes:master-data--Wellbore:OSDU-DEV-1-A:",
          "TopDepthMeasuredDepth": 1000,
          "BaseDepthMeasuredDepth": 1004,
          "VerticalMeasurement": {
            "VerticalMeasurement": 23.5,
            "VerticalMeasurementUnitOfMeasureID": "opendes:reference-data--UnitOfMeasure:m:",
            "VerticalMeasurementTypeID": "opendes:reference-data--VerticalMeasurementType:KellyBushing:"
          },
          "AvailableTrajectoryStationProperties": [
            {
              "Name": "MD",
              "TrajectoryStationPropertyTypeID": "opendes:reference-data--TrajectoryStationPropertyType:MD:",
              "StationPropertyUnitID": "opendes:reference-data--UnitOfMeasure:m:"
            },
            {
              "Name": "INC",
              "TrajectoryStationPropertyTypeID": "opendes:reference-data--TrajectoryStationPropertyType:Inclination:",
              "StationPropertyUnitID": "opendes:reference-data--UnitOfMeasure:dega:"
            },
            {
              "Name": "AZI",
              "TrajectoryStationPropertyTypeID": "opendes:reference-data--TrajectoryStationPropertyType:AzimuthTN:",
              "StationPropertyUnitID": "opendes:reference-data--UnitOfMeasure:dega:"
            }
          ]
        }
      }
