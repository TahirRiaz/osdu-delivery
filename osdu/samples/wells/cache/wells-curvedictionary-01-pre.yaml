# Pre-ingestion: the curve dictionary file into the pre layer.
#
# One row per curve mnemonic, as petrodb-api's curve dictionary gives it (src/PetroDb/Api.Core/Mapping/CurveDictionary.json,
# built from a CSV with these columns): the OSDU LogCurveType, LogCurveMainFamily and LogCurveFamily each mnemonic is filed
# under, written as the code the record's id ends with, and the unit quantity and unit of a curve of that type. The file
# is static reference data the lookups cache flow holds, so it and the flows that load it sit in the cache folder: this
# flow lands data/curve-dictionary, wells-curvedictionary-02-ing keys it, and wells-lookups-00-cache captures that table so
# a mapping classifies a curve by its mnemonic exactly as petrodb-api does.
name: wells-curvedictionary-01-pre
batch: wells

source:
  type: csv
  location: data/curve-dictionary
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_SAMPLE_DB}
  schema: pre
  table: CurveDictionary

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: mnemonic, type: varchar(100) }
    - { name: unit, expr: "NULLIF(@ColName, '')", type: varchar(50) }
    # The export writes the word null where an entry has no comment.
    - { name: comment, expr: "NULLIF(NULLIF(@ColName, ''), 'null')", type: nvarchar(200) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append
