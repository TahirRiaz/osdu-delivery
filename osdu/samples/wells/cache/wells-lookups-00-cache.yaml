# Cache flow: wells-lookups-00-cache
#
# The lookup tables the wells mappings translate source values through before they resolve a reference: tables kept by
# this estate rather than by the OSDU platform. Each type here is a lookup table in the cache of the partition, beside
# the reference data wells-osdu-00-reference-cache captures, and a mapping reads it the same way it reads any cached type.
# A lookup table is declared by one cache flow of a partition, and a refresh replaces it whole.
#
# The tables are the translations petrodb-api applies when it turns a Recall well log into an OSDU record, held as data
# instead of code: its unit maps and its curve dictionary. Their files sit in cache/data/, each landed and keyed into an
# ingestion table by a pre and an ing flow of its own (wells-units-01/02-curve, wells-units-01/02-depth,
# wells-curvedictionary-01/02), and this flow captures those tables, so lineage runs it after them. Nothing here reaches
# the platform, so the flow needs no endpoint or credentials; the partition is still named, because it says whose cache
# the tables belong to.
flowType: cache
name: wells-lookups-00-cache
batch: wells

source:
  # The ingestion database the table types are read from, resolved on the node that runs the flow.
  connection: ${env:OSDU_SAMPLE_DB}
  headers:
    data-partition-id: ${env:OSDU_DATA_PARTITION}

types:
  # The spellings a curve's unit is written in, as the partition's UnitOfMeasure codes (petrodb-api's CurveUnit map).
  - table: OsduSample.ing.RecallUnits
    key: source_unit
    fields: [osdu_unit]
  # The spellings a depth's unit is written in (petrodb-api's DepthUnit and VerticalMeasurementUnitOfMeasureID map).
  - table: OsduSample.ing.RecallDepthUnits
    key: source_unit
    fields: [osdu_unit]
  # What each curve mnemonic is: the codes of the LogCurveType, LogCurveMainFamily and LogCurveFamily records it is filed
  # under, and its unit quantity and unit (petrodb-api's curve dictionary).
  - table: OsduSample.ing.CurveDictionary
    key: mnemonic
    fields: [log_curve_type_id, log_curve_main_family_id, log_curve_family_id, unit_quantity_id, unit]

# Nightly, after the lookup tables' own loads and before the reference cache's refresh and the hourly delivery runs.
schedule:
  cron: "30 1 * * *"
