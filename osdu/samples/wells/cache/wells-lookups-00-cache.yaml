# Cache flow: wells-lookups-00-cache
#
# The lookup tables the wells mappings translate source values through before they resolve a reference: tables kept by
# this estate rather than by the OSDU platform. Each type here is a lookup table in the cache of the partition, beside
# the reference data wells-osdu-00-reference-cache captures, and a mapping reads it the same way it reads any cached type.
# A lookup table is declared by one cache flow of a partition, and a refresh replaces it whole.
#
# A dictionary type holds a dictionary document from this repository's dictionaries/ folder, read at the commit the run
# was given, so a change reaches the cache when this flow next runs: on its schedule, or run it after merging an edit.
# Nothing here reaches the platform, so the flow needs no endpoint or credentials; the partition is still named, because
# it says whose cache the tables belong to.
flowType: cache
name: wells-lookups-00-cache
batch: wells

source:
  headers:
    data-partition-id: ${env:OSDU_DATA_PARTITION}

types:
  # Unit spellings, dictionaries/RecallUnits.yaml.
  - dictionary: RecallUnits

# Nightly, before the reference cache's own refresh and the hourly delivery runs.
schedule:
  cron: "30 1 * * *"
