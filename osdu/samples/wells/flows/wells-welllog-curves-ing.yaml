# Ingestion: the typed curve view into the keyed child table the OSDU flow joins to each log.
#
# One row per (source_project, log_id, curve_id). The delivery reads these rows as the child dataset "curves", ordered
# by curve_ordinal, and renders one item per row into the record's Curves array.
flowType: ing
name: wells-welllog-curves-ing
batch: wells

connections:
  sample: ${env:OSDU_SAMPLE_DB}

source:
  server: sample
  object: OsduSample.pre.v_WellLogCurve

target:
  server: sample
  object: OsduSample.ing.WellLogCurve
  # The identity primary key every ingestion table carries: the clustered key the other indexes point at, and the
  # column the OSDU flow pages and fans out by (source.record.primaryKey).
  identityColumn: RecId

load:
  keyColumns: [source_project, log_id, curve_id]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]
