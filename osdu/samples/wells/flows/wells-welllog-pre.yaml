# Pre-ingestion: the well log metadata files into the pre layer.
#
# The first flow of the chain the OSDU flow reads (docs/stage4-design.md section 1.3). It lands whatever CSV files are
# under ../data/welllog into [pre].[WellLog] as raw text, then refreshes the typed view [pre].[v_WellLog] that the
# ingestion flow beside it reads. A file placed in that folder by hand takes exactly the same path as any other.
name: wells-welllog-pre
batch: wells

source:
  type: csv
  location: ../data/welllog
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_SAMPLE_DB}
  schema: pre
  table: WellLog

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    # The columns whose type the delivery depends on are declared rather than inferred: the run and version are text the
    # mapping writes as it stands, the update time is what the delivery orders versions by, and the chunk count is a
    # number the plan reads to know how many payload files a record has.
    - { name: log_run, type: varchar(50) }
    - { name: log_version, type: varchar(50) }
    - { name: log_pass, type: varchar(200) }
    - { name: update_date, type: datetime2 }
    - { name: chunk_count, type: int }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append
