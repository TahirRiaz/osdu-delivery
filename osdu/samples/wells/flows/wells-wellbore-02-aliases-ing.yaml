# Ingestion: the typed alias view into the keyed child table the OSDU flow joins to each wellbore.
flowType: ing
name: wells-wellbore-02-aliases-ing
batch: wells

connections:
  sample: ${env:OSDU_SAMPLE_DB}

source:
  server: sample
  object: OsduSample.pre.v_WellboreAlias

target:
  server: sample
  object: OsduSample.ing.WellboreAlias
  # The identity primary key every ingestion table carries: the clustered key the other indexes point at, and the
  # column the OSDU flow pages and fans out by (source.record.primaryKey).
  identityColumn: RecId

load:
  keyColumns: [facility_name, alias_name]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]
