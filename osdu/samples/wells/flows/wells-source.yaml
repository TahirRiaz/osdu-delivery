# Source: wells-source
#
# One source document delivering four interfaces (docs/interfaces-design.md): the wellbores the well logs refer to, the
# well logs, the directional surveys whose stations a DDMS keeps, and the documents whose content is a file. Each has a
# ledger, a submission history, a watermark and a route of its own, and the surveys and the logs run after the
# wellbores, so a run of the source is two waves. The wellbores and the logs read the same ingestion tables the
# single-form flows beside them read (wells-wellbore, wells-welllog), under ledgers of their own, so they never
# re-deliver what those flows delivered: it is the shape a source takes, shown beside the shape it replaces.
#
# Between them the four interfaces cover three route types, each decided by what the interface declares rather than
# named: master data and well logs through the storage service, a work product component whose stations the Wellbore
# DDMS keeps, and one whose content is a file, registered through the file service.
flowType: delivery
name: wells-source
batch: wells

parameters:
  logSource:
    required: true
    description: The log source the well logs are read from (STAT_COMP, STAT_CPI, STAT_CORE, STAT_ILT, STAT_PLT, STAT_PRESS).

source:
  connection: ${env:OSDU_SAMPLE_DB}
  lastModified: update_date
  work: ../.work/wells-source

render:
  parameters:
    dataPartition: opendes

target:
  endpoint: ${env:PETRODB_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}
  headers:
    Ocp-Apim-Subscription-Key: ${env:APIM_KEY}
    data-partition-id: opendes
  # Where the DDMSs are under the endpoint. An interface that declares bulk goes to the one serving its entity type.
  ddms:
    wellbore:
      root: /api/os-wellbore-ddms

reliability:
  concurrency: 8
  retry: { attempts: 4, backoff: exponential, baseDelayMs: 500, maxDelayMs: 30000 }
  timeoutSeconds: 100
  leaseSeconds: 300
  batchSize: 50

interfaces:
  # The master data the logs point at, delivered through the storage service: no files, so nothing is streamed.
  wellbores:
    record:
      object: OsduSample.ing.Wellbore
      key: [facility_name]
      primaryKey: RecId
    # The mapping repeats the alternative names of a wellbore, which are rows of their own table.
    datasets:
      aliases:
        object: OsduSample.ing.WellboreAlias
        join:
          facility_name: facility_name
        orderBy: [alias_name]
    mapping: Wellbore@1.0.0

  # The logs, which refer to the wellbores above; `after` says so outright, and their mapping's reference says it again.
  welllogs:
    record:
      object: OsduSample.ing.WellLog
      key: [source_project, log_id]
      primaryKey: RecId
    # The mapping repeats the curves of a log, which are rows of their own table.
    datasets:
      curves:
        object: OsduSample.ing.WellLogCurve
        join:
          source_project: source_project
          log_id: log_id
        orderBy: [curve_ordinal]
    mapping: WellLog@1.4.0
    after: [wellbores]

  # A work product component whose bulk data a DDMS keeps: declaring `bulk` is what puts this interface on the ddms
  # route, and the trajectory collection of the Wellbore DDMS is where its entity type goes.
  trajectories:
    record:
      object: OsduSample.ing.WellboreTrajectory
      key: [source_project, survey_id]
      primaryKey: RecId
    datasets:
      stations:
        object: OsduSample.ing.WellboreTrajectoryStation
        join:
          source_project: source_project
          survey_id: survey_id
        orderBy: [station_ordinal]
    bulk:
      root: ../data/stations
      locationColumn: station_folder
      pattern: "chunk_*.parquet"
      hashColumn: payload_hash
      chunkCountColumn: chunk_count
    mapping: WellboreTrajectory@1.3.0
    after: [wellbores]

  # A work product component whose content is a file: declaring `files` is what puts this interface on the file route,
  # which registers each file as a dataset and then writes the record naming them.
  documents:
    record:
      object: OsduSample.ing.Document
      key: [doc_id]
      primaryKey: RecId
    files:
      root: ../data/document-files
      locationColumn: doc_folder
      pattern: "*.csv"
      hashColumn: payload_hash
    mapping: Document@1.0.0
