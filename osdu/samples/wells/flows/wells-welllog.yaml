# Flow: wells-welllog
#
# The operational document (docs/delivery/design.md section 9.2, docs/stage4-design.md section 1). One flow with a
# parameter replaces six near-identical job blocks that differed only by a log source string. The records come from the
# ingestion tables SQLFlow's own pre and ing flows load (wells-welllog-pre, wells-welllog-ing and the curve pair beside
# them): this flow reads what changed there, renders it and delivers it. Nothing here changes what a document is: only
# render.* enters the content hash, and the mapping it names is pinned. The mapping the flow renders with lives next to it
# in this repository (../mappings); the template it fills lives in the module's database, and so does the cache it reads:
# the cache of the partition it delivers to (target.headers.data-partition-id), filled by every cache flow of that
# partition, such as ../cache/osdu-cache.yaml. The platform schedules the runs.
flowType: delivery
name: wells-welllog
batch: wells

parameters:
  logSource:
    required: true
    description: The log source (STAT_COMP, STAT_CPI, STAT_CORE, STAT_ILT, STAT_PLT, STAT_PRESS).

source:
  # Resolved on the node that runs the flow; never a connection string in the document.
  connection: ${env:OSDU_SAMPLE_DB}
  record:
    object: OsduSample.ing.WellLog
    key: [source_project, log_id]
    # The table's identity primary key: the read pages by it and a fan-out cuts its ranges on it.
    primaryKey: RecId
    # One flow instance per log source: the predicate the run's parameter fills.
    scope:
      log_source: logSource
  datasets:
    curves:
      object: OsduSample.ing.WellLogCurve
      join:
        source_project: source_project
        log_id: log_id
      orderBy: [curve_ordinal]
  payloads:
    # The curve values themselves stay where the preparing side wrote them: the record's row says which folder.
    curves:
      root: ../data/curves
      locationColumn: curve_folder
      pattern: "chunk_*.parquet"
      hashColumn: payload_hash
      chunkCountColumn: chunk_count
  # When the source row last changed. A row modified after the version the ledger holds goes through render and
  # the hash check again; the same moment is skipped without rendering; an older one is never sent.
  lastModified: update_date
  incremental:
    overlapSeconds: 900
  # Where the intake writes the rendered documents a drain reads back.
  work: ../.work/{logSource}

render:
  mapping: WellLog@1.4.0
  parameters:
    dataPartition: opendes

change:
  detect: renderedHash
  payloadDetect: contentHash
  onUnchanged: skip

target:
  endpoint: ${env:PETRODB_URL}
  auth:
    type: oauth2ClientCredentials
    secondarySecretRef: ${env:OSDU_CLIENT_ID}
    secretRef: ${env:OSDU_CLIENT_SECRET}
    token:
      url: ${env:OSDU_TOKEN_URL}
      body:
        scope: ${env:OSDU_SCOPE}
  headers:
    Ocp-Apim-Subscription-Key: ${env:APIM_KEY}
    data-partition-id: opendes
  protocol: osduWellLog
  protocolOptions:
    payload: curves
    sessionThresholdChunks: 1
    preserveDataKeys: [Datasets, DDMSDatasets, ExtensionProperties]

reliability:
  concurrency: 8
  retry: { attempts: 4, backoff: exponential, baseDelayMs: 500, maxDelayMs: 30000 }
  skipStatusCodes: [409]
  timeoutSeconds: 100
  leaseSeconds: 300
  batchSize: 50

# The platform envelope: the control plane fires the deliver runs on this cadence. A verify (drift) run is a
# schedule of its own in the GUI, or a run with --operation verify.
schedule:
  cron: "0 * * * *"
  # The flow declares logSource as required, so the schedule has to say which one it fires for. Without values
  # every fire would fail validation before it read anything. A second log source is a second schedule.
  values:
    logSource: STAT_COMP

verify:
  reconcile: false
