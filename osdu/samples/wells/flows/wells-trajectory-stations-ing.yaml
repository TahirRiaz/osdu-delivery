# Ingestion: the typed station view into the keyed child table the OSDU flow joins to each survey.
#
# One row per (source_project, survey_id, station_property). The delivery reads these rows as the child dataset
# "stations", ordered by station_ordinal, and renders one item per row into the record's
# AvailableTrajectoryStationProperties array.
flowType: ing
name: wells-trajectory-stations-ing
batch: wells

connections:
  sample: ${env:OSDU_SAMPLE_DB}

source:
  server: sample
  object: OsduSample.pre.v_WellboreTrajectoryStation

target:
  server: sample
  object: OsduSample.ing.WellboreTrajectoryStation
  identityColumn: RecId

load:
  keyColumns: [source_project, survey_id, station_property]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]
