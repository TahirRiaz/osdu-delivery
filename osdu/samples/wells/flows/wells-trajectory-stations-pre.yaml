# Pre-ingestion: the station property files into the pre layer.
#
# One row per station property a survey carries (measured depth, inclination, azimuth). The values of each property are
# a column of the survey's parquet chunks under ../data/stations, named as the property is named here.
name: wells-trajectory-stations-pre
batch: wells

source:
  type: csv
  location: ../data/trajectory-stations
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_SAMPLE_DB}
  schema: pre
  table: WellboreTrajectoryStation

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: station_ordinal, type: int }
    - { name: station_property, expr: "NULLIF(@ColName, '')", type: varchar(100) }
    - { name: property_type, expr: "NULLIF(@ColName, '')", type: varchar(100) }
    - { name: property_unit, expr: "NULLIF(@ColName, '')", type: varchar(50) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append
