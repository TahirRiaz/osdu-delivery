# Pre-ingestion: the curve unit map into the pre layer.
#
# The units a curve's values are measured in: a well log's curves and a trajectory's station properties. Each row maps one spelling the Recall source writes to the code of the partition's UnitOfMeasure record, as
# petrodb-api's CurveUnit valueMap maps it (src/PetroDb/MappingGenerator/mappings/WellLog1_4_0.json). petrodb-api
# matches a spelling ignoring case, so spellings that differ only by case are one row here, as the table's key holds them.
# The file sits in the cache folder: this flow lands it, the next keys it, and wells-lookups-00-cache holds that table.
name: wells-units-01-curve-pre
batch: wells

source:
  type: csv
  location: ../cache/data/curve-units
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_SAMPLE_DB}
  schema: pre
  table: RecallUnits

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: source_unit, type: nvarchar(50) }
    - { name: osdu_unit, type: nvarchar(50) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append
