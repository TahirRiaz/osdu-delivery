# Pre-ingestion: the Recall well log header files into the pre layer.
#
# The first flow of the chain the delivery flow reads. It lands whatever CSV files are under ../data/welllog into
# [pre].[WellLog] as raw text, then refreshes the typed view [pre].[v_WellLog] that the ingestion flow beside it reads.
# The files hold one row per Recall log, exported from the table recall_to_osdu reads
# (wl_pipelines_dsis_intermediate.recall_logcurve_enriched) by osdu/tools/SampleData; a file placed in that folder by
# hand takes exactly the same path.
name: recall-welllog-01-header-pre
batch: recall

source:
  type: csv
  location: ../data/welllog
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_SAMPLE_DB}
  schema: pre
  table: WellLog

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    # The columns whose type the delivery depends on are declared rather than inferred: Recall's run, version and log id
    # are text the mapping writes as they stand (a log id reads "9982/1"), the update time is what the delivery orders
    # versions by, and the chunk count is the number of payload files a record has.
    - { name: log_id, type: varchar(50) }
    - { name: log_run, type: varchar(50) }
    - { name: log_version, type: varchar(50) }
    - { name: log_pass, type: varchar(200) }
    - { name: native_uid, type: varchar(200) }
    - { name: update_date, type: datetime2 }
    - { name: chunk_count, type: int }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: recall-welllog
