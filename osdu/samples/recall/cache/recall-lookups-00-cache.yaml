# Cache flow: recall-lookups-00-cache
#
# The lookup tables the WellLog mapping translates Recall's values through before it builds a reference: tables kept by
# this estate rather than by the OSDU platform. Each type here is a lookup table in the cache of the partition the flow
# names, beside the reference data recall-reference-00-cache captures from the platform into the same cache, and the
# mapping reads it the same way it reads any cached type: it translates a Recall value through a table here and finds
# the record the result names among that reference data. A lookup table is declared by one cache flow of a partition,
# and a refresh replaces it whole.
#
# The tables are the translations petrodb-api applies when it turns a Recall well log into an OSDU record, held as data
# instead of code: its unit maps and its curve dictionary. Their files sit in data/, and beside this flow the pre and ing
# flows land and key each file into an ingestion table (recall-cacheunits-01/02-curve, recall-cacheunits-01/02-depth,
# recall-cachecurvedictionary-01/02). This flow captures those tables, so lineage runs it after them in the recall-cache
# schedule. Nothing here reaches the platform, so the flow needs no endpoint or credentials; the partitions are still
# named, because they say whose caches the tables belong to.
flowType: cache
name: recall-lookups-00-cache
batch: recall

# The OSDU partitions whose caches this flow builds the tables into. A refresh names one of them (the partition run
# value: a dropdown in the GUI, --set partition=<name> on the CLI, values in a schedule), or builds each in turn when it
# names none. A partition added here gets a cache of its own, which the delivery flows delivering there read.
partitions: [dev]

source:
  # The ingestion database the table types are read from, resolved on the node that runs the flow.
  connection: ${env:OSDU_DATA_DB}

types:
  # The spellings a curve's unit is written in, as the partition's UnitOfMeasure codes (petrodb-api's CurveUnit map).
  - table: OsduData.arc.CacheRecallUnits
    name: RecallUnits
    key: source_unit
    fields: [osdu_unit]
  # The spellings a depth's unit is written in (petrodb-api's DepthUnit and VerticalMeasurementUnitOfMeasureID map).
  - table: OsduData.arc.CacheRecallDepthUnits
    name: RecallDepthUnits
    key: source_unit
    fields: [osdu_unit]
  # What each curve mnemonic is: the codes of the LogCurveType, LogCurveMainFamily and LogCurveFamily records it is filed
  # under, and its unit quantity and unit (petrodb-api's curve dictionary).
  - table: OsduData.arc.CacheCurveDictionary
    name: CurveDictionary
    key: mnemonic
    fields: [log_curve_type_id, log_curve_main_family_id, log_curve_family_id, unit_quantity_id, unit]

schedule: recall-cache
