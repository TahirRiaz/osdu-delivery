# Ingestion: the typed curve unit map view into the keyed table the lookups cache flow reads.
#
# One row per spelling. A newer file replaces a spelling's row, so the table always holds the map as its latest file has
# it, and recall-lookups-00-cache captures it whole into the partition's cache as RecallUnits.
flowType: ing
name: recall-cacheunits-02-curve-ing
batch: recall

connections:
  sample: ${env:OSDU_DATA_DB}

source:
  server: sample
  object: OsduData.pre.v_CacheRecallUnits

target:
  server: sample
  object: OsduData.arc.CacheRecallUnits
  identityColumn: RecId

load:
  keyColumns: [source_unit]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]

schedule: recall-cache
