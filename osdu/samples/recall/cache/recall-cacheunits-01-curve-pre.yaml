# Pre-ingestion: the curve unit map into the pre layer.
#
# Each row maps one spelling Recall writes a curve's unit in to the code of the partition's UnitOfMeasure record, as
# petrodb-api's CurveUnit valueMap maps it (src/PetroDb/MappingGenerator/mappings/WellLog1_4_0.json). petrodb-api matches
# a spelling ignoring case, so spellings that differ only by case are one row here, as the table's key holds them. This
# flow lands data/curve-units, recall-cacheunits-02-curve-ing keys it, and recall-lookups-00-cache holds that table.
name: recall-cacheunits-01-curve-pre
batch: recall

source:
  type: csv
  location: data/curve-units
  options:
    delimiter: ","
    header: true
    srcFile: "*.csv"

target:
  connection: ${env:OSDU_DATA_DB}
  schema: pre
  table: CacheRecallUnits

schema:
  evolve: widen

transform:
  inferTypes: true
  onConvertError: fail
  columns:
    - { name: source_unit, type: nvarchar(50) }
    - { name: osdu_unit, type: nvarchar(50) }

incremental:
  dateColumn: FileDate_DW
  overlapDays: 0

load:
  mode: append

schedule: recall-cache
