components:
  schemas:
    Acl:
      additionalProperties: false
      properties:
        owners:
          items:
            type: string
          title: Owners
          type: array
        viewers:
          items:
            type: string
          title: Viewers
          type: array
      required:
      - viewers
      - owners
      title: Acl
      type: object
    BadRequestResponse:
      properties:
        code:
          default: 400
          title: Code
          type: integer
        reason:
          title: Reason
          type: string
      required:
      - reason
      title: BadRequestResponse
      type: object
    HTTPValidationError:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Errors
          type: array
      title: HTTPValidationError
      type: object
    InfoResponse:
      properties:
        app_version:
          title: App Version
          type: string
        branch:
          title: Branch
          type: string
        build_time:
          title: Build Time
          type: string
        commit_id:
          title: Commit Id
          type: string
        commit_message:
          title: Commit Message
          type: string
        name:
          title: Name
          type: string
        release_version:
          title: Release Version
          type: string
      title: InfoResponse
      type: object
    Legal:
      additionalProperties: false
      properties:
        legaltags:
          items:
            type: string
          title: Legaltags
          type: array
        otherRelevantDataCountries:
          items:
            type: string
          title: Otherrelevantdatacountries
          type: array
        status:
          title: Status
          type: string
      required:
      - legaltags
      - otherRelevantDataCountries
      title: Legal
      type: object
    StorageUpsertResponse:
      properties:
        record_count:
          title: Record Count
          type: integer
        record_id_versions:
          items:
            type: string
          title: Record Id Versions
          type: array
        skipped_record_count:
          title: Skipped Record Count
          type: integer
      required:
      - record_count
      - record_id_versions
      - skipped_record_count
      title: StorageUpsertResponse
      type: object
    StorageUpsertResponseWithWarning:
      properties:
        record_count:
          title: Record Count
          type: integer
        record_id_versions:
          items:
            type: string
          title: Record Id Versions
          type: array
        skipped_record_count:
          title: Skipped Record Count
          type: integer
        warning:
          title: Warning
          type: string
        warning_record_ids:
          items:
            type: string
          title: Warning Record Ids
          type: array
      required:
      - record_count
      - record_id_versions
      - skipped_record_count
      - warning
      - warning_record_ids
      title: StorageUpsertResponseWithWarning
      type: object
    UnsupportedMediaTypeResponse:
      properties:
        code:
          default: 415
          title: Code
          type: integer
        reason:
          title: Reason
          type: string
      required:
      - reason
      title: UnsupportedMediaTypeResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: OSDU Rock and Fluid Sample DDMS
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: Rock and Fluid Sample DDMS
  version: 0.2.0
openapi: 3.0.3
paths:
  /api/rafs-ddms/dev/samplesanalysis/{analysis_type}/search:
    get:
      description: 'Get the (`samples analysis`) ids list that comply with `{query}`
        for given`{analysis_type}`. <br><br>            Use the `Accept` request header
        to specify content schema version                 (example header `Accept:
        */*;version=1.0.0` is supported).<br><br>            The  `columns_filter`,
        `rows_filter`, and  `columns_aggregation`                 query parameters
        can be used to manage data in response. <br><br>             Use `offset`,
        `page_limit` query parameters to control response data size.                 The
        `page_limit` and `total_size (found in response)` refers to the number of
        parquet files read.<br><br>        Required roles: `users.datalake.viewers`
        or `users.datalake.editors` or `users.datalake.admins`.<br>         In addition,
        users must be members of a data group(ACL) to access the data.'
      operationId: get_search_api_rafs_ddms_dev_samplesanalysis__analysis_type__search_get
      parameters:
      - in: path
        name: analysis_type
        required: true
        schema:
          title: Analysis Type
          type: string
      - description: Specifies the proper data partition id
        examples:
          example:
            value: opendes
        in: header
        name: data-partition-id
        required: true
        schema:
          description: Specifies the proper data partition id
          title: data-partition-id
          type: string
      - description: Content schema version, e.g. `1.0.0`. Takes precedence over the
          Accept header.
        example: 1.0.0
        in: query
        name: content_schema_version
        required: true
        schema:
          description: Content schema version, e.g. `1.0.0`. Takes precedence over
            the Accept header.
          title: Content Schema Version
          type: string
      - in: header
        name: x-collaboration
        required: false
        schema:
          title: X-Collaboration
          type: string
      - description: 'Optional scope parameter to filter search results to a specific
          basin. Must be a valid OSDU record ID of kind ''master-data--Basin'' (e.g.,
          ''authority:master-data--Basin:identifier''). Scope parameters filter results
          hierarchically: basin -> field -> well -> wellbore.'
        in: query
        name: basin_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Basin:[\w\-\.\:\%]+$
          title: Basin ID
          type: string
      - description: Optional scope parameter to filter search results to a specific
          field. Must be a valid OSDU record ID of kind 'master-data--Field'. Used
          with or without basin_id scope.
        in: query
        name: field_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Field:[\w\-\.\:\%]+$
          title: Field ID
          type: string
      - description: Optional scope parameter to filter search results to a specific
          well. Must be a valid OSDU record ID of kind 'master-data--Well'. Used with
          or without basin_id/field_id scope.
        in: query
        name: well_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Well:[\w\-\.\:\%]+$
          title: Well ID
          type: string
      - description: Optional scope parameter to filter search results to a specific
          wellbore. Must be a valid OSDU record ID of kind 'master-data--Wellbore'.
          Most restrictive scope parameter. Required when depth_shift_policy is provided
          on SamplesAnalysis search/data.
        in: query
        name: wellbore_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Wellbore:[\w\-\.\:\%]+$
          title: Wellbore ID
          type: string
      - description: A valid json array of property names
        examples:
          example:
            value: '["ColumnName1[.FieldName1]", "ColumnName2[.FieldName2]"]'
        in: query
        name: columns_filter
        required: false
        schema:
          description: A valid json array of property names
          title: Columns Filter
          type: string
      - description: A valid json object with property name, operator and value
        examples:
          example:
            value: '{"PropertyX[.PropertyXFieldA]": {"$gt": "{Value}"}}'
        in: query
        name: rows_filter
        required: false
        schema:
          description: A valid json object with property name, operator and value
          title: Rows Filter
          type: string
      - description: A valid json object with combined rows filters with optional
          $or and $and keys
        examples:
          example:
            value: '{"$and": [{"PropertyX[.PropertyXFieldA]": {"$gt": "{Value}"}},
              {"$or": [{"PropertyY[.PropertyYFieldB]": {"$eq": "{Value}"}}, {"PropertyZ[.PropertyZFieldC]":
              {"$le": "{Value}"}}]}]}'
        in: query
        name: rows_multiple_filter
        required: false
        schema:
          description: A valid json object with combined rows filters with optional
            $or and $and keys
          title: Rows Multiple Filter
          type: string
      - description: A valid json object with property name and value.
        in: query
        name: metadata
        required: false
        schema:
          description: A valid json object with property name and value.
          title: Metadata
          type: string
      - description: A valid json array with property name and aggregator function
        examples:
          example:
            value: '["ColumnName[.FieldName]", "function"]'
        in: query
        name: columns_aggregation
        required: false
        schema:
          description: A valid json array with property name and aggregator function
          title: Columns Aggregation
          type: string
      - description: Number of results to skip before returning data
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of results to skip before returning data
          minimum: 0.0
          title: Offset
          type: integer
      - description: Maximum number of results to return per page
        in: query
        name: page_limit
        required: false
        schema:
          default: 1000
          description: Maximum number of results to return per page
          exclusiveMinimum: true
          maximum: 1000.0
          minimum: 0.0
          title: Page Limit
          type: integer
      - description: Start date in YYYY-MM-DD format
        examples:
          example:
            value: '2023-01-01'
        in: query
        name: indexed_start_date
        required: false
        schema:
          description: Start date in YYYY-MM-DD format
          title: Indexed Start Date
          type: string
      - description: End date in YYYY-MM-DD format
        examples:
          example:
            value: '2023-12-31'
        in: query
        name: indexed_end_date
        required: false
        schema:
          description: End date in YYYY-MM-DD format
          title: Indexed End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Search
      tags:
      - dev-samplesanalysis
  /api/rafs-ddms/dev/samplesanalysis/{analysis_type}/search/data:
    get:
      description: 'Get the (`queried`) bulk data from every `{analysis_type}` found
        in search service. <br><br>            Use the `Accept` request header to
        specify content schema version                 (example header `Accept: */*;version=1.0.0`
        is supported).<br><br>            The  `columns_filter`, `rows_filter`, and  `columns_aggregation`                 query
        parameters can be used to manage data in response. <br><br>            Use
        `offset`, `page_limit` query parameters to control response data size.                 The
        `page_limit` and `total_size (found in response)` refers to the number of
        parquet files read.<br><br>        Required roles: `users.datalake.viewers`
        or `users.datalake.editors` or `users.datalake.admins`.<br>         In addition,
        users must be members of a data group(ACL) to access the data.<br><br>Depth-shift
        augmentation parameters: use <code>depth_shift_policy</code> (<code>definitive</code>
        or <code>id_provided</code>) and optional <code>depth_shift_id</code>.<br><br>Scope
        parameters filter results hierarchically by organizational level: <code>basin_id</code>
        (broadest), <code>field_id</code>, <code>well_id</code>, <code>wellbore_id</code>
        (most restrictive). Scope parameters are optional for regular search, but
        <code>wellbore_id</code> is required when <code>depth_shift_policy</code>
        is provided.'
      operationId: get_search_data_api_rafs_ddms_dev_samplesanalysis__analysis_type__search_data_get
      parameters:
      - in: path
        name: analysis_type
        required: true
        schema:
          title: Analysis Type
          type: string
      - description: Specifies the proper data partition id
        examples:
          example:
            value: opendes
        in: header
        name: data-partition-id
        required: true
        schema:
          description: Specifies the proper data partition id
          title: data-partition-id
          type: string
      - description: Content schema version, e.g. `1.0.0`. Takes precedence over the
          Accept header.
        example: 1.0.0
        in: query
        name: content_schema_version
        required: true
        schema:
          description: Content schema version, e.g. `1.0.0`. Takes precedence over
            the Accept header.
          title: Content Schema Version
          type: string
      - in: header
        name: x-collaboration
        required: false
        schema:
          title: X-Collaboration
          type: string
      - description: 'Optional scope parameter to filter search results to a specific
          basin. Must be a valid OSDU record ID of kind ''master-data--Basin'' (e.g.,
          ''authority:master-data--Basin:identifier''). Scope parameters filter results
          hierarchically: basin -> field -> well -> wellbore.'
        in: query
        name: basin_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Basin:[\w\-\.\:\%]+$
          title: Basin ID
          type: string
      - description: Optional scope parameter to filter search results to a specific
          field. Must be a valid OSDU record ID of kind 'master-data--Field'. Used
          with or without basin_id scope.
        in: query
        name: field_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Field:[\w\-\.\:\%]+$
          title: Field ID
          type: string
      - description: Optional scope parameter to filter search results to a specific
          well. Must be a valid OSDU record ID of kind 'master-data--Well'. Used with
          or without basin_id/field_id scope.
        in: query
        name: well_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Well:[\w\-\.\:\%]+$
          title: Well ID
          type: string
      - description: Optional scope parameter to filter search results to a specific
          wellbore. Must be a valid OSDU record ID of kind 'master-data--Wellbore'.
          Most restrictive scope parameter. Required when depth_shift_policy is provided
          on SamplesAnalysis search/data.
        in: query
        name: wellbore_id
        required: false
        schema:
          pattern: ^[\w\-\.]+:master-data--Wellbore:[\w\-\.\:\%]+$
          title: Wellbore ID
          type: string
      - description: 'Depth shift resolution strategy: ''definitive'' uses the sample''s
          definitive depth shift, ''id_provided'' uses the explicit depth_shift_id.'
        in: query
        name: depth_shift_policy
        required: false
        schema:
          description: 'Depth shift resolution strategy: ''definitive'' uses the sample''s
            definitive depth shift, ''id_provided'' uses the explicit depth_shift_id.'
          enum:
          - definitive
          - id_provided
          title: Depth Shift Policy
          type: string
      - description: DepthShift WPC record ID to apply to the response data.
        in: query
        name: depth_shift_id
        required: false
        schema:
          description: DepthShift WPC record ID to apply to the response data.
          pattern: ^[\w\-\.]+:work-product-component--DepthShift:[\w\-\.\:\%]+$
          title: Depth Shift Id
          type: string
      - description: A valid json array of property names
        examples:
          example:
            value: '["ColumnName1[.FieldName1]", "ColumnName2[.FieldName2]"]'
        in: query
        name: columns_filter
        required: false
        schema:
          description: A valid json array of property names
          title: Columns Filter
          type: string
      - description: A valid json object with property name, operator and value
        examples:
          example:
            value: '{"PropertyX[.PropertyXFieldA]": {"$gt": "{Value}"}}'
        in: query
        name: rows_filter
        required: false
        schema:
          description: A valid json object with property name, operator and value
          title: Rows Filter
          type: string
      - description: A valid json object with combined rows filters with optional
          $or and $and keys
        examples:
          example:
            value: '{"$and": [{"PropertyX[.PropertyXFieldA]": {"$gt": "{Value}"}},
              {"$or": [{"PropertyY[.PropertyYFieldB]": {"$eq": "{Value}"}}, {"PropertyZ[.PropertyZFieldC]":
              {"$le": "{Value}"}}]}]}'
        in: query
        name: rows_multiple_filter
        required: false
        schema:
          description: A valid json object with combined rows filters with optional
            $or and $and keys
          title: Rows Multiple Filter
          type: string
      - description: A valid json object with property name and value.
        in: query
        name: metadata
        required: false
        schema:
          description: A valid json object with property name and value.
          title: Metadata
          type: string
      - description: A valid json array with property name and aggregator function
        examples:
          example:
            value: '["ColumnName[.FieldName]", "function"]'
        in: query
        name: columns_aggregation
        required: false
        schema:
          description: A valid json array with property name and aggregator function
          title: Columns Aggregation
          type: string
      - description: Number of results to skip before returning data
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of results to skip before returning data
          minimum: 0.0
          title: Offset
          type: integer
      - description: Maximum number of results to return per page
        in: query
        name: page_limit
        required: false
        schema:
          default: 100
          description: Maximum number of results to return per page
          exclusiveMinimum: true
          maximum: 100.0
          minimum: 0.0
          title: Page Limit
          type: integer
      - description: Start date in YYYY-MM-DD format
        examples:
          example:
            value: '2023-01-01'
        in: query
        name: indexed_start_date
        required: false
        schema:
          description: Start date in YYYY-MM-DD format
          title: Indexed Start Date
          type: string
      - description: End date in YYYY-MM-DD format
        examples:
          example:
            value: '2023-12-31'
        in: query
        name: indexed_end_date
        required: false
        schema:
          description: End date in YYYY-MM-DD format
          title: Indexed End Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Search Data
      tags:
      - dev-samplesanalysis
  /api/rafs-ddms/dev/samplesanalysis/{record_id}/data/{analysis_type}:
    get:
      description: 'Get the (`latest version`) bulk data for a given `{analysis_type}`
        object by record id. <br><br>            Use the `Accept` request header to
        specify content schema version                 (example header `Accept: */*;version=1.0.0`
        is supported).<br><br>            The  `columns_filter`, `rows_filter`, and  `columns_aggregation`                 query
        parameters can be used to manage data in response.<br><br>        Required
        roles: `users.datalake.viewers` or `users.datalake.editors` or `users.datalake.admins`.<br>         In
        addition, users must be members of a data group(ACL) to access the data.'
      operationId: get_data_dev_api_rafs_ddms_dev_samplesanalysis__record_id__data__analysis_type__get
      parameters:
      - in: path
        name: analysis_type
        required: true
        schema:
          title: Analysis Type
          type: string
      - description: OSDU record identifier for a <code>work-product-component--SamplesAnalysis</code>
          entity.<br><br><b>URL Encoding:</b> If the record ID contains literal <code>&#37;</code>
          characters (e.g., <code>osdu:work-product-component--SamplesAnalysis:7&#37;2F12-A-7&#37;20D_Sample_249</code>),
          the <code>&#37;</code> must be <b>double-encoded</b> in the URL path. This
          is standard HTTP behavior per <a href='https://datatracker.ietf.org/doc/html/rfc3986'>RFC
          3986</a>.<br><br><b>Examples:</b><br><code>osdu:work-product-component--SamplesAnalysis:simple_id</code>&nbsp;&nbsp;→&nbsp;
          <code>/v2/samplesanalysis/osdu:work-product-component--SamplesAnalysis:simple_id</code><br><br><code>osdu:work-product-component--SamplesAnalysis:7&#37;2F12-A-7&#37;20D</code>&nbsp;&nbsp;→&nbsp;
          <code>/v2/samplesanalysis/osdu:work-product-component--SamplesAnalysis:7&#37;252F12-A-7&#37;2520D</code><br><br><b>Encoding
          reference:</b><br><code>&#37;</code> &nbsp;→&nbsp; <code>&#37;25</code><br><code>&#37;2F</code>
          →&nbsp; <code>&#37;252F</code><br><code>&#37;20</code> →&nbsp; <code>&#37;2520</code>
        in: path
        name: record_id
        required: true
        schema:
          pattern: ^[\w\-\.]+:work-product-component--SamplesAnalysis:[\w\-\.\:\%]+$
          title: Record Id
          type: string
      - description: Specifies the proper data partition id
        examples:
          example:
            value: opendes
        in: header
        name: data-partition-id
        required: true
        schema:
          description: Specifies the proper data partition id
          title: data-partition-id
          type: string
      - description: Content schema version, e.g. `1.0.0`. Takes precedence over the
          Accept header.
        example: 1.0.0
        in: query
        name: content_schema_version
        required: true
        schema:
          description: Content schema version, e.g. `1.0.0`. Takes precedence over
            the Accept header.
          title: Content Schema Version
          type: string
      - in: header
        name: x-collaboration
        required: false
        schema:
          title: X-Collaboration
          type: string
      - description: A valid json array of property names
        examples:
          example:
            value: '["ColumnName1[.FieldName1]", "ColumnName2[.FieldName2]"]'
        in: query
        name: columns_filter
        required: false
        schema:
          description: A valid json array of property names
          title: Columns Filter
          type: string
      - description: A valid json object with property name, operator and value
        examples:
          example:
            value: '{"PropertyX[.PropertyXFieldA]": {"$gt": "{Value}"}}'
        in: query
        name: rows_filter
        required: false
        schema:
          description: A valid json object with property name, operator and value
          title: Rows Filter
          type: string
      - description: A valid json object with combined rows filters with optional
          $or and $and keys
        examples:
          example:
            value: '{"$and": [{"PropertyX[.PropertyXFieldA]": {"$gt": "{Value}"}},
              {"$or": [{"PropertyY[.PropertyYFieldB]": {"$eq": "{Value}"}}, {"PropertyZ[.PropertyZFieldC]":
              {"$le": "{Value}"}}]}]}'
        in: query
        name: rows_multiple_filter
        required: false
        schema:
          description: A valid json object with combined rows filters with optional
            $or and $and keys
          title: Rows Multiple Filter
          type: string
      - description: A valid json array with property name and aggregator function
        examples:
          example:
            value: '["ColumnName[.FieldName]", "function"]'
        in: query
        name: columns_aggregation
        required: false
        schema:
          description: A valid json array with property name and aggregator function
          title: Columns Aggregation
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Data Dev
      tags:
      - dev-samplesanalysis
    post:
      description: 'Upload the bulk data for a given `{analysis_type}` object by record
        id.<br>            It creates a new version of the record. <br>            The
        previous meta-data with bulk data is available by their `versions`. <br> <br>            Use
        the `Content-Type` request header to specify payload and response formats                 (`application/json`
        and `application/parquet` are supported).<br>            Use the `Accept`
        request header to specify content schema version                 (example
        header `Accept: */*;version=1.0.0` is supported).<br><br>        Required
        roles: `users.datalake.editors` or `users.datalake.admins`.<br>         In
        addition, users must be members of a data group(ACL) to access the data.'
      operationId: post_data_dev_api_rafs_ddms_dev_samplesanalysis__record_id__data__analysis_type__post
      parameters:
      - in: path
        name: analysis_type
        required: true
        schema:
          title: Analysis Type
          type: string
      - description: OSDU record identifier for a <code>work-product-component--SamplesAnalysis</code>
          entity.<br><br><b>URL Encoding:</b> If the record ID contains literal <code>&#37;</code>
          characters (e.g., <code>osdu:work-product-component--SamplesAnalysis:7&#37;2F12-A-7&#37;20D_Sample_249</code>),
          the <code>&#37;</code> must be <b>double-encoded</b> in the URL path. This
