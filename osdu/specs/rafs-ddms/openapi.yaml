  /api/rafs-ddms/v2/samplesanalysis/{analysis_type}/search:
    get:
      description: 'Get `{analysis_type}` records containing associated bulk data
        (`data.DDMSDatasets`).<br><br> Use the `content_schema_version` query parameter
        to specify content schema version (e.g. `?content_schema_version=1.0.0`).
        The `Accept` header versioning is deprecated. The  `columns_filter`, `rows_filter`,
        and  `columns_aggregation`  query parameters can be used to manage data in
        response. <br><br>  Use `offset`, `page_limit` query parameters to control
        response data size.  The `page_limit` and `total_size` (found in response)
        <br> refers to the number of parquet  files read.<br><br> Use `indexed_start_date`
        and `indexed_end_date` query parameters to filter the data based on indexing  date.
        <br><br>  - `indexed_start_date`: Filter for data indexed on or after this
        date. <br><br>   - `indexed_end_date`: Filter for data indexed on or before
        this date. <br><br>'
      operationId: search_endpoint_api_rafs_ddms_v2_samplesanalysis__analysis_type__search_get
      parameters:
      - in: path
        name: analysis_type
        required: true
        schema:
          title: Analysis Type
          type: string
      - description: Specifies the proper data partition id
        examples:
          example:
            value: opendes
        in: header
        name: data-partition-id
        required: true
        schema:
          description: Specifies the proper data partition id
          title: data-partition-id
          type: string
      - description: Content schema version, e.g. `1.0.0`. Takes precedence over the
          Accept header.
        example: 1.0.0
        in: query
        name: content_schema_version
        required: true
        schema:
          description: Content schema version, e.g. `1.0.0`. Takes precedence over
            the Accept header.
          title: Content Schema Version
          type: string
      - in: header
        name: x-collaboration
        required: false
        schema:
          title: X-Collaboration
          type: string
      - description: 'Optional scope parameter to filter search results to a specific
          basin. Must be a valid OSDU record ID of kind ''master-data--Basin'' (e.g.,
          ''authority:master-data--Basin:identifier''). Scope parameters filter results
          hierarchically: basin -> field -> well -> wellbore.'
        in: query
        name: basin_id
        required: false
        schema:
          description: 'Optional scope parameter to filter search results to a specific
            basin. Must be a valid OSDU record ID of kind ''master-data--Basin'' (e.g.,
            ''authority:master-data--Basin:identifier''). Scope parameters filter
            results hierarchically: basin -> field -> well -> wellbore.'
          title: Basin Id
          type: string
      - description: Optional scope parameter to filter search results to a specific
          field. Must be a valid OSDU record ID of kind 'master-data--Field'. Used
          with or without basin_id scope.
        in: query
        name: field_id
        required: false
        schema:
          description: Optional scope parameter to filter search results to a specific
            field. Must be a valid OSDU record ID of kind 'master-data--Field'. Used
            with or without basin_id scope.
          title: Field Id
          type: string
      - description: Optional scope parameter to filter search results to a specific
          well. Must be a valid OSDU record ID of kind 'master-data--Well'. Used with
          or without basin_id/field_id scope.
        in: query
        name: well_id
        required: false
        schema:
          description: Optional scope parameter to filter search results to a specific
            well. Must be a valid OSDU record ID of kind 'master-data--Well'. Used
            with or without basin_id/field_id scope.
          title: Well Id
          type: string
      - description: Optional scope parameter to filter search results to a specific
          wellbore. Must be a valid OSDU record ID of kind 'master-data--Wellbore'.
          Most restrictive scope parameter. Required when depth_shift_policy is provided
          on SamplesAnalysis search/data.
        in: query
        name: wellbore_id
        required: false
        schema:
          description: Optional scope parameter to filter search results to a specific
            wellbore. Must be a valid OSDU record ID of kind 'master-data--Wellbore'.
            Most restrictive scope parameter. Required when depth_shift_policy is
            provided on SamplesAnalysis search/data.
          title: Wellbore Id
          type: string
      - examples:
          example:
            value: PropertyX,PropertyY,PropertyZ
        in: query
        name: columns_filter
        required: false
        schema:
          title: Columns Filter
          type: string
      - examples:
          example:
            value: PropertyX[.PropertyXFieldA],gt,4000
        in: query
        name: rows_filter
        required: false
        schema:
          title: Rows Filter
          type: string
      - examples:
          example:
            value: PropertyX[.PropertyXFieldA],mean
        in: query
        name: columns_aggregation
        required: false
        schema:
          title: Columns Aggregation
          type: string
      - description: Number of results to skip before returning data
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Number of results to skip before returning data
          minimum: 0.0
          title: Offset
          type: integer
      - description: Maximum number of results to return per page
        in: query
        name: page_limit
        required: false
        schema:
          default: 1000
          description: Maximum number of results to return per page
          exclusiveMinimum: true
          maximum: 1000.0
          minimum: 0.0
          title: Page Limit
          type: integer
      - description: Start date in YYYY-MM-DD format
        examples:
          example:
            value: '2023-01-01'
        in: query
        name: indexed_start_date
        required: false
        schema:
          description: Start date in YYYY-MM-DD format
          title: Indexed Start Date
          type: string
      - description: End date in YYYY-MM-DD format
        examples:
          example:
            value: '2023-12-31'
        in: query
        name: indexed_end_date
        required: false
