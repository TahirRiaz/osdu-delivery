          example: opendes:wks:dataset--File.Generic:1.0.0
        acl:
          $ref: '#/components/schemas/Acl'
        tags:
          $ref: '#/components/schemas/Tag'
        data:
          $ref: '#/components/schemas/Data'
        legal:
          $ref: '#/components/schemas/Legal'

    Acl:
      type: object
