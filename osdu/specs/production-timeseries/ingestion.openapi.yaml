          type: string
          example: ALLOCATED_PROD_OIL_RATE
        unit:
          type: string
          example: bbl
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'

    IngestTimeSeriesBatchForSingleProductionValuesRequest:
