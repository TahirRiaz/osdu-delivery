components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OSDU Entitlement/Token Service JWT Bearer Token

  parameters:
    DataPartitionId:
      name: data-partition-id
      in: header
      description: The tenant data partition ID.
      required: true
      schema:
        type: string
        example: opendes

    RecordId:
      name: recordId
      in: path
      description: ProductionValues v2.0.0+ record ID.
      required: true
      schema:
        type: string
        example: opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4277

    TimeseriesId:
      name: timeseriesId
      in: path
      description: DDMSDatasetID. The timeseries identifier within the record.
      required: true
      schema:
        type: string
        example: ESTIMATED_GAS_VOLUME

  responses:
    400BadRequest:
      description: Bad request. Payload validation failed or payload is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          example:
            result:
              code: 400
              reason: Bad Request
              message: >-
                Invalid point value type. Expected Double, but invalid value(s):
                'abc123' of String is(are) found for timestamp(s): 978307200000
    401Unauthorized:
      description: Unauthorized. Authentication failed or token is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          example:
            result:
              code: 401
              reason: Unauthorized
              message: "The supplied authentication is invalid or has expired."
    403Forbidden:
      description: Forbidden. User does not have appropriate permissions (Admin, Editor).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          example:
            result:
              code: 403
              reason: Forbidden
              message: "User does not have permission to access this resource."
    404NotFound:
      description: Not Found. Record or timeseries could not be located.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          example:
            result:
              code: 404
              reason: Not Found
              message: "Record not found opendes:work-product-component--ProductionValues:VALIDATION_TEST"
    500InternalError:
      description: Internal Server Error. Service encountered an unexpected problem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppError'
          example:
            result:
              code: 500
              reason: Internal Server Error
              message: "Unable to process your request at this time. Please try again later. If the issue persists, please contact support."

  schemas:
    ResultInfo:
      type: object
      required:
        - code
        - reason
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code
          example: 202
        reason:
          type: string
          description: Short explanation of the status
          example: Accepted
        message:
          type: string
          description: Detailed response message
          example: "The request has been accepted for processing, but the processing has not been completed."

    AppError:
      type: object
      required:
        - result
      properties:
        result:
          $ref: '#/components/schemas/ResultInfo'

    VersionInfo:
      type: object
      required:
        - groupId
        - artifactId
        - version
        - connectedOuterServices
      properties:
        groupId:
          type: string
          example: org.opengroup.osdu.production
        artifactId:
          type: string
          example: pddms-timeseries-ingestion
        version:
          type: string
          example: 0.1.0-SNAPSHOT
        buildTime:
          type: string
          example: "2026-06-17T02:21:07Z"
        branch:
          type: string
          example: develop
        commitId:
          type: string
          example: 3b7f8f4188a4a4ce12c15ecba95b5095f36928f1
        commitMessage:
          type: string
          example: "Update : Remove unit from response and request"
        connectedOuterServices:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedOuterService'

    ConnectedOuterService:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          example: OSDU Core Entitlement service
        version:
          type: string
          example: "N/A"

    VersionInfoShort:
      type: object
      required:
        - groupId
        - artifactId
        - version
      properties:
        groupId:
          type: string
          example: org.opengroup.osdu.production
        artifactId:
          type: string
          example: pddms-timeseries-ingestion
        version:
          type: string
          example: 0.1.0-SNAPSHOT

    Point:
      type: object
      required:
        - point
        - value
      properties:
        point:
          type: integer
          format: int64
          description: Unix epoch millisecond timestamp
          example: 978307200000
        value:
          description: Value at the timestamp (number, string, boolean)
          oneOf:
            - type: number
              format: double
            - type: string
            - type: boolean
          example: 58883469.74

    TimeSeriesMetadata:
      type: object
      properties:
        nominalPeriodId:
          type: string
          nullable: true
          example: "opendes:reference-data--ReportingPeriod:Day:"
        quantityMethodId:
          type: string
          nullable: true
          example: "opendes:reference-data--QuantityMethod:Estimated:"
        durationContextId:
          type: string
          nullable: true
        volumeFlowMeasurementTypeId:
          type: string
          nullable: true
        propertyId:
          type: string
          nullable: true
          example: gas-production-rate
        unitQuantityId:
          type: string
          nullable: true
        productId:
          type: string
          nullable: true
        dispositionId:
          type: string
          nullable: true
        parameterKindId:
          type: string
          nullable: true
        unitOfMeasureId:
          type: string
          nullable: true
          example: bbl

    IngestTimeSeriesRequest:
      type: object
      required:
        - points
      properties:
        unit:
          type: string
          example: bbl
          description: Base unit for the points provided
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'

    IngestTimeSeriesResponse:
      type: object
      required:
        - timeseriesId
        - version
        - count
        - points
        - result
      properties:
        timeseriesId:
          type: string
          example: ESTIMATED_GAS_VOLUME
        version:
          type: integer
          format: int64
          example: 1781668713201
        start:
          type: integer
          format: int64
          description: Starting point timestamp of the returned data.
          example: 978307200000
        end:
          type: integer
          format: int64
          description: Ending point timestamp of the returned data.
          example: 978339600000
        metadata:
          $ref: '#/components/schemas/TimeSeriesMetadata'
        count:
          type: integer
          format: int32
          description: Number of points ingested
          example: 6
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        result:
          $ref: '#/components/schemas/ResultInfo'

    TimeSeriesErrorResponse:
      type: object
      required:
        - timeseriesId
        - result
      properties:
        timeseriesId:
          type: string
          example: ESTIMATED_GAS_VOLUME
        result:
          $ref: '#/components/schemas/ResultInfo'

    ProductionValuesErrorResponse:
      type: object
      required:
        - recordId
        - result
      properties:
        recordId:
          type: string
          example: opendes:work-product-component--ProductionValues:VALIDATION_TEST
        result:
          $ref: '#/components/schemas/ResultInfo'

    BatchResultItem:
      type: object
      required:
        - recordId
        - result
      properties:
        recordId:
          type: string
          example: opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4277
        reportingEntityId:
          type: string
          example: opendes:master-data--Well:4093
        timeseries:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/IngestTimeSeriesResponse'
              - $ref: '#/components/schemas/TimeSeriesErrorResponse'
        result:
          $ref: '#/components/schemas/ResultInfo'

    BatchResponse:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/BatchResultItem'
          - $ref: '#/components/schemas/ProductionValuesErrorResponse'

    IngestTimeSeriesBatchRequest:
      type: object
      required:
        - productionValues
      properties:
        productionValues:
          type: array
          items:
            $ref: '#/components/schemas/IngestTimeSeriesBatchProductionValuesRequestItem'

    IngestTimeSeriesBatchProductionValuesRequestItem:
      type: object
      required:
        - recordId
        - timeseries
      properties:
        recordId:
          type: string
          example: opendes:work-product-component--ProductionValues:DOUBLE-001
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/IngestTimeSeriesBatchTimeSeriesRequestItem'

    IngestTimeSeriesBatchTimeSeriesRequestItem:
      type: object
      required:
        - timeseriesId
        - points
      properties:
