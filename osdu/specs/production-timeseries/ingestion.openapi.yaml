openapi: 3.0.3
info:
  title: OSDU Production DDMS. Time-series Ingestion Service
  version: 1.0.0
  description: >
    The Time-series Ingestion Service is part of the OSDU Production Domain Data Management Service (Production DDMS).
    It is used to store/ingest time-series bulk data into the historian storage system and validate ingestion files.
  contact:
    email: dps@OSDU.org
    name: OSDU Data Platform Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/pddms/ingest/v1
    description: OSDU API Gateway
security:
  - BearerAuth: []
tags:
  - name: Info
    description: Service metadata and version information
  - name: Health
    description: Kubernetes health check endpoints
  - name: Ingestion
    description: Store bulk time-series data points
paths:
  /info:
    get:
      tags:
        - Info
      summary: Detailed version info
      description: Returns build, version, and dependency information, including status of downstream connections (Entitlements, Storage, Messaging queue).
      operationId: getDetailedVersionInfo
      parameters:
        - $ref: '#/components/parameters/DataPartitionId'
      responses:
        '200':
          description: Version and dependency information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              example:
                groupId: org.opengroup.osdu.production
                artifactId: pddms-timeseries-ingestion
                version: 0.1.0-SNAPSHOT
                buildTime: "2026-06-17T02:21:07Z"
                branch: develop
                commitId: 3b7f8f4188a4a4ce12c15ecba95b5095f36928f1
                commitMessage: "Update : Remove unit from response and request\n"
                connectedOuterServices:
                  - name: OSDU Core Entitlement service
                    version: "N/A"
                  - name: OSDU Core Storage service
                    version: "N/A"
                  - name: Messaging queue
                    version: "N/A"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'

  /info/short:
    get:
      tags:
        - Info
      summary: Short version info
      description: Returns basic build artifacts and group/version information.
      operationId: getShortVersionInfo
      parameters:
        - $ref: '#/components/parameters/DataPartitionId'
      responses:
        '200':
          description: Basic service version info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfoShort'
              example:
                groupId: org.opengroup.osdu.production
                artifactId: pddms-timeseries-ingestion
                version: 0.1.0-SNAPSHOT
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'

  /liveness_check:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Kubernetes liveness probe checking if the service is running.
      operationId: livenessCheck
      responses:
        '200':
          description: Service is alive.
          content:
            text/plain:
              schema:
                type: string
                example: Time Series Ingestion Service is alive

  /readiness_check:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Kubernetes readiness probe verifying if the service is ready to accept requests.
      operationId: readinessCheck
      responses:
        '200':
          description: Service is ready.
          content:
            text/plain:
              schema:
                type: string
                example: Time Series Ingestion Service is ready

  /production-values/{recordId}/timeseries/{timeseriesId}:
    post:
      tags:
        - Ingestion
      summary: Ingest time-series data
      description: Stores/ingests data points for a specific timeseries ID within a ProductionValues record.</br><p>Allowed roles&colon; `service.pddms.editor` and `service.pddms.admin`.
      operationId: ingestTimeSeries
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/TimeseriesId'
        - $ref: '#/components/parameters/DataPartitionId'
      requestBody:
        description: Time-series unit and data points payload to ingest.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestTimeSeriesRequest'
            example:
              points:
                - timestamp: 978307200000
                  value: 58883469.74
                - timestamp: 978310800000
                  value: 58872291.29
                - timestamp: 978314400000
                  value: 58917419.15
      responses:
        '202':
          description: Points accepted for storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              examples:
                accepted:
                  summary: Ingestion accepted for a single timeseries
                  value:
                    - recordId: >-
                        opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4277
                      reportingEntityId: 'opendes:master-data--Well:4093'
                      timeseries:
                        - timeseriesId: ESTIMATED_GAS_VOLUME
                          version: 1781769547918
                          start: 978307200000
                          end: 978314400000
                          metadata:
                            nominalPeriodId: 'opendes:reference-data--ReportingPeriod:Day:'
                            quantityMethodId: 'opendes:reference-data--QuantityMethod:Estimated:'
                            durationContextId: 'opendes:reference-data--DurationContext:UptimeHours:'
                            volumeFlowMeasurementTypeId: 'opendes:reference-data--VolumeFlowMeasurementType:Production:'
                            propertyId: 'opendes:reference-data--ProductionPropertyType:Volume:'
                            unitQuantityId: 'opendes:reference-data--UnitQuantity:volume%20per%20time:'
                            productId: 'opendes:reference-data--ProductKind:Gas:'
                            dispositionId: 'opendes:reference-data--DispositionType:Sold:'
                            parameterKindId: 'opendes:reference-data--ParameterKind:Double:'
                            unitOfMeasureId: 'opendes:reference-data--UnitOfMeasure:1000%20m3%2Fd:'
                          pointsCount: 3
                          result:
                            code: 202
                            reason: Accepted
                            message: >-
                              The request has been accepted for processing, but the processing has
                              not been completed.
                      result:
                        code: 202
                        reason: Accepted
                        message: >-
                          The request has been accepted for processing, but the processing has not
                          been completed.
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

  /production-values/{recordId}/timeseries:
