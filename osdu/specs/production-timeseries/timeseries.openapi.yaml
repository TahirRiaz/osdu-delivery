openapi: 3.0.3
info:
  title: OSDU Production DDMS. Time-series Service
  version: 1.0.0
  description: >
    The Time-series service is part of the OSDU Production Domain Data Management Service (Production DDMS).
    It is used to retrieve time-series bulk data (points, latest values, versions) for individual records or in batch.
  contact:
    email: dps@OSDU.org
    name: OSDU Data Platform Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/pddms/query/v1
    description: OSDU API Gateway
security:
  - BearerAuth: []
tags:
  - name: Info
    description: Service metadata and version information
  - name: Health
    description: Kubernetes health check endpoints
  - name: Timeseries
    description: Query time-series data for single records
  - name: Batch Timeseries
    description: Query time-series data for multiple records in a single request
paths:
  /info:
    get:
      tags:
        - Info
      summary: Detailed version info
      description: Returns build, version, and dependency information, including status of downstream connections (Entitlements, Storage, Timeseries Query, Redis).
      operationId: getDetailedVersionInfo
      parameters:
        - $ref: '#/components/parameters/DataPartitionId'
      responses:
        '200':
          description: Version and dependency information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
              example:
                groupId: org.opengroup.osdu.production.timeseries
                artifactId: pddms-timeseries
                version: 0.1.0-SNAPSHOT
                buildTime: "2026-06-17T02:21:07Z"
                branch: develop
                commitId: 3b7f8f4188a4a4ce12c15ecba95b5095f36928f1
                commitMessage: "Update : Remove unit from response and request"
                connectedOuterServices:
                  - name: OSDU Core Entitlement service
                    version: "N/A"
                  - name: OSDU Core Storage service
                    version: "N/A"
                  - name: PDS Core Timeseries Query service
                    version: "N/A"
                  - name: Redis
                    version: "N/A"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'

  /info/short:
    get:
      tags:
        - Info
      summary: Short version info
      description: Returns basic build artifacts and group/version information.
      operationId: getShortVersionInfo
      parameters:
        - $ref: '#/components/parameters/DataPartitionId'
      responses:
        '200':
          description: Basic service version info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfoShort'
              example:
                groupId: org.opengroup.osdu.production.timeseries
                artifactId: pddms-timeseries
                version: 0.1.0-SNAPSHOT
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'

  /liveness_check:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Kubernetes liveness probe checking if the service is running.
      operationId: livenessCheck
      responses:
        '200':
          description: Service is alive.
          content:
            text/plain:
              schema:
                type: string
                example: Time Series service is alive

  /readiness_check:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Kubernetes readiness probe verifying if the service is fully initialized and can connect to Redis.
      operationId: readinessCheck
      responses:
        '200':
          description: Service is ready.
          content:
            text/plain:
              schema:
                type: string
                example: Time Series Service is ready
        '500':
          description: Service is not ready (e.g. Redis connection down).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppError'

  /production-values/{recordId}/timeseries/{timeseriesId}:
    get:
      tags:
        - Timeseries
      summary: Get time-series data
      description: Retrieves data points for a specific timeseries ID within a ProductionValues record for a given time range.</br><p>Allowed roles&colon; `service.pddms.viewer`,`service.pddms.editor` and `service.pddms.admin`.
      operationId: getTimeSeries
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/TimeseriesId'
        - $ref: '#/components/parameters/StartTimestamp'
        - $ref: '#/components/parameters/EndTimestamp'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/DataPartitionId'
      responses:
        '200':
          description: Time-series data points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              examples:
                singleRecord:
                  summary: Successful response for a single record
                  value:
                    - recordId: opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4277
                      reportingEntityId: 'opendes:master-data--Well:4093'
                      timeseries:
                        - timeseriesId: ESTIMATED_GAS_VOLUME
                          version: 1781669527812
                          start: 978307200000
                          end: 985240800000
                          metadata:
                            nominalPeriodId: 'opendes:reference-data--ReportingPeriod:Day:'
                            quantityMethodId: 'opendes:reference-data--QuantityMethod:Estimated:'
                            durationContextId: 'opendes:reference-data--DurationContext:UptimeHours:'
                            volumeFlowMeasurementTypeId: 'opendes:reference-data--VolumeFlowMeasurementType:Production:'
                            propertyId: 'opendes:reference-data--ProductionPropertyType:Volume:'
                            unitQuantityId: 'opendes:reference-data--UnitQuantity:volume%20per%20time:'
                            productId: 'opendes:reference-data--ProductKind:Gas:'
                            dispositionId: 'opendes:reference-data--DispositionType:Sold:'
                            parameterKindId: 'opendes:reference-data--ParameterKind:Double:'
                            unitOfMeasureId: 'opendes:reference-data--UnitOfMeasure:1000%20m3%2Fd:'
                          pointsCount: 3
                          points:
                            - timestamp: 978307200000
                              value: 1.2
                            - timestamp: 978310800000
                              value: 2.2
                            - timestamp: 978314400000
                              value: 3.2
                          result:
                            code: 200
                            reason: OK
                            message: OK
                      result:
                        code: 200
                        reason: OK
                        message: OK
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

  /production-values/{recordId}/timeseries/{timeseriesId}/versions/{version}:
    get:
      tags:
        - Timeseries
      summary: Get time-series data by version
      description: Retrieves data points for a specific timeseries ID and version within a ProductionValues record.</br><p>Allowed roles&colon; `service.pddms.viewer`,`service.pddms.editor` and `service.pddms.admin`.
      operationId: getTimeSeriesByVersion
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/TimeseriesId'
        - name: version
          in: path
          description: Specific time-series version timestamp (Unix epoch milliseconds).
          required: true
          schema:
            type: integer
            format: int64
            example: 1781669527812
        - $ref: '#/components/parameters/StartTimestamp'
        - $ref: '#/components/parameters/EndTimestamp'
        - $ref: '#/components/parameters/DataPartitionId'
      responses:
        '200':
          description: Time-series data points for the requested version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              examples:
                versionSnapshot:
                  summary: Time-series snapshot at a specific version
                  value:
                    - recordId: opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4277
                      reportingEntityId: 'opendes:master-data--Well:4093'
                      timeseries:
