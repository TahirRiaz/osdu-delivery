  /production-values/batch/timeseries:
    post:
      tags:
        - Batch Timeseries
      summary: Get time-series for multiple records
      description: Batch query time-series data for a collection of records and timeseries IDs.</br><p>Allowed roles&colon; `service.pddms.viewer`,`service.pddms.editor` and `service.pddms.admin`.
      operationId: getTimeSeriesBatch
      parameters:
        - $ref: '#/components/parameters/StartTimestamp'
        - $ref: '#/components/parameters/EndTimestamp'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/DataPartitionId'
      requestBody:
        description: Mapping of record IDs and associated timeseries IDs.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTimeSeriesBatchRequest'
            example:
              productionValues:
                - recordId: >-
                    opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4270
                  timeseries:
                    - ESTIMATED_OIL_VOLUME
                    - ESTIMATED_GAS_VOLUME
                - recordId: >-
                    opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4277
                  timeseries:
                    - ESTIMATED_CONDENSATE_VOLUME
      responses:
        '200':
          description: Successfully retrieved all time-series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              examples:
                successful:
                  summary: Successful batch response
                  value:
                    - recordId: >-
                        opendes:work-product-component--ProductionValues:5985136c-75f0-5585-91ba-a90f506a4270
