openapi: 3.1.0
info:
  title: External Data Sources Data Management Service APIs
  description: Service that enables/facilitates the retrieval of third-party datasets
  contact:
    name: OSDU Data Platform Team
    email: dps@OSDU.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 2.0.0
servers:
- url: /api/eds/v1/
security:
- Authorization: []
tags:
- name: info-api
  description: Version info endpoint
- name: health-check-api
  description: Health Check API
- name: eds-dms-api
  description: EdsDms related endpoints
paths:
  /retrievalInstructions:
    post:
      tags:
      - eds-dms-api
      summary: Get Retrieval Instructions
      description: "The API returns a list of external retrieval instructions from\
        \ external dataset service/wrapper Allowed roles: service.eds.user."
      operationId: getRetrievalInstructions
      parameters:
      - name: Content-Type
        in: header
        description: The file type/format of the request body
        required: true
        schema:
          type: string
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalInstructionsRequest"
        required: true
      responses:
        "200":
          description: All kinds retrieved successfully
          content:
            application/json:
              schema:
                type: string
        "400":
          description: Invalid entity format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "403":
          description: User not authorized to perform the action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "502":
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
      security:
      - Authorization: []
  /info:
    get:
      tags:
      - info-api
      summary: info
      description: "For deployment available public `/info` endpoint, which provides\
        \ build and git related information."
      operationId: info
      parameters:
      - name: Content-Type
        in: header
        description: The file type/format of the request body
        required: true
        schema:
          type: string
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Version info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /health/readiness_check:
    get:
      tags:
      - health-check-api
      summary: Readiness Check endpoint
      description: "For deployment available public `/readiness_check` endpoint, which\
        \ provides `External Data Sources Data Management Service is ready` message."
      operationId: readinessCheck
      parameters:
      - name: Content-Type
        in: header
        description: The file type/format of the request body
        required: true
        schema:
          type: string
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: External Data Sources Data Management Service
          content:
            application/json:
              schema:
                type: string
  /health/liveness_check:
    get:
      tags:
      - health-check-api
      summary: Liveness Check endpoint
      description: "For deployment available public `/liveness_check` endpoint, which\
        \ provides `External Data Sources Data Management Service is alive` message."
      operationId: livenessCheck
      parameters:
      - name: Content-Type
        in: header
        description: The file type/format of the request body
        required: true
        schema:
          type: string
      - name: data-partition-id
        in: header
        description: Tenant Id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: External Data Sources Data Management Service is alive
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    RetrievalInstructionsRequest:
      type: object
      properties:
        datasetRegistryIds:
          type: array
          items:
            type: string
    AppError:
      type: object
      description: Standard error response returned by OSDU services.
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        reason:
          type: string
          description: Short error reason.
          example: Bad Request
        message:
          type: string
          description: Detailed error message.
          example: Invalid record format.
    ConnectedOuterService:
      type: object
      description: Name and version of an external service that this OSDU service
        connects to.
      properties:
        name:
          type: string
          description: Name of the connected external service.
          example: storage
        version:
          type: string
          description: Version of the connected external service.
          example: 2.0.0
    FeatureFlagState:
      type: object
      description: State of a feature flag for a given partition and source.
      properties:
        name:
          type: string
          description: Name of the feature flag.
          example: collaborations-api
        enabled:
          type: boolean
          description: Whether the feature flag is currently enabled.
          example: true
        partition:
          type: string
          description: Data partition this flag applies to.
          example: opendes
        source:
          type: string
          description: Source configuration that provided this flag state.
          example: runtime
    VersionInfo:
      type: object
      description: Version and build information for an OSDU service.
      properties:
        groupId:
          type: string
          description: Maven group ID of the service artifact.
          example: org.opengroup.osdu
        artifactId:
          type: string
          description: Maven artifact ID of the service.
          example: os-search
        version:
          type: string
          description: Semantic version of the deployed service.
          example: 0.27.0
        buildTime:
          type: string
          description: ISO 8601 timestamp of the build.
          example: 2021-01-26T02:24:13.843Z
        branch:
          type: string
          description: Source control branch from which the service was built.
          example: main
        commitId:
          type: string
          description: Short commit SHA of the build.
          example: "7777777"
        commitMessage:
          type: string
          description: Commit message of the build.
          example: initial commit
        connectedOuterServices:
          type: array
          description: List of external services this service depends on.
          items:
            $ref: "#/components/schemas/ConnectedOuterService"
        featureFlagStates:
          type: array
          description: "Current feature flag states for this partition, if any."
          items:
            $ref: "#/components/schemas/FeatureFlagState"
  securitySchemes:
    Authorization:
      type: http
      name: Authorization
      in: header
      scheme: bearer
      bearerFormat: Authorization
