<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc" font-family="&#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif">
<title id="title">OSDU Delivery: the views of the C4 model</title>
<desc id="desc">Every view of the model, by level; each links to its diagram.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L12,6 L0,11 z" fill="#475569"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<rect x="48" y="34" width="79.2" height="22" rx="11" fill="#E8F1FB"/>
<text x="87.6" y="49.5" font-size="11.5" fill="#1168BD" font-weight="bold" text-anchor="middle">C4 MODEL</text>
<text x="48.0" y="92.0" font-size="28" fill="#0F172A" font-weight="600" text-anchor="start">OSDU Delivery in the C4 model</text>
<text x="48.0" y="120.0" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Each view answers one question, from the product&#x27;s place among people and systems down to the components inside each container, how a record, a question</text>
<text x="48.0" y="140.0" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">and a commit move, and how it is deployed.</text>
<text x="48.0" y="176.0" font-size="11.5" fill="#64748B" font-weight="bold" text-anchor="start">CONTEXT</text>
<text x="356.0" y="176.0" font-size="11.5" fill="#64748B" font-weight="bold" text-anchor="start">CONTAINERS</text>
<text x="664.0" y="176.0" font-size="11.5" fill="#64748B" font-weight="bold" text-anchor="start">COMPONENTS</text>
<text x="972.0" y="176.0" font-size="11.5" fill="#64748B" font-weight="bold" text-anchor="start">DYNAMIC</text>
<text x="1280.0" y="176.0" font-size="11.5" fill="#64748B" font-weight="bold" text-anchor="start">DEPLOYMENT</text>
<polyline points="320.0,265.0 338.0,265.0 338.0,265.0 356.0,265.0" fill="none" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="628.0,265.0 646.0,265.0 646.0,265.0 664.0,265.0" fill="none" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="628.0,265.0 646.0,265.0 646.0,431.0 664.0,431.0" fill="none" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="628.0,265.0 646.0,265.0 646.0,597.0 664.0,597.0" fill="none" stroke="#CBD5E1" stroke-width="1.5" marker-end="url(#arrow)"/>
<a href="system-context.svg" xlink:href="system-context.svg">
<rect x="48.0" y="190.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="48.0" y="190.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="68.0" y="214.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 LEVEL 1 · SYSTEM CONTEXT</text>
<text x="68.0" y="236.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">System Context diagram for</text>
<text x="68.0" y="255.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">OSDU Delivery</text>
<text x="68.0" y="280.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">Who uses OSDU Delivery, where its data</text>
<text x="68.0" y="296.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">comes from and goes, and what it relies on.</text>
</a>
<a href="containers.svg" xlink:href="containers.svg">
<rect x="356.0" y="190.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="356.0" y="190.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="376.0" y="214.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 LEVEL 2 · CONTAINERS</text>
<text x="376.0" y="236.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Container diagram for OSDU</text>
<text x="376.0" y="255.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Delivery</text>
<text x="376.0" y="280.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">The nine deployable parts, what each runs,</text>
<text x="376.0" y="296.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">and how they reach each other and the</text>
<text x="376.0" y="312.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">systems around them.</text>
</a>
<a href="ai-usage.svg" xlink:href="ai-usage.svg">
<rect x="356.0" y="356.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="356.0" y="356.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="376.0" y="380.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 LEVEL 2 · AI USAGE</text>
<text x="376.0" y="402.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Container diagram for OSDU</text>
<text x="376.0" y="421.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Delivery, every path to an AI</text>
<text x="376.0" y="446.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">Every place a model is called, what it is sent,</text>
<text x="376.0" y="462.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">and the fences around it.</text>
</a>
<a href="control-plane.svg" xlink:href="control-plane.svg">
<rect x="664.0" y="190.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="664.0" y="190.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="684.0" y="214.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 LEVEL 3 · COMPONENTS</text>
<text x="684.0" y="236.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Component diagram for the</text>
<text x="684.0" y="255.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">control plane</text>
<text x="684.0" y="280.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">Inside the control plane: the API, the node</text>
<text x="684.0" y="296.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">protocol, the scheduler, the sync, direct</text>
<text x="684.0" y="312.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">operations and the assistant.</text>
</a>
<a href="compute-node.svg" xlink:href="compute-node.svg">
<rect x="664.0" y="356.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="664.0" y="356.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="684.0" y="380.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 LEVEL 3 · COMPONENTS</text>
<text x="684.0" y="402.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Component diagram for the</text>
<text x="684.0" y="421.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">compute node</text>
<text x="684.0" y="446.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">Inside a node: how a run lands files, keys</text>
<text x="684.0" y="462.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">rows, renders records, sends them and</text>
<text x="684.0" y="478.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">writes the ledger.</text>
</a>
<a href="mcp-server.svg" xlink:href="mcp-server.svg">
<rect x="664.0" y="522.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="664.0" y="522.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="684.0" y="546.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 LEVEL 3 · COMPONENTS</text>
<text x="684.0" y="568.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Component diagram for the MCP</text>
<text x="684.0" y="587.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">server</text>
<text x="684.0" y="612.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">Inside the MCP server: two transports, one</text>
<text x="684.0" y="628.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">set of rules, estate and data tools, the</text>
<text x="684.0" y="644.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">documentation.</text>
</a>
<a href="record-delivery.svg" xlink:href="record-delivery.svg">
<rect x="972.0" y="190.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="972.0" y="190.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="992.0" y="214.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 DYNAMIC · DATA</text>
<text x="992.0" y="236.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Dynamic diagram: a source row</text>
<text x="992.0" y="255.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">becomes an OSDU record</text>
<text x="992.0" y="280.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">One record&#x27;s path, numbered: from a</text>
<text x="992.0" y="296.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">dropped file to the OSDU id and version the</text>
<text x="992.0" y="312.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">ledger keeps.</text>
</a>
<a href="question.svg" xlink:href="question.svg">
<rect x="972.0" y="356.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="972.0" y="356.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="992.0" y="380.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 DYNAMIC · AI</text>
<text x="992.0" y="402.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Dynamic diagram: a ! question</text>
<text x="992.0" y="421.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">answered from approved data</text>
<text x="992.0" y="446.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">A data question, numbered: delegated</text>
<text x="992.0" y="462.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">token, model, MCP tools, the column guard,</text>
<text x="992.0" y="478.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">a node&#x27;s read-only query.</text>
</a>
<a href="git-integration.svg" xlink:href="git-integration.svg">
<rect x="972.0" y="522.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="972.0" y="522.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="992.0" y="546.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 DYNAMIC · GIT</text>
<text x="992.0" y="568.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Dynamic diagram: a commit</text>
<text x="992.0" y="587.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">becomes the runs that execute it</text>
<text x="992.0" y="612.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">Git, numbered: push, a trigger proved by</text>
<text x="992.0" y="628.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">GitHub&#x27;s token, the App&#x27;s short-lived tokens,</text>
<text x="992.0" y="644.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">the sync, the pinned checkout.</text>
</a>
<a href="deployment-azure.svg" xlink:href="deployment-azure.svg">
<rect x="1280.0" y="190.0" width="272.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<rect x="1280.0" y="190.0" width="6" height="150.0" rx="3" fill="#1168BD"/>
<text x="1300.0" y="214.0" font-size="10.5" fill="#1168BD" font-weight="bold" text-anchor="start">C4 DEPLOYMENT · AZURE</text>
<text x="1300.0" y="236.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Deployment diagram for OSDU</text>
<text x="1300.0" y="255.0" font-size="15" fill="#0F172A" font-weight="bold" text-anchor="start">Delivery on Azure Container</text>
<text x="1300.0" y="280.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">What osdu/deploy/terraform creates: four</text>
<text x="1300.0" y="296.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">container apps, Azure SQL, ADLS, Key Vault,</text>
<text x="1300.0" y="312.0" font-size="12" fill="#64748B" font-weight="normal" text-anchor="start">AI Foundry, identities.</text>
</a>
<line x1="48" y1="852" x2="1552" y2="852" stroke="#E2E8F0"/>
<text x="48.0" y="876.5" font-size="12" fill="#334155" font-weight="normal" text-anchor="start">Every card opens its view; every view links back here and to the level above it. The dynamic and deployment views draw the containers.</text>
<text x="1552.0" y="876.5" font-size="11.5" fill="#94A3B8" font-weight="normal" text-anchor="end">OSDU Delivery, powered by SQLFlow</text>
</svg>
