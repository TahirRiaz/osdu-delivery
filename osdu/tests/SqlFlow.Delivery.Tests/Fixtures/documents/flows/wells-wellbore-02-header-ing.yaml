# Ingestion: the typed wellbore view into the keyed ingestion table the OSDU flow reads.
flowType: ing
name: wells-wellbore-02-header-ing
batch: wells

connections:
  sample: ${env:OSDU_SAMPLE_DB}

source:
  server: sample
  object: OsduSample.pre.v_Wellbore

target:
  server: sample
  object: OsduSample.ing.Wellbore
  # The identity primary key every ingestion table carries: the clustered key the other indexes point at, and the
  # column the OSDU flow pages and fans out by (source.record.primaryKey).
  identityColumn: RecId

load:
  keyColumns: [facility_name]

systemColumns:
  insertedDate: true
  updatedDate: true

incremental:
  columns: [FileDate_DW]
