# The multi-item acquire shape: one shared S3 source (bucket, credentials, region, modified-within window) lands
# several datasets, each selected by its own prefix and written to its own raw location. This folds what would
# otherwise be four near-identical single-landing acq files into one. The top-level `landing:` block carries the
# shared defaults (pathTemplate/format) that every item inherits; each item supplies only its `prefix` and `target`.
flowType: acq
name: Mobilapp
batch: mobilapp

source:
  transport: s3
  baseUrl: s3://elasticsearch-export-kolumbus-84bbd7a312abd27d
  options:
    region: eu-west-1
    accessKey: ${keyvault:sqlflow-v3-secrets/aws-kolumbus-export-access-key}
    secretKey: ${keyvault:sqlflow-v3-secrets/aws-kolumbus-export-secret-key}
    modifiedWithinDays: "10"

landing:
  pathTemplate: "history/{yyyy}/{filename}"
  format: auto

items:
  - prefix: export_appinstances
    target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/mobilapp/aws/appinstances
  - prefix: export_orders
    target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/mobilapp/aws/orders
  - prefix: export_payments
    target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/mobilapp/aws/payments
  - prefix: export_passengers/
    target: abfss://datalakev2@dwdatalakeprodv2.dfs.core.windows.net/raw/mobilapp/aws/passengers
