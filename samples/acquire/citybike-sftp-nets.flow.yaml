# Ports citybike-sftp-nets.ps1: an SFTP source. Lists the remote directory, keeps files modified in the last
# 3 days, and lands each XML file verbatim (the downstream xml flow parses it).
flowType: acq
name: Citybike_Nets_Settlement
batch: citybike

source:
  transport: sftp
  baseUrl: sftp://91.102.25.29:22
  options:
    username: Bysykkelen
    password: ${keyvault:dw-keyvault-prod/citybike-sftp-nets-password}
    remotePath: /outbound
    pattern: "*.xml"
    modifiedWithinDays: "3"

landing:
  target: abfss://datalakev2@dwdatalakestorev2prod.dfs.core.windows.net/raw/citybike/sftp/nets
  pathTemplate: "history/{yyyy}/{filename}"
  format: xml
