# Mapping: a source system's wellbores into the Wellbore 1.3.0 template (docs/delivery/mapping-templates.md).
#
# The master data the well logs hang off, and the shape a source sends when it submits records through the API rather
# than preparing a drop (docs/delivery/submitting-records.md): what a source system holds about a wellbore, plus its
# alternative names as the child dataset "aliases". Nothing here streams payload files, so a flow that renders with this
# mapping takes records inline as well as from a drop.
documentType: mapping
name: Wellbore
version: 1.0.0
template:
  kind: osdu:wks:master-data--Wellbore:1.3.0
  version: 58d6bdbd9d066a06
description: Wellbore master data (one record per wellbore) with its alternative names.

dataset:
  system: recall
  # The wellbore's name is what the source system knows it by and what every well log references, so it is the key
  # (design.md section 5.1). Both halves derive the same delivery key from it with no coordination.
  key: [dataset.facility_name]
  label: "{dataset.facility_name}"

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids are minted in.

mappings:
  - target: osdu.acl.owners
    static: [data.default.owners@opendes.dataservices.energy]
  - target: osdu.acl.viewers
    static: [data.default.viewers@opendes.dataservices.energy]
  - target: osdu.legal.legaltags
    static: [opendes-reference-data-default]
  - target: osdu.legal.otherRelevantDataCountries
    static: [NO]
  - target: osdu.tags.DeliveredBy
    static: osdu-delivery

  - target: osdu.data.FacilityName
    source: dataset.facility_name
    modifiers: [trim]
    description: The wellbore's name, which is also the dataset key.
  - target: osdu.data.FacilityDescription
    source: dataset.facility_description
    modifiers: [trim]
    required: false
  - target: osdu.data.FacilityID
    source: dataset.facility_id
    description: The source system's own identifier for the wellbore, carried as provenance.
    required: false

  # Alternative names: one alias per row of the aliases child dataset. A wellbore without aliases is still delivered.
  - target: osdu.data.NameAliases
    source: dataset.aliases
    required: false
  - target: osdu.data.NameAliases[].AliasName
    source: dataset.aliases.alias_name
  - target: osdu.data.NameAliases[].AliasNameTypeID
    static: "{param.dataPartition}:reference-data--AliasNameType:UniqueIdentifier:"

# Example rows and the exact record each must render to: the mapping's regression suite, which the preflight gate runs
# before every render (design.md section 10.3).
fixtures:
  - name: wellbore A with one alias
    parameters: { dataPartition: opendes }
    record:
      facility_name: " SAMPLE-WELLBORE-A "
      facility_description: Sample wellbore A
      facility_id: "srn:master-data/Wellbore:A"
    datasets:
      aliases:
        - { alias_name: WB-A }
    expected: |
      {
        "id": "opendes:master-data--Wellbore:f94750d909185a369bc4e9743d24e74e",
        "kind": "osdu:wks:master-data--Wellbore:1.3.0",
        "acl": {
          "owners": ["data.default.owners@opendes.dataservices.energy"],
          "viewers": ["data.default.viewers@opendes.dataservices.energy"]
        },
        "legal": {
          "legaltags": ["opendes-reference-data-default"],
          "otherRelevantDataCountries": ["NO"]
        },
        "tags": { "DeliveredBy": "osdu-delivery" },
        "data": {
          "FacilityName": "SAMPLE-WELLBORE-A",
          "FacilityDescription": "Sample wellbore A",
          "FacilityID": "srn:master-data/Wellbore:A",
          "NameAliases": [
            { "AliasName": "WB-A", "AliasNameTypeID": "opendes:reference-data--AliasNameType:UniqueIdentifier:" }
          ]
        }
      }
