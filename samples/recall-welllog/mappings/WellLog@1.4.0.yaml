# Mapping: Recall well log -> osdu:wks:work-product-component--WellLog:1.4.0
#
# This is the render-affecting document (design.md section 9). It declares only what the OSDU schema cannot know:
# the source bindings, the transforms, the natural key and the envelope policy. Types, requiredness and
# relationship targets come from the pinned schema snapshot. Editing this file re-renders and re-hashes every
# record that uses it, so changes go through `plan` and a canary before promotion (section 10.5).
documentType: mapping
name: WellLog
version: 1.4.0
kind: osdu:wks:work-product-component--WellLog:1.4.0
description: Recall well logs (one record per logging run) with curve metadata; the curve grid is streamed as bulk data.

source:
  system: recall
  scopes: [curves]

# The delivery key is UUIDv5 over (source system, source project, log id): the grain the source models
# (design.md section 5.1). See docs/decisions/0001-delivery-grain.md.
identity:
  naturalKey: [data.LogSource, data.LogRun]
  # Display and search only (never in the document): find a wellbore's logs by name in the GUI and the ledger.
  label: "{wellbore_uwi} / {log_name} / run {log_run} ({log_id})"

envelope:
  legalTags: [opendes-reference-data-default]
  otherRelevantDataCountries: [NO]
  acl:
    owners: [data.default.owners@opendes.dataservices.energy]
    viewers: [data.default.viewers@opendes.dataservices.energy]
  tags:
    DeliveredBy: osdu-delivery

parameters:
  dataPartition:
    required: true
    description: The OSDU data partition record ids and references are minted in.

properties:
  # Provenance: the natural key columns are mapped verbatim so the source identity survives in OSDU.
  - target: data.LogSource
    source: source_project
    description: Recall source project (natural key, part 1).
    examples:
      - { source: NO_15_9, target: NO_15_9 }
  - target: data.LogRun
    source: log_id
    description: Recall log id (natural key, part 2).

  - target: data.Name
    source: log_name
    transform: trim
    examples:
      - { source: "STAT_COMP ", target: STAT_COMP }

  - target: data.WellboreID
    source: wellbore_uwi
    transform: reference
    config:
      type: Wellbore
      matchBy: [FacilityName]
      onMiss: hold
    examples:
      - { source: "OSDU-DEV-1-A", target: "opendes:master-data--Wellbore:OSDU-DEV-1-A:" }

  - target: data.LogVersion
    source: log_version
  - target: data.LogActivity
    source: log_pass
    transform: split
    config: { delimiter: ",", index: 0 }
    examples:
      - { source: "MAIN,REPEAT", target: MAIN }
  - target: data.ActivityType
    source: creator
  - target: data.SamplingStart
    source: index_min
  - target: data.SamplingStop
    source: index_max
  - target: data.SamplingInterval
    source: index_increment
  - target: data.TopMeasuredDepth
    source: index_min
  - target: data.BottomMeasuredDepth
    source: index_max
  - target: data.ReferenceCurveID
    transform: constant
    config: { value: MD }
  - target: data.IsRegular
    source: depth_coding
    transform: equals
    config: { resolve: REGULAR }
    examples:
      - { source: REGULAR, target: "true" }
      - { source: DISCRETE, target: "false" }

  - target: data.VerticalMeasurement
    properties:
      - target: VerticalMeasurement
        source: elev_meas_ref
        transform: split
        config: { delimiter: " ", index: 0 }
        examples:
          - { source: "23.5 M", target: "23.5" }
      - target: VerticalMeasurementUnitOfMeasureID
        source: elev_meas_ref
        transform: reference
        config:
          type: UnitOfMeasure
          delimiter: " "
          index: 1
          matchBy: [Code, Name, id]
          valueMap: { M: m, FT: ft }
        examples:
          - { source: "23.5 M", target: "opendes:reference-data--UnitOfMeasure:m:" }
          - { source: "18 FT", target: "opendes:reference-data--UnitOfMeasure:ft:" }
      - target: VerticalMeasurementTypeID
        transform: constant
        config: { value: "{param:dataPartition}:reference-data--VerticalMeasurementType:KellyBushing:" }

  - target: data.Curves
    collection: true
    scope: curves
    definition: Curve

  - target: tags.WellLogNativeUID
    source: native_uid
    transform: split
    config: { delimiter: ",", index: 0 }
    examples:
      - { source: "NO_15_9:L-1001,extra", target: "NO_15_9:L-1001" }

definitions:
  Curve:
    - target: CurveID
      source: curve_id
    - target: CurveUnit
      source: curve_unit
      transform: reference
      config:
        type: UnitOfMeasure
        matchBy: [Code, Name, id]
        # V/V is a volume fraction, which OSDU's reference data calls m3/m3. Mapping it to % would declare values
        # that are hundredths of what the curve actually carries (a 0.21 neutron porosity read as 0.21 percent).
        valueMap: { M: m, METRE: m, METER: m, FT: ft, FEET: ft, GAPI: gAPI, "G/CM3": g/cm3, "V/V": m3/m3 }
        onMiss: hold
      examples:
        - { source: GAPI, target: "opendes:reference-data--UnitOfMeasure:gAPI:" }
        - { source: M, target: "opendes:reference-data--UnitOfMeasure:m:" }
        - { source: "V/V", target: "opendes:reference-data--UnitOfMeasure:m3%2Fm3:" }
    - target: DepthUnit
      source: index_unit
      transform: reference
      config:
        type: UnitOfMeasure
        matchBy: [Code, Name, id]
        valueMap: { M: m, FT: ft }
    - target: TopDepth
      source: index_min
    - target: BaseDepth
      source: index_max
    - target: CurveDescription
      source: curve_description
    - target: CurveVersion
      source: curve_version
    - target: LogCurveBusinessValueID
      source: business_value
      transform: reference
      config:
        type: LogCurveBusinessValue
        matchBy: [Code, Name]
        onMiss: omit

# Whole-document fixtures: a source record and the exact document it must render to under the pinned context.
# They are the per-mapping regression suite the preflight gate runs (design.md section 10.3) and the proof that a
# mapping edit changes only what it meant to change.
