# SQLFlow pipeline - standalone invoke (flowType: inv).
#
# Triggers one Azure Data Factory pipeline or Azure Automation runbook and waits for it to
# finish (polling until the run reaches a terminal state; anything but success fails the run).
# The same 'invokes:' and 'servicePrincipals:' blocks also work inside ing/exp/sp documents,
# where preInvoke/postInvoke reference them as hooks around the load.
#
#   sqlflow validate trigger-refresh.flow.yaml   # check the definition
#   sqlflow run      trigger-refresh.flow.yaml   # trigger and wait
#
# No control database, no registration: the file is the whole pipeline.

flowType: inv
name: trigger-refresh

# ---- SERVICE PRINCIPALS ---------------------------------------------------------
# Secrets never rest in this file: clientSecret must be a whole ${env:NAME} or
# ${keyvault:vault/secret} reference. Omit clientSecret (and tenantId/clientId) to
# authenticate with the ambient Azure credential (managed identity / az login).
servicePrincipals:
  deploy:
    tenantId: 00000000-0000-0000-0000-000000000000
    clientId: 00000000-0000-0000-0000-000000000000
    clientSecret: ${env:SQLFLOW_DEPLOY_SP_SECRET}
    subscriptionId: 00000000-0000-0000-0000-000000000000
    resourceGroup: rg-data
    dataFactoryName: adf-prod              # required for adf invokes
    # automationAccountName: aa-prod       # required for aut invokes

# ---- THE INVOKE -------------------------------------------------------------------
invoke:
  type: adf                                # adf (Data Factory) | aut (Automation)
  pipeline: pl_refresh_marts               # the pipeline (adf) ...
  # runbook: rb_refresh_marts              # ... or the runbook (aut)
  servicePrincipal: deploy
  # Parameters keep their YAML types: plain scalars arrive typed (true is a boolean,
  # 5000 a number); quote a scalar to force a string. Nested maps/lists are passed as
  # JSON objects/arrays.
  parameters:
    environment: prod
    fullLoad: true
    batchSize: 5000

# onErrorResume: true                      # batch behavior when this flow fails
