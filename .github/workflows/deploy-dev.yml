name: Deploy Dev

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-static # Required to bypass network ACLs for the shared container registry
    environment:
      name: dev
      deployment: false
    permissions:
      contents: read # Required to checkout the repository
      id-token: write # Required to login to Azure using OIDC
    strategy:
      fail-fast: true
      matrix:
        image:
          - control-plane
          - gui
          - mcp
          - worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name crwlshareddevsdc

      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: dev-${{ github.run_number }}
        run: |
          docker buildx build --push \
            --file "osdu/deploy/docker/${IMAGE}.Dockerfile" \
            --tag "crwlshareddevsdc.azurecr.io/osdu-delivery-${IMAGE}:${VERSION}" \
            .

  deploy:
    name: Deploy ${{ matrix.image }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read # Required to login to Azure using OIDC
      id-token: write # Required to login to Azure using OIDC
    strategy:
      matrix:
        include:
          - image: control-plane
            app: cp
          - image: gui
            app: gui
          - image: mcp
            app: mcp
          - image: worker
            app: worker
    steps:
      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update container app
        env:
          IMAGE: ${{ matrix.image }}
          APP: ${{ matrix.app }}
          VERSION: dev-${{ github.run_number }}
        run: |
          az containerapp update \
            --name "ca-osdu-delivery-${APP}-dev-sdc" \
            --resource-group rg-wl-osdu-delivery-dev-sdc \
            --image "crwlshareddevsdc.azurecr.io/osdu-delivery-${IMAGE}:${VERSION}"
