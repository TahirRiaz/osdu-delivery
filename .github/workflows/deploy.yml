# # Builds and deploys OSDU Delivery to an Azure Container Apps environment made with the Terraform (osdu/deploy/terraform),
# # through deploy.ps1: the same script, environment files and checks a deploy from a workstation uses (deploy-dev.ps1,
# # deploy-test.ps1, deploy-prod.ps1). Images are built in the environment's registry once per commit and app, the apps
# # are rolled forward to them, each new revision is checked to serve, and one that does not is rolled back.
# #
# # A repository deploys one way, chosen by the repository variable DEPLOY_METHOD: this workflow does nothing unless it is
# # `terraform`. (Radix's workflow is a sample under osdu/deploy/radix; Bicep, compose and Kubernetes deploy by hand.)
# #
# #   - A push to main deploys to dev once CI has passed on it.
# #   - test and prod are promoted by running this workflow by hand (Actions > Deploy > Run workflow), from main; prod waits
# #     for the reviewers its GitHub environment names.
# #   - "infrastructure" plans and applies the environment's Terraform first (its state and variables:
# #     osdu/deploy/terraform/environments/<env>.tfvars and .backend.hcl, or the GitHub environment's copies of them).
# #
# # Each GitHub environment (dev, test, prod) holds:
# #   variables  AZURE_CLIENT_ID, AZURE_TENANT_ID: an identity with a federated credential for
# #              repo:<owner>/<repo>:environment:<env> and the roles osdu/deploy/README.md lists (Deploying from GitHub);
# #              OSDU_ENVIRONMENT_TFVARS, OSDU_ENVIRONMENT_BACKEND (optional, both or neither): the environment's
# #              <env>.tfvars and <env>.backend.hcl whole, for an environment whose values are kept out of the repository
# #              (whose copies then keep their placeholders); tools/github/connect-environment.ps1 sets them;
# #   secrets    TF_VAR_OSDU_PARTITIONS: the OSDU partitions the environment delivers to (a JSON object by partition id,
# #              with no secret in it), read only by "infrastructure". No other secret reaches Terraform: the deployment
# #              generates its own into the estate's vault, and a person puts the rest there (each partition's client
# #              secret, a repository's token).
