name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The vendored-SQLFlow guard walks back to the squashed subtree commit, so it needs
          # the full history, not the default shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            osdu/gui/package-lock.json
            sqlflow/gui/package-lock.json

      # Fail fast: sqlflow/ may only gain generic extension points, each in a commit of its own.
      - name: Vendored SQLFlow guard
        run: bash tools/check-vendored-sqlflow.sh

      - name: Restore
        run: dotnet restore OsduDelivery.sln

      # Zero warnings is a project rule, so a warning fails the build. The SSH.NET advisory in vendored
      # SQLFlow stays a warning until SQLFlow takes the fix (docs/go-live-map.md, SEC-4).
      - name: Build
        run: dotnet build OsduDelivery.sln --no-restore -c Release -warnaserror -warnnotaserror:NU1903

      # The DB-backed suites run against a SQL Server started for this job, whose password is made
      # here and masked, so no credential lives in the repository. The suites' database allows
      # snapshot isolation, which the delivery chain reads under; the GUI end-to-end suite creates
      # a database of its own on the same server.
      - name: Start SQL Server
        run: |
          password="Ci-$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$password"
          docker run --detach --name mssql --env ACCEPT_EULA=Y --env "MSSQL_SA_PASSWORD=$password" \
            --publish 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec --env "SQLCMDPASSWORD=$password" mssql \
                 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs mssql
            echo "SQL Server did not accept a connection in three minutes." >&2
            exit 1
          fi
          docker exec --env "SQLCMDPASSWORD=$password" mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b \
            -Q "CREATE DATABASE SqlFlowCi; ALTER DATABASE SqlFlowCi SET ALLOW_SNAPSHOT_ISOLATION ON;"
          echo "SQLFLOW_TEST_DB=Server=localhost,1433;Database=SqlFlowCi;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
          echo "SQLFLOW_E2E_CATALOG_DB=Server=localhost,1433;Database=SqlFlowE2E;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"

      # SQLFlow's own suites and the OSDU module's suites, in one run over the solution, one
      # project at a time: the DB-backed suites share the database above and migrate and seed it.
      - name: Test
        run: dotnet test OsduDelivery.sln --no-build -c Release -m:1 --verbosity normal

      - name: Install OSDU GUI dependencies
        working-directory: osdu/gui
        run: npm ci

      # The OSDU GUI compiles the vendored sqlflow/gui sources in place, so this build covers
      # both trees' TypeScript.
      - name: Build OSDU GUI
        working-directory: osdu/gui
        run: npm run build

      - name: Lint OSDU GUI
        working-directory: osdu/gui
        run: npm run lint

      - name: Install SQLFlow GUI dependencies
        working-directory: sqlflow/gui
        run: npm ci

      # SQLFlow's GUI is built on its own as well, so an extension point added to sqlflow/gui is
      # proven to keep SQLFlow's own build working.
      - name: Build SQLFlow GUI
        working-directory: sqlflow/gui
        run: npm run build

      # The suite's setup batches call sqlcmd, which the runner image does not carry; the one in the
      # SQL Server container serves them, reached through a wrapper on the PATH.
      - name: Prepare the OSDU GUI end-to-end suite
        working-directory: osdu/gui
        run: |
          wrapper="$RUNNER_TEMP/sqlcmd-wrapper"
          mkdir -p "$wrapper"
          printf '%s\n' '#!/usr/bin/env bash' \
            'exec docker exec --env SQLCMDPASSWORD mssql /opt/mssql-tools18/bin/sqlcmd "$@"' > "$wrapper/sqlcmd"
          chmod +x "$wrapper/sqlcmd"
          echo "$wrapper" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium

      # The suite starts the control plane and the GUI itself, signs in and drives the pages over the
      # sample estate; its runs only plan, so nothing reaches an OSDU. The hosts run from the Release
      # build above.
      - name: OSDU GUI end-to-end suite
        working-directory: osdu/gui
        env:
          SQLFLOW_E2E_DOTNET_CONFIGURATION: Release
        run: npm run e2e

      - name: Keep the end-to-end report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: osdu-gui-e2e-report
          path: |
            osdu/gui/playwright-report
            osdu/gui/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The three images build from the repository root, as a deployment builds them; nothing is
  # pushed. The control plane image then starts against a SQL Server of its own and has to report
  # ready (its catalog created, SQLFlow's and the OSDU module's migrations applied) and sign in the
  # admin it provisions; the GUI image has to serve its pages and the runtime configuration it is
  # given. The worker image needs a control plane token to start, so it is only built.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the control plane image
        run: docker build -f osdu/deploy/docker/control-plane.Dockerfile -t osdu-delivery-control-plane:ci .

      - name: Build the worker image
        run: docker build -f osdu/deploy/docker/worker.Dockerfile -t osdu-delivery-worker:ci .

      - name: Build the GUI image
        run: docker build -f osdu/deploy/docker/gui.Dockerfile -t osdu-delivery-gui:ci .

      - name: Start the control plane image
        run: |
          sa_password="Ci-$(openssl rand -hex 16)-Aa1"
          admin_password="$(openssl rand -hex 24)"
          signing_key="$(openssl rand -hex 32)"
          bootstrap_secret="$(openssl rand -hex 32)"
          for secret in "$sa_password" "$admin_password" "$signing_key" "$bootstrap_secret"; do
            echo "::add-mask::$secret"
          done

          docker network create images
          docker run --detach --name mssql --network images --env ACCEPT_EULA=Y \
            --env "MSSQL_SA_PASSWORD=$sa_password" mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec --env "SQLCMDPASSWORD=$sa_password" mssql \
                 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs mssql
            echo "SQL Server did not accept a connection in three minutes." >&2
            exit 1
          fi

          # The catalog connection and the admin password reach the host as values of the variables
          # its references name, never as literals in its configuration.
          docker run --detach --name control-plane --network images --publish 8080:8080 \
            --env "SQLFLOW_CATALOG_DB=Server=mssql,1433;Database=OsduDeliveryImage;User ID=sa;Password=$sa_password;TrustServerCertificate=True" \
            --env "ControlPlane__Jwt__SigningKey=$signing_key" \
            --env "ControlPlane__Jwt__BootstrapSecret=$bootstrap_secret" \
            --env ControlPlane__Bootstrap__AllowCreate=true \
            --env ControlPlane__Bootstrap__AdminUsername=ci-admin \
            --env 'ControlPlane__Bootstrap__AdminPasswordReference=${env:CI_ADMIN_PASSWORD}' \
            --env "CI_ADMIN_PASSWORD=$admin_password" \
            --env ControlPlane__Worker__Enabled=false \
            osdu-delivery-control-plane:ci
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 5 http://localhost:8080/health/ready > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs control-plane
            echo "The control plane image did not report ready in three minutes." >&2
            exit 1
          fi

          # Provisioning the admin runs beside start-up, so the first sign-in may come too early.
          body="$(jq -n --arg username ci-admin --arg password "$admin_password" '{username: $username, password: $password}')"
          signed_in=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 5 --header 'Content-Type: application/json' --data "$body" \
                 http://localhost:8080/api/v1/auth/login | jq --exit-status '.accessToken | length > 0' > /dev/null; then
              signed_in=true
              break
            fi
            sleep 2
          done
          if [ "$signed_in" != true ]; then
            docker logs control-plane
            echo "The control plane image did not sign in the admin it provisions." >&2
            exit 1
          fi

      - name: Start the GUI image
        run: |
          docker run --detach --name gui --publish 8081:8080 \
            --env SQLFLOW_API_BASE_URL=https://api.example.test osdu-delivery-gui:ci
          served=false
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 5 http://localhost:8081/config.json > "$RUNNER_TEMP/config.json"; then
              served=true
              break
            fi
            sleep 1
          done
          if [ "$served" != true ] \
             || ! jq --exit-status '.apiBaseUrl == "https://api.example.test"' "$RUNNER_TEMP/config.json" > /dev/null \
             || ! curl --silent --fail --max-time 5 http://localhost:8081/ | grep --quiet '<div id="root">'; then
            docker logs gui
            echo "The GUI image did not serve its pages with the runtime configuration it was given." >&2
            exit 1
          fi

  publish:
    # The images CI just built and started, pushed to the registry the repository names. Off until it names one: set
    # the IMAGE_REGISTRY variable and this job runs, leave it unset and CI behaves exactly as before. Any registry that
    # speaks the Docker protocol works, which is why the registry is a variable rather than a choice made here:
    #   IMAGE_REGISTRY = ghcr.io/<owner> | <name>.azurecr.io | docker.io/<org> | a private mirror
    # ghcr.io signs in with the workflow's own token; every other registry uses the REGISTRY_USERNAME and
    # REGISTRY_PASSWORD secrets (for Azure Container Registry, a token or a service principal).
    #
    # What is pushed: the commit sha always, 'latest' from main, and the version when the ref is a v* tag, so a
    # deployment can name an exact build and a rollback has something to name.
    needs: [ build-test, images ]
    if: github.event_name == 'push' && vars.IMAGE_REGISTRY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to the registry
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          host="${REGISTRY%%/*}"
          if [ "$host" = "ghcr.io" ] && [ -z "$USERNAME" ]; then
            echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          elif [ -n "$USERNAME" ] && [ -n "$PASSWORD" ]; then
            echo "$PASSWORD" | docker login "$host" --username "$USERNAME" --password-stdin
          else
            echo "IMAGE_REGISTRY is '$REGISTRY' and no REGISTRY_USERNAME/REGISTRY_PASSWORD secrets are set." >&2
            echo "Set them, or point IMAGE_REGISTRY at ghcr.io/<owner>, which signs in with this workflow's own token." >&2
            exit 1
          fi

      - name: Build and push the three images
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version=""
          case "$REF" in
            refs/tags/v*) version="${REF#refs/tags/}" ;;
          esac

          for image in control-plane worker gui; do
            repository="${REGISTRY}/osdu-delivery-${image}"
            tags="--tag ${repository}:${SHA}"
            if [ "$REF" = "refs/heads/main" ]; then
              tags="$tags --tag ${repository}:latest"
            fi
            if [ -n "$version" ]; then
              tags="$tags --tag ${repository}:${version}"
            fi

            # Built again rather than reloaded: the images job proves they build and start, this one produces what is
            # pushed, from the same Dockerfile and the same commit.
            docker build -f "osdu/deploy/docker/${image}.Dockerfile" $tags .
            docker push --all-tags "$repository"
            echo "pushed ${repository} (${SHA}${version:+, $version})"
          done
