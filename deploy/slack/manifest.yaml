# Slack app manifest for the SQLFlow assistant. Create the app at https://api.slack.com/apps with
# "From an app manifest", paste this document, and install it to the workspace. Then collect the two
# tokens the bot needs:
#   - App-level token: app settings > Basic Information > App-Level Tokens > Generate, with the
#     connections:write scope. This is the xapp-... Socket Mode credential.
#   - Bot token: app settings > OAuth & Permissions > Bot User OAuth Token (xoxb-...).
# Socket Mode means the bot dials out to Slack; no public request URL is ever configured.

display_information:
  name: SQLFlow
  description: Ask about SQLFlow pipelines, runs, lineage, schedules, and flow YAML
  background_color: "#1a4d7c"

features:
  bot_user:
    display_name: sqlflow
    always_online: true

oauth_config:
  scopes:
    bot:
      # Receive @-mentions in channels.
      - app_mentions:read
      # Read thread replies for conversation context (public channels, private channels, DMs).
      - channels:history
      - groups:history
      - im:history
      # Post answers and the eyes acknowledgement reaction.
      - chat:write
      - reactions:write

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
