# Compute: `sqlflow worker` pods scaled on QUEUE DEPTH by KEDA, not on traffic (workers expose nothing and never
# sit behind the ingress). This manifest is the template for ONE pool: copy it per pool, set SQLFLOW_WORKER_POOL
# and the ScaledObject query's pool predicate. The pin-to-synced-commit default means a freshly scaled pod needs
# no pre-synced state: it claims, materializes the pinned commit from git, executes, and reports back.
#
# Requires KEDA installed in the cluster (https://keda.sh): the mssql scaler polls the catalog for queued runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlflow-worker-default
  namespace: sqlflow
  labels:
    app: sqlflow-worker-default
spec:
  replicas: 1 # KEDA overrides this between minReplicaCount and maxReplicaCount
  selector:
    matchLabels:
      app: sqlflow-worker-default
  template:
    metadata:
      labels:
        app: sqlflow-worker-default
    spec:
      terminationGracePeriodSeconds: 600 # let an in-flight run finish; an interrupted one is requeued anyway
      containers:
        - name: worker
          image: sqlflow-worker:latest # replace with your registry tag
          env:
            - name: SQLFLOW_CATALOG_DB
              valueFrom:
                secretKeyRef: { name: sqlflow-secrets, key: catalog-connection }
            # Empty = untargeted runs only. For a pooled worker set the pool name(s) here AND in the
            # ScaledObject query below.
            - name: SQLFLOW_WORKER_POOL
              value: ""
            - name: SQLFLOW_GIT_TOKEN
              valueFrom:
                secretKeyRef: { name: sqlflow-secrets, key: git-token }
            # Every ${env:...} reference the pool's flows use resolves HERE, on the node, never in the control
            # plane. Mount one entry per reference; sink-connection covers the samples' SQLFlowSinkConStr.
            - name: SQLFlowSinkConStr
              valueFrom:
                secretKeyRef: { name: sqlflow-secrets, key: sink-connection }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: sqlflow-catalog-auth
  namespace: sqlflow
spec:
  secretTargetRef:
    - parameter: connectionString
      name: sqlflow-secrets
      key: catalog-connection
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sqlflow-worker-default
  namespace: sqlflow
spec:
  scaleTargetRef:
    name: sqlflow-worker-default
  minReplicaCount: 0   # scale to zero when the queue is dry
  maxReplicaCount: 10
  cooldownPeriod: 300  # keep a warm worker for five minutes after the queue drains
  pollingInterval: 15
  triggers:
    - type: mssql
      metadata:
        # The replica target is the GREATEST of three catalog-driven terms, so the GUI's fleet controls steer this
        # pool without the control plane ever calling the orchestrator (it only writes catalog rows; KEDA, which
        # already queries the catalog, reads them):
        #   1. queue depth  - one queued run per worker (the original 1:1 autoscale),
        #   2. the always-on floor - [catalog].[WorkerPool].[MinReplicas] ("keep >=1 warm"),
        #   3. an active manual override - [ManualReplicas] while [ManualUntilUtc] is in the future
        #      (a spawn-from-zero or temporary scale-up that reverts on its own).
        # A pool with no WorkerPool row (ISNULL -> 0) behaves exactly as the old COUNT(*) did, so this is backward
        # compatible and preserves scale-to-zero. REQUIRES the WorkerPool table (added by the catalog migration
        # WorkerPoolDesiredAndNodeRestart): deploy the control plane first so the migration lands, then apply this.
        # For a pooled copy of this manifest, change BOTH the run predicate to [TargetPool] = '<pool>' and the two
        # WorkerPool lookups to [Pool] = N'<pool>'.
        query: |-
          SELECT (SELECT MAX(v) FROM (VALUES
            ((SELECT COUNT(*) FROM [catalog].[Run] WHERE [Status] = 'queued' AND [TargetPool] IS NULL)),
            (ISNULL((SELECT [MinReplicas] FROM [catalog].[WorkerPool] WHERE [Pool] = N''), 0)),
            (ISNULL((SELECT CASE WHEN [ManualUntilUtc] > SYSUTCDATETIME() THEN [ManualReplicas] ELSE 0 END
                     FROM [catalog].[WorkerPool] WHERE [Pool] = N''), 0))
          ) AS t(v))
        targetValue: "1"
      authenticationRef:
        name: sqlflow-catalog-auth
