# EXAMPLE ONLY: create the real secret out of band (kubectl create secret / ExternalSecrets / CSI driver), never
# commit real values. Every deployment in this directory references these keys.
apiVersion: v1
kind: Secret
metadata:
  name: sqlflow-secrets
  namespace: sqlflow
type: Opaque
stringData:
  # The catalog database connection string (SQL auth or a managed-identity form your cluster supports).
  catalog-connection: "Server=your-sql-server;Database=SqlFlowCatalog;User ID=sqlflow;Password=CHANGE_ME;TrustServerCertificate=True"
  # HS256 signing key, at least 32 random bytes.
  jwt-signing-key: "CHANGE_ME_32+_RANDOM_BYTES________"
  # Break-glass bootstrap secret, at least 32 bytes; rotate after provisioning real users.
  bootstrap-secret: "CHANGE_ME_32+_RANDOM_BYTES________"
  # The initial admin's password (at least 12 characters); the username lives in the deployment env.
  admin-password: "CHANGE_ME_12+_CHARS"
  # Optional: token for private git remotes (SHA-pinned materialization on workers).
  git-token: ""
  # Every ${env:...} reference the estate's flows declare is mounted on the WORKER deployments, one entry per
  # reference. The sample flow (samples/recall-welllog) names an OSDU client and an APIM subscription key.
  osdu-client-id: "CHANGE_ME"
  osdu-client-secret: "CHANGE_ME"
  apim-key: "CHANGE_ME"
